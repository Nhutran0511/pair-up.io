                <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 3px"}}>Salary Expectation</p><p style={{fontSize:13,fontWeight:700,color:BRAND,margin:0}}>{selected.salary||"—"}</p></div>
                <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 5px"}}>Languages</p><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(selected.languages||[]).map(l=><span key={l.lang} style={{background:BRAND_LIGHT,color:BRAND,fontSize:11,fontWeight:600,padding:"3px 9px",borderRadius:99}}>{l.lang} · {l.level}</span>)}</div></div>
                <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 3px"}}>Available</p><p style={{fontSize:13,margin:0}}>{selected.onboard||"—"}</p></div>
              </div>
              <div style={{marginBottom:"0.875rem"}}><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 4px"}}>Key Skills</p><p style={{fontSize:14,margin:0}}>{selected.skills}</p></div>
              {selected.intro&&<div style={{marginBottom:"1rem"}}><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 4px"}}>Professional Summary</p><p style={{fontSize:14,lineHeight:1.7,margin:0}}>{selected.intro}</p></div>}
              <div style={{background:BRAND_LIGHT,borderRadius:10,padding:"0.875rem 1rem",marginBottom:"1.5rem",display:"flex",alignItems:"center",gap:10,border:`1px solid ${BRAND}22`}}>
                <Icon name="lock" size={16} style={{color:BRAND}}/>
                <span style={{fontSize:12,color:BRAND,fontWeight:600}}>Portfolio and CV links are private and will only be shared after the candidate accepts your request.</span>

              <Btn onClick={()=>setShowContactForm(true)} style={{width:"100%",justifyContent:"center",fontSize:14,padding:"12px"}}><Icon name="send" size={14}/>Contact Request</Btn>

          <div style={{background:"#ffffff",borderRadius:20,width:"100%",maxWidth:580,padding:"2rem",fontFamily:FONT,boxShadow:"0 24px 60px rgba(0,44,118,0.18)"}}>

                  <F label="Contact phone"><input style={inp} value={reqForm.contactPhone} onChange={e=>rfset("contactPhone",e.target.value)}/></F>
                </div>
                <p style={{fontSize:11,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"1rem 0"}}>Role Details</p>
                <F label="Job title" error={reqErrors.title} required><input style={inp} value={reqForm.title} onChange={e=>rfset("title",e.target.value)} placeholder="e.g. Senior Frontend Developer"/></F>
                <F label="Job description" error={reqErrors.jd} required><textarea rows={4} style={{...inp,resize:"vertical"}} value={reqForm.jd} onChange={e=>rfset("jd",e.target.value)} placeholder="Describe the role, responsibilities, and team…"/></F>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>

  );
}

// ── POST JOB PAGE (full page, not modal) ─────────────────────────────────────
const BENEFITS_KEY="pairup_saved_benefits";
const RECRUITMENT_ROUNDS=["Applied","Screening","Test","Interview","Offer","Onboard","Rejected","Pipeline"];
const STAGE_DESCRIPTIONS={Applied:"Application received",Screening:"Initial qualification and screening",Test:"Skills or take-home assessment",Interview:"Hiring team interview",Offer:"Offer stage",Onboard:"New hire onboarding",Rejected:"Candidate not moving forward",Pipeline:"Saved for future consideration"};
const ROUND_REASONS=["Over qualified","Under qualified","Lack of experience","Salary","Culture","Motivation","Career Path","Others"];
const DEFAULT_RECRUITMENT_PROCESS=RECRUITMENT_ROUNDS.map((name)=>({name,enabled:true,description:STAGE_DESCRIPTIONS[name]||""}));

function PostJobPage({onBack,onSuccess,company,session}){
  const [form,setForm]=useState({title:"",company:company?.name||"",summary:"",description:"",requirements:"",benefits:"",salary:"",locations:[],industries:[],field:"",contact:"",deadline:"",recruitmentProcess:DEFAULT_RECRUITMENT_PROCESS.map(x=>({...x}))});
  const [errors,setErrors]=useState({});
  const [done,setDone]=useState(null);
  const [benefitsSaved,setBenefitsSaved]=useState(false);
  const [applyBenefitsToAll,setApplyBenefitsToAll]=useState(false);
  const s=(k,v)=>setForm(f=>({...f,[k]:v}));
  const tl=(l)=>setForm(f=>({...f,locations:f.locations.includes(l)?f.locations.filter(x=>x!==l):[...f.locations,l]}));
  const ti=(i)=>setForm(f=>({...f,industries:f.industries.includes(i)?f.industries.filter(x=>x!==i):[...f.industries,i]}));

  useEffect(()=>{
    // Load saved benefits if any
    ld(BENEFITS_KEY).then(b=>{if(b){setForm(f=>({...f,benefits:b}));setBenefitsSaved(true);}});
  },[]);

  const useSameBenefits=async()=>{
    const saved=await ld(BENEFITS_KEY);
    if(saved){setForm(f=>({...f,benefits:saved}));setBenefitsSaved(true);}
  };

  const saveBenefits=async()=>{
    await sd(BENEFITS_KEY,form.benefits);setBenefitsSaved(true);
  };

  const submit=async()=>{
    const e={};
    if(!form.title.trim())e.title="Required";
    if(!form.company.trim())e.company="Required";
    if(!form.summary.trim())e.summary="Required";
    if(!form.description.trim())e.description="Required";
    if(!form.requirements.trim())e.requirements="Required";

    if(form.locations.length===0)e.locations="Select at least one";
    if(form.industries.length===0)e.industries="Select at least one";
    if(!form.contact.trim())e.contact="Required";
    if(Object.keys(e).length){setErrors(e);return;}
    const code=gjid();
    const job={...form,code,companyCode:session?.code||null,companyEmail:session?.email||null,createdAt:new Date().toISOString(),status:"active",recruitmentProcess:form.recruitmentProcess?.length?form.recruitmentProcess:DEFAULT_RECRUITMENT_PROCESS.map(x=>({...x}))};
    const ex=(await ld(SK.JOBS,true))||[];
    if(applyBenefitsToAll && form.benefits.trim()) await sd(BENEFITS_KEY,form.benefits);
    const jobsToSave=applyBenefitsToAll && form.benefits.trim()
      ? ex.map(existing=>existing.companyCode===session?.code?{...existing,benefits:form.benefits}:existing)
      : ex;
    await sd(SK.JOBS,[...jobsToSave,job],true);
    // Push notification
    const notifs=(await ld(SK.NOTIFS,true))||[];
    notifs.push({id:gid(),type:"job_posted",to:session?.email||"employer",message:`Job posted: ${form.title} at ${form.company}`,jobCode:code,company:form.company,title:form.title,createdAt:new Date().toISOString(),read:false});
    await sd(SK.NOTIFS,notifs,true);
    setDone(code);onSuccess();
  };

  if(done)return(
    <div style={{maxWidth:520,margin:"4rem auto",textAlign:"center",padding:"0 1rem",fontFamily:FONT}}>
      <div style={{width:72,height:72,borderRadius:"50%",background:BRAND_LIGHT,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 1.5rem"}}><Icon name="check" size={34} style={{color:BRAND}}/></div>
      <h2 style={{fontWeight:800,fontSize:24,margin:"0 0 0.5rem",color:BRAND}}>Job posted!</h2>
      <p style={{color:"var(--color-text-secondary)",marginBottom:"2rem",lineHeight:1.6,fontSize:14}}>Your listing is now live on pairup.</p>
      <div style={{background:BRAND_LIGHT,borderRadius:16,padding:"1.5rem 2rem",marginBottom:"1.5rem",border:`1.5px solid ${BRAND}22`}}>
        <p style={{fontSize:11,color:BRAND,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:1.5}}>Job ID</p>
        <p style={{fontFamily:"monospace",fontSize:36,fontWeight:800,color:BRAND,margin:0,letterSpacing:4}}>{done}</p>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"center"}}>
        <Btn variant="outline" onClick={()=>{setDone(null);setForm({title:"",company:company?.name||"",summary:"",description:"",requirements:"",benefits:"",salary:"",locations:[],industries:[],field:"",contact:"",deadline:"",recruitmentProcess:DEFAULT_RECRUITMENT_PROCESS.map(x=>({...x}))});setErrors({});}}>Post another job</Btn>
        <Btn onClick={onBack}>Back to dashboard</Btn>
      </div>
    </div>
  );

  return(
    <div style={{maxWidth:700,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontSize:13,fontWeight:600,fontFamily:FONT,marginBottom:"1.5rem",display:"flex",alignItems:"center",gap:6}}><Icon name="arrow-left" size={14}/>Back to dashboard</button>
      <div style={{marginBottom:"2rem"}}>
        <h1 style={{fontSize:26,fontWeight:800,margin:"0 0 6px",color:BRAND}}>Post a job</h1>
        <p style={{color:"var(--color-text-secondary)",fontSize:13,margin:0}}>All fields are required</p>
      </div>

      <Card>
        <SH icon="briefcase" title="Role Details"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Job title" error={errors.title} required><input style={inp} value={form.title} onChange={e=>s("title",e.target.value)} placeholder="e.g. Senior Frontend Developer"/></F>
          <F label="Company name" error={errors.company} required hint="Locked to your registered company"><input style={{...inp,background:"var(--color-background-secondary)",cursor:"not-allowed"}} value={form.company} disabled/></F>
          <F label="Offered salary" error={errors.salary}><input style={inp} value={form.salary} onChange={e=>s("salary",e.target.value)} placeholder="e.g. 25–35M VND/month"/></F>
          <F label="Field"><select style={inp} value={form.field} onChange={e=>s("field",e.target.value)}><option value="">-- Select --</option>{FIELDS.map(f=><option key={f}>{f}</option>)}</select></F>
          <F label="Contact & email" error={errors.contact} required><input style={inp} value={form.contact} onChange={e=>s("contact",e.target.value)} placeholder="HR Manager — hr@company.com"/></F>
          <F label="Application deadline"><input style={inp} type="date" value={form.deadline} onChange={e=>s("deadline",e.target.value)}/></F>
        </div>
        <F label="Location(s)" error={errors.locations} required>
          <PillSel options={LOCATIONS} selected={form.locations} onToggle={tl} error={errors.locations}/>
        </F>
        <F label="Industry (select all that apply)" error={errors.industries} required>
          <IndustryPicker selected={form.industries} onToggle={ti} error={errors.industries}/>
        </F>
      </Card>

      <Card>
        <SH icon="file-description" title="Job Description"/>
        <F label="Job Summary" error={errors.summary} required hint="A 2–3 sentence overview of the role and its purpose">
          <RichTextEditor value={form.summary} onChange={v=>s("summary",v)} minHeight={70}/>
        </F>
        <F label="Description" error={errors.description} required hint="Detailed day-to-day responsibilities and team context">
          <RichTextEditor value={form.description} onChange={v=>s("description",v)} minHeight={110}/>
        </F>
        <F label="Requirements" error={errors.requirements} required hint="Must-have skills, experience, and qualifications">
          <RichTextEditor value={form.requirements} onChange={v=>s("requirements",v)} minHeight={90}/>
        </F>
        <F label="Benefits" error={errors.benefits} hint="Optional. You can save this and reuse it for future jobs.">
          <div style={{marginBottom:8,display:"flex",gap:8,alignItems:"center"}}>
            {benefitsSaved&&(
              <button type="button" onClick={useSameBenefits} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",borderRadius:8,border:`1.5px solid ${BRAND}`,background:BRAND_LIGHT,color:BRAND,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:FONT,whiteSpace:"nowrap"}}>
                <Icon name="copy" size={12}/>Use same as before
              </button>
            )}
            {form.benefits.trim()&&(
              <button type="button" onClick={saveBenefits} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",borderRadius:8,border:"0.5px solid var(--color-border-secondary)",background:"none",color:"var(--color-text-secondary)",cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:FONT,whiteSpace:"nowrap"}}>
                <Icon name="device-floppy" size={12}/>Save for future use
              </button>
            )}
          </div>
          <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--color-text-primary)",cursor:"pointer",marginBottom:8}}>
            <input type="checkbox" checked={applyBenefitsToAll} onChange={e=>setApplyBenefitsToAll(e.target.checked)} style={{width:16,height:16,accentColor:BRAND}}/>
            <span><strong>Apply these benefits to all other jobs</strong> (existing and future jobs)</span>
          </label>
          <RichTextEditor value={form.benefits} onChange={v=>{s("benefits",v);setBenefitsSaved(false);}} minHeight={80}/>
        </F>
      </Card>

      <Card><SH icon="git-merge" title="Recruitment Process"/><p style={{fontSize:13,color:"var(--color-text-secondary)",marginTop:0}}>Customize the process for this role. You can edit it later from the job detail page.</p>{form.recruitmentProcess.map((r,i)=><div key={r.name} style={{display:"grid",gridTemplateColumns:"160px 1fr",gap:10,alignItems:"start",padding:"10px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}}><div style={{fontWeight:800,color:BRAND,paddingTop:8}}>{r.name}</div><textarea style={{...inp,minHeight:55}} value={r.description||""} onChange={e=>setForm(f=>({...f,recruitmentProcess:f.recruitmentProcess.map((x,idx)=>idx===i?{...x,description:e.target.value}:x)}))}/></div>)}</Card>

      <Btn onClick={submit} style={{width:"100%",justifyContent:"center",fontSize:15,padding:"14px"}}>Post job →</Btn>
    </div>
  );
}

// ── JOBS ───────────────────────────────────────────────────────────────────────
function JobsPage({onApply,session}){
  const [jobs,setJobs]=useState([]);
  const [companies,setCompanies]=useState([]);
  const [filter,setFilter]=useState({location:"",industry:"",years:"",field:""});
  const [selected,setSelected]=useState(null);
  const [form,setForm]=useState({name:"",email:"",phone:"",cvLink:"",portfolio:"",salary:"",onboard:"",consent:false});
  const [errors,setErrors]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const [alreadyApplied,setAlreadyApplied]=useState(false);
  const [appliedCodes,setAppliedCodes]=useState(new Set());
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));

  const load=async()=>{
    const d=(await ld(SK.JOBS,true))||[];
    setJobs(d.filter(j=>j.status==="active"));
    setCompanies((await ld(SK.COMPANIES,true))||[]);
  };
  useEffect(()=>{
    load();
    (async()=>{
      const profile=await ld("pairup_my_profile_"+session.email);
      const apps=(await ld(SK.APPLICATIONS,true))||[];
      setAppliedCodes(new Set(apps.filter(a=>a.candidateCode===session.code||(profile?.email&&a.email===profile.email)).map(a=>a.jobCode)));
    })();
    const iv=setInterval(load,10000); // keep the list fresh as employers post/reactivate jobs
    return ()=>clearInterval(iv);
  },[]);

  const filtered=jobs.filter(j=>
    (!filter.location||(j.locations||[]).includes(filter.location))&&
    (!filter.industry||(j.industries||[]).includes(filter.industry))&&
    (!filter.years||j.years===filter.years)&&
    (!filter.field||j.field===filter.field)
  );

  const openJob=async(j)=>{
    setSelected(j);setSubmitted(false);setErrors({});
    const profile=await ld("pairup_my_profile_"+session.email);
    const applications=(await ld(SK.APPLICATIONS,true))||[];
    const existing=applications.find(a=>a.jobCode===j.code && (a.candidateCode===session.code||(profile?.email&&a.email===profile.email)));
    setAlreadyApplied(!!existing);
    setForm({
      name:profile?.name||"",email:profile?.email||session.email,phone:profile?.phone||"",
      cvLink:profile?.cvLink||"",portfolio:profile?.portfolio||"",salary:profile?.salary||"",
      onboard:profile?.onboard||"",consent:false
    });
  };

  const apply=async()=>{
    if(alreadyApplied)return;
    const e={};
    if(!form.name.trim())e.name="Required";
    if(!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/))e.email="Invalid email";
    if(!form.phone.trim())e.phone="Required";
    if(!form.cvLink.trim())e.cvLink="Required";
    if(!form.salary.trim())e.salary="Required";
    if(!form.onboard)e.onboard="Required";
    if(!form.consent)e.consent="You must agree before applying";
    if(Object.keys(e).length){setErrors(e);return;}
    const profile=await ld("pairup_my_profile_"+session.email);
    const existing=(await ld(SK.APPLICATIONS,true))||[];
    const duplicate=existing.find(a=>a.jobCode===selected.code && (a.candidateCode===session.code||(a.email===form.email)));
    if(duplicate){setAlreadyApplied(true);setAppliedCodes(prev=>new Set([...prev,selected.code]));return;}
    const application={id:gid(),jobCode:selected.code,jobTitle:selected.title,company:selected.company,companyEmail:selected.companyEmail||null,candidateCode:session.code,profileSnapshot:profile||null,...form,createdAt:new Date().toISOString(),status:"applied",profileEvents:[]};
    await sd(SK.APPLICATIONS,[...existing,application],true);
    const notifs=(await ld(SK.NOTIFS,true))||[];
    notifs.push({id:gid(),type:"application",to:selected.companyEmail||"employer",message:`New application for ${selected.title} at ${selected.company}`,title:selected.title,company:selected.company,applicationId:application.id,candidateCode:application.candidateCode,createdAt:new Date().toISOString(),read:false});
    await sd(SK.NOTIFS,notifs,true);
    setAlreadyApplied(true);setAppliedCodes(prev=>new Set([...prev,selected.code]));setSubmitted(true);onApply();
  };

  return(
    <div style={{maxWidth:1200,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      <h1 style={{fontSize:26,fontWeight:800,marginBottom:4}}>Jobs</h1>
      <p style={{color:"var(--color-text-secondary)",fontSize:13,marginBottom:"1.5rem"}}>Browse all active jobs posted on pairup.</p>
      <Card style={{marginBottom:"1.5rem"}}>
        <SH icon="filter" title="Filters"/>
        <FilterPills title="Location" options={LOCATIONS} value={filter.location} onChange={v=>setFilter(f=>({...f,location:v}))} inline={4}/>
        <FilterPills title="Field" options={FIELDS} value={filter.field} onChange={v=>setFilter(f=>({...f,field:v}))} inline={6}/>
        <FilterPills title="Industry" options={INDUSTRIES} value={filter.industry} onChange={v=>setFilter(f=>({...f,industry:v}))} inline={5}/>
        <FilterPills title="Experience" options={YEARS_OPTS} value={filter.years} onChange={v=>setFilter(f=>({...f,years:v}))} inline={6}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4,paddingTop:8,borderTop:"0.5px solid var(--color-border-tertiary)"}}>
          <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}><strong>{filtered.length}</strong> job{filtered.length!==1?"s":""} found</p>
          <button onClick={()=>setFilter({location:"",industry:"",years:"",field:""})} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:BRAND,fontFamily:FONT,fontWeight:600}}>Clear all filters</button>
        </div>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filtered.map(j=>(
          <button key={j.code} onClick={()=>openJob(j)} style={{textAlign:"left",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:14,padding:"1.25rem",cursor:"pointer",fontFamily:FONT}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:16,alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:5}}><Badge color="blue">{j.field||"Job"}</Badge><span style={{fontFamily:"monospace",fontSize:11,color:BRAND_DIM}}>{j.code}</span></div>
                <h2 style={{fontSize:18,fontWeight:800,color:BRAND,margin:"0 0 5px"}}>{j.title}</h2>
                <p style={{fontSize:13,fontWeight:600,margin:"0 0 8px"}}>{j.company}</p>
                <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}>{(j.locations||[]).join(" · ")} · {(j.industries||[]).join(", ")}{j.salary?` · ${j.salary}`:""}</p>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {appliedCodes.has(j.code)&&<Badge color="green">Applied</Badge>}
                <Icon name="chevron-right" size={18} style={{color:BRAND_DIM,marginTop:5}}/>
              </div>
            </div>
          </button>
        ))}
        {filtered.length===0&&<div style={{textAlign:"center",padding:"3rem",color:"var(--color-text-secondary)",background:"var(--color-background-primary)",borderRadius:16}}>No jobs match your filters.</div>}
      </div>

      {selected&&<div style={{position:"fixed",inset:0,background:"rgba(0,30,80,0.45)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:300,padding:"2rem 1rem",overflowY:"auto"}}>
        <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:1000,padding:"2rem",fontFamily:FONT}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"1.5rem"}}>
            <div><Badge color="blue">{selected.field||"Job"}</Badge><h2 style={{fontSize:24,fontWeight:800,color:BRAND,margin:"8px 0 4px"}}>{selected.title}</h2><p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>{selected.company} · {(selected.locations||[]).join(", ")}</p></div>
            <button onClick={()=>setSelected(null)} style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",fontSize:16,color:BRAND,width:32,height:32,borderRadius:"50%"}}>✕</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 280px",gap:"1.5rem",alignItems:"start"}}>
            <div>
              <Card><h3 style={{fontSize:12,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"0 0 10px"}}>Job Description</h3><p style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",margin:"0 0 1rem"}} dangerouslySetInnerHTML={{__html:selected.summary||""}}/><div style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",margin:"0 0 1rem"}} dangerouslySetInnerHTML={{__html:selected.description||""}}/><h4 style={{fontSize:12,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"1rem 0 8px"}}>Requirements</h4><div style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",margin:"0 0 1rem"}} dangerouslySetInnerHTML={{__html:selected.requirements||""}}/>{selected.benefits&&<><h4 style={{fontSize:12,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"1rem 0 8px"}}>Benefits</h4><div style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",margin:0}} dangerouslySetInnerHTML={{__html:selected.benefits||""}}/></>}</Card>
              {alreadyApplied||submitted?<div style={{textAlign:"center",background:BRAND_LIGHT,borderRadius:14,padding:"2rem"}}><Icon name="check-circle" size={36} style={{color:BRAND}}/><h3 style={{color:BRAND,margin:"8px 0"}}>{submitted?"Application submitted!":"Applied"}</h3><p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>{submitted?`You've successfully applied for ${selected.title}. You can track its status under "Applied Jobs".`:"You have already applied for this position."}</p></div>:(<>
                <Card><SH icon="user-circle" title="Apply for this position"/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}><F label="Full name" error={errors.name} required><input style={inp} value={form.name} onChange={e=>sf("name",e.target.value)}/></F><F label="Email" error={errors.email} required><input style={inp} type="email" value={form.email} onChange={e=>sf("email",e.target.value)}/></F><F label="Phone number" error={errors.phone} required><input style={inp} value={form.phone} onChange={e=>sf("phone",e.target.value)}/></F><F label="CV link" error={errors.cvLink} required><input style={inp} type="url" value={form.cvLink} onChange={e=>sf("cvLink",e.target.value)} placeholder="https://..."/></F><F label="Portfolio link"><input style={inp} type="url" value={form.portfolio} onChange={e=>sf("portfolio",e.target.value)} placeholder="https://..."/></F><F label="Salary expected" error={errors.salary} required><input style={inp} value={form.salary} onChange={e=>sf("salary",e.target.value)} placeholder="e.g. 35M VND/month"/></F><F label="Available to start" error={errors.onboard} required><select style={inp} value={form.onboard} onChange={e=>sf("onboard",e.target.value)}><option value="">-- Select --</option>{ONBOARD_OPTS.map(o=><option key={o}>{o}</option>)}</select></F></div></Card>
                <label style={{display:"flex",alignItems:"flex-start",gap:10,padding:"1rem",background:"#F8F9FB",borderRadius:10,border:`1px solid ${form.consent?BRAND:"var(--color-border-tertiary)"}`,cursor:"pointer",marginBottom:"1rem"}}><input type="checkbox" checked={form.consent} onChange={e=>sf("consent",e.target.checked)} style={{marginTop:3,accentColor:BRAND,width:16,height:16,flexShrink:0}}/><span style={{fontSize:12,color:"var(--color-text-primary)",lineHeight:1.6}}>I agree that my personal information and application details may be stored and processed for this job application. This consent is required to apply.</span></label>{errors.consent&&<p style={{fontSize:11,color:"#E24B4A",margin:"-6px 0 10px"}}>{errors.consent}</p>}
                <Btn onClick={apply} style={{width:"100%",justifyContent:"center",fontSize:14,padding:"13px"}}>Apply →</Btn>
              </>)}
            </div>
            <div>
              {(()=>{const jc=companies.find(c=>c.code===selected.companyCode);return(
                <Card style={{position:"sticky",top:16}}>
                  <SH icon="building" title="About the company"/>
                  <h4 style={{fontSize:15,fontWeight:800,color:BRAND,margin:"0 0 6px"}}>{selected.company}</h4>
                  {jc?(<>
                    <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:"0 0 10px"}}>{jc.industry}{jc.teamSize?` · ${jc.teamSize} employees`:""}</p>
                    {jc.address&&<p style={{fontSize:12,margin:"0 0 8px",display:"flex",gap:6}}><Icon name="map-pin" size={13} style={{color:BRAND_DIM,flexShrink:0,marginTop:2}}/>{jc.address}</p>}
                    {jc.website&&<p style={{fontSize:12,margin:"0 0 10px",display:"flex",gap:6}}><Icon name="world" size={13} style={{color:BRAND_DIM,flexShrink:0,marginTop:2}}/><a href={jc.website} target="_blank" rel="noreferrer" style={{color:BRAND}}>{jc.website}</a></p>}
                    {jc.intro&&<p style={{fontSize:13,lineHeight:1.7,margin:0,paddingTop:8,borderTop:"0.5px solid var(--color-border-tertiary)"}}>{jc.intro}</p>}
                  </>):(
                    <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0,fontStyle:"italic"}}>No additional company information provided.</p>
                  )}
                </Card>
              );})()}
            </div>
          </div>
        </div>
      </div>}
    </div>
  );
}

// ── EMPLOYER ──────────────────────────────────────────────────────────────────
function EmployerPage({onPost,refresh,session,company,onCompanyUpdated}){
  const [postingJob,setPostingJob]=useState(false);
  const [jobsAll,setJobsAll]=useState([]);
  const [requestsAll,setRequestsAll]=useState([]);
  const [applications,setApplications]=useState([]);
  const [candidates,setCandidates]=useState([]);
  const [tab,setTab]=useState("employer");
  const [selectedJob,setSelectedJob]=useState(null);
  const [viewingC,setViewingC]=useState(null);
  const [jobView,setJobView]=useState("pipeline");
  const [selectedRound,setSelectedRound]=useState("Applied");
  const [selectedApp,setSelectedApp]=useState(null);
  const [viewingRequest,setViewingRequest]=useState(null);

  const load=async()=>{
    setJobsAll((await ld(SK.JOBS,true))||[]);
    setRequestsAll((await ld(SK.REQUESTS,true))||[]);
    setApplications((await ld(SK.APPLICATIONS,true))||[]);
    setCandidates((await ld(SK.CANDIDATES,true))||[]);
  };
  useEffect(()=>{load();},[refresh]);

  // Scope this employer's own company data
  const jobs=jobsAll.filter(j=>j.companyCode===session.code);
  const requests=requestsAll.filter(r=>r.companyCode===session.code);

  // ── Contact requests: candidate CV/portfolio & full contact info is revealed to
  // the employer only ONCE, the first time an accepted request is opened. After
  // that — even after navigating away and back, or reloading — it stays masked.
  const openRequest=async(r)=>{
    if(r.status==="accepted"&&!r.viewedByEmployer){
      const all=(await ld(SK.REQUESTS,true))||[];
      const idx=all.findIndex(x=>x.id===r.id);
      const viewedAt=new Date().toISOString();
      if(idx>=0){ all[idx]={...all[idx],viewedByEmployer:true,viewedAt}; await sd(SK.REQUESTS,all,true); }
      setRequestsAll(all);
      setViewingRequest({...r,viewedByEmployer:true,viewedAt,__firstView:true});
    }else{
      setViewingRequest(r);
    }
  };

  const appsForJob=code=>applications.filter(a=>a.jobCode===code);
  const currentJob=selectedJob?jobs.find(j=>j.code===selectedJob.code)||selectedJob:null;

  const normalizeJob=j=>({
    ...j,
    recruitmentProcess:j.recruitmentProcess?.length?j.recruitmentProcess:DEFAULT_RECRUITMENT_PROCESS.map(x=>({...x}))
  });

  const saveJob=async(updated)=>{
    const all=(await ld(SK.JOBS,true))||[];
    const idx=all.findIndex(j=>j.code===updated.code);
    if(idx>=0)all[idx]=updated; else all.push(updated);
    await sd(SK.JOBS,all,true);
    setJobsAll(all);setSelectedJob(updated);onPost();
  };

  const toggleJobStatus=async(job)=>{
    const updated={...job,status:job.status==="active"?"inactive":"active"};
    const all=(await ld(SK.JOBS,true))||[];
    const idx=all.findIndex(j=>j.code===job.code);
    if(idx>=0)all[idx]=updated; else all.push(updated);
    await sd(SK.JOBS,all,true);
    setJobsAll(all);
    if(selectedJob?.code===job.code)setSelectedJob(updated);
    onPost();
  };

  const openJob=job=>{
    const normalized=normalizeJob(job);
    setSelectedJob(normalized);
    setJobView("pipeline");
    setSelectedRound(normalized.recruitmentProcess?.[0]?.name||"Applied");
    setSelectedApp(null);
  };

  const updateApplication=async(app,patch)=>{
    const all=(await ld(SK.APPLICATIONS,true))||[];
    const idx=all.findIndex(a=>a.id===app.id); if(idx<0)return;
    all[idx]={...all[idx],...patch,updatedAt:new Date().toISOString()};
    await sd(SK.APPLICATIONS,all,true);setApplications(all);onPost();
  };

  const moveCandidate=async(app,round,status,reason,note)=>{
    const jobNow=normalizeJob(currentJob);
    const process=jobNow.recruitmentProcess||DEFAULT_RECRUITMENT_PROCESS;
    const currentIndex=process.findIndex(r=>r.name===round);
    let nextRound=round;
    if(status==="next") nextRound=process[currentIndex+1]?.name||round;
    if(status==="Reject") nextRound="Rejected";
    if(status==="Pipeline") nextRound="Pipeline";
    const now=new Date().toISOString();
    const stageData={...(app.stageData||{}),[round]:{
      status:status==="next"?"Passed":(status==="Pipeline"?"Move to Pipeline":status),
      reason:(status==="next"||status==="Pipeline")?"":reason||"",
      note:note||"",
      updatedAt:now
    }};
    const applicationStatus=status==="Reject"?"rejected":(status==="Pass"?"passed":"processing");
    await updateApplication(app,{currentRound:nextRound,stageData,status:applicationStatus,lastStatusUpdate:now});
    setSelectedApp({...app,currentRound:nextRound,stageData,status:applicationStatus,lastStatusUpdate:now});
  };

  const viewApplication=async app=>{
    const c=candidates.find(x=>x.code===app.candidateCode)||app.profileSnapshot||app;
    setSelectedApp(app);
    setViewingC({...c,application:app});
  };

  if(postingJob)return <PostJobPage onBack={()=>setPostingJob(false)} onSuccess={()=>{setPostingJob(false);onPost();}} company={company} session={session}/>;

  if(selectedJob){
    const j=normalizeJob(currentJob||selectedJob), apps=appsForJob(j.code), process=j.recruitmentProcess||DEFAULT_RECRUITMENT_PROCESS;
    const roundApps=apps.filter(a=>(a.currentRound||"Applied")===selectedRound);
    const selectedCandidate=selectedApp ? (candidates.find(x=>x.code===selectedApp.candidateCode)||selectedApp.profileSnapshot||selectedApp) : null;
    const selectedStage=selectedApp ? ((selectedApp.stageData||{})[selectedRound]||{}) : {};
    return <div style={{maxWidth:1200,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      <button onClick={()=>setSelectedJob(null)} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontSize:13,fontWeight:700,fontFamily:FONT,display:"flex",alignItems:"center",gap:6,marginBottom:"1.25rem"}}><Icon name="arrow-left" size={14}/>Back to Employer</button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:16,flexWrap:"wrap",marginBottom:"1.25rem"}}>
        <div><div style={{display:"flex",gap:8,alignItems:"center"}}><span style={{fontFamily:"monospace",fontSize:11,fontWeight:700,background:BRAND_LIGHT,color:BRAND,padding:"2px 8px",borderRadius:6}}>{j.code}</span><Badge color={j.status==="active"?"blue":"gray"}>{j.status==="active"?"Active":"Deactive"}</Badge></div><h1 style={{fontSize:26,fontWeight:800,color:BRAND,margin:"8px 0 4px"}}>{j.title}</h1><p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>{j.company} · {(j.locations||[]).join(", ")}</p></div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn variant={j.status==="active"?"danger":"outline"} onClick={()=>toggleJobStatus(j)}><Icon name="power" size={14}/>{j.status==="active"?"Deactive":"Active"}</Btn>
          <Btn variant="outline" onClick={()=>setJobView("edit")}><Icon name="edit" size={14}/>Edit</Btn>
        </div>
      </div>

      {jobView==="pipeline"&&<div>
        <Card><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{process.map(r=>{const count=apps.filter(a=>(a.currentRound||"Applied")===r.name).length;return <button key={r.name} onClick={()=>{setSelectedRound(r.name);setSelectedApp(null)}} style={{flex:1,minWidth:110,padding:"12px",background:selectedRound===r.name?BRAND_LIGHT:"var(--color-background-secondary)",border:selectedRound===r.name?`1.5px solid ${BRAND}`:"0.5px solid var(--color-border-tertiary)",borderRadius:10,textAlign:"center",cursor:"pointer",fontFamily:FONT}}><div style={{fontSize:13,fontWeight:800,color:BRAND}}>{r.name}</div><div style={{fontSize:20,fontWeight:800,color:BRAND,marginTop:4}}>{count}</div><div style={{fontSize:10,color:"var(--color-text-secondary)"}}>candidates</div></button>})}</div></Card>
        <div style={{display:"grid",gridTemplateColumns:"minmax(220px,280px) 1fr",gap:16,alignItems:"start"}}>
          <Card style={{padding:"1rem"}}>
            <h3 style={{fontSize:12,fontWeight:800,color:BRAND,margin:"0 0 12px",textTransform:"uppercase",letterSpacing:1}}>{selectedRound}</h3>
            {roundApps.length===0?<p style={{fontSize:13,color:"var(--color-text-secondary)",fontStyle:"italic"}}>No candidates in this process.</p>:
              <div style={{display:"flex",flexDirection:"column",gap:6}}>{roundApps.map(a=>{const c=candidates.find(x=>x.code===a.candidateCode)||a.profileSnapshot||a;return <button key={a.id} onClick={()=>viewApplication(a)} style={{textAlign:"left",padding:"10px 12px",borderRadius:9,border:selectedApp?.id===a.id?`1.5px solid ${BRAND}`:"0.5px solid var(--color-border-tertiary)",background:selectedApp?.id===a.id?BRAND_LIGHT:"var(--color-background-secondary)",cursor:"pointer",fontFamily:FONT}}><div style={{fontWeight:800,fontSize:13,color:BRAND}}>{c.name||a.name||"Candidate"}</div><div style={{fontSize:11,color:"var(--color-text-secondary)",marginTop:3}}>{c.position||a.position||"Application"}</div><div style={{fontSize:11,color:"var(--color-text-secondary)",marginTop:2,wordBreak:"break-word"}}>{c.email||a.email||"—"}</div><div style={{fontSize:11,color:"var(--color-text-secondary)",marginTop:2}}>{c.phone||a.phone||"—"}</div></button>})}</div>}
          </Card>
          <Card style={{minHeight:420}}>
            {!selectedApp?<div style={{height:360,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--color-text-secondary)",fontSize:13}}>Select a candidate to view application details.</div>:
              <div>
                <div style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"flex-start",marginBottom:"1rem"}}><div><h2 style={{fontSize:20,fontWeight:800,color:BRAND,margin:"0 0 4px"}}>{selectedCandidate?.name||"Candidate"}</h2><p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}>{selectedCandidate?.position||selectedApp.position||"Application"}</p></div><Badge color={selectedApp.status==="rejected"?"red":selectedApp.status==="passed"?"green":selectedApp.currentRound==="Pipeline"?"purple":"blue"}>{selectedRound}</Badge></div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px 24px",marginBottom:"1.25rem"}}>{[["Email",selectedCandidate?.email||selectedApp.email],["Phone",selectedCandidate?.phone||selectedApp.phone],["CV",selectedCandidate?.cvLink||selectedApp.cvLink],["Portfolio",selectedCandidate?.portfolio||selectedApp.portfolio],["Salary",selectedCandidate?.salary||selectedApp.salary],["Available",selectedCandidate?.onboard||selectedApp.onboard]].map(([l,v])=><div key={l}><p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",margin:"0 0 4px"}}>{l}</p><p style={{fontSize:13,margin:0,wordBreak:"break-word"}}>{v||"—"}</p></div>)}</div>
                <p style={{fontSize:13,lineHeight:1.7,margin:"0 0 1rem"}}>{selectedCandidate?.intro||"Application profile information."}</p>
                {selectedStage.updatedAt&&<p style={{fontSize:11,color:"var(--color-text-secondary)",margin:"0 0 1rem"}}>Last status update: {fmt(selectedStage.updatedAt)}</p>}
                <StageAction app={selectedApp} round={selectedRound} onSave={(status,reason,note)=>moveCandidate(selectedApp,selectedRound,status,reason,note)} canNext={(()=>{const idx=process.findIndex(r=>r.name===selectedRound);return idx>=0&&idx<process.length-1&&selectedRound!=="Rejected"&&selectedRound!=="Pipeline";})()}/>
              </div>}
          </Card>
        </div>
      </div>}

      {jobView==="edit"&&<JobEditPanel job={j} onSave={async updated=>{await saveJob(updated);setJobView("pipeline");}}/>}
    </div>;
  }

  return <div style={{maxWidth:1200,margin:"2rem auto",padding:"2rem 1rem 4rem",fontFamily:FONT}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"1.5rem",gap:12}}><div><h1 style={{fontSize:26,fontWeight:800,margin:"0 0 4px"}}>Employer</h1><p style={{color:"var(--color-text-secondary)",fontSize:13,margin:0}}>{company?.name} · Manage your job postings and recruitment pipeline.</p></div><Btn onClick={()=>setPostingJob(true)}><Icon name="plus" size={15}/>Post a job</Btn></div>
    <div style={{display:"flex",gap:4,borderBottom:"0.5px solid var(--color-border-tertiary)",marginBottom:"1.5rem"}}>{[["employer","Employer","building"],["requests","Contact Requests","mail"],["candidates","Talent Pool","users"]].map(([id,label,icon])=><button key={id} onClick={()=>setTab(id)} style={{background:"none",border:"none",cursor:"pointer",padding:"11px 14px",color:tab===id?BRAND:"var(--color-text-secondary)",fontWeight:tab===id?700:400,fontFamily:FONT,fontSize:13,borderBottom:tab===id?`2px solid ${BRAND}`:"2px solid transparent",display:"flex",gap:6,alignItems:"center"}}><Icon name={icon} size={14}/>{label}</button>)}</div>
    {tab==="employer"&&<div>
      {company&&<Card style={{display:"flex",justifyContent:"space-between",gap:16,alignItems:"flex-start"}}>
        <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
          <div style={{width:48,height:48,borderRadius:12,background:BRAND_LIGHT,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="building" size={22} style={{color:BRAND}}/></div>
          <div>
            <h3 style={{fontSize:17,fontWeight:800,color:BRAND,margin:"0 0 3px"}}>{company.name}</h3>
            <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:"0 0 6px"}}>{company.industry}{company.teamSize?` · ${company.teamSize} employees`:""}{company.taxCode?` · Tax code ${company.taxCode}`:""}</p>
            {company.address&&<p style={{fontSize:12,margin:"0 0 4px",display:"flex",gap:6,alignItems:"flex-start"}}><Icon name="map-pin" size={13} style={{color:BRAND_DIM,flexShrink:0,marginTop:2}}/>{company.address}</p>}
            {company.website&&<p style={{fontSize:12,margin:"0 0 8px",display:"flex",gap:6,alignItems:"flex-start"}}><Icon name="world" size={13} style={{color:BRAND_DIM,flexShrink:0,marginTop:2}}/><a href={company.website} target="_blank" rel="noreferrer" style={{color:BRAND}}>{company.website}</a></p>}
            {company.intro&&<p style={{fontSize:13,lineHeight:1.7,margin:0,maxWidth:640}}>{company.intro}</p>}
          </div>
        </div>
        <button onClick={()=>setTab("company")} title="Edit company profile" style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",color:BRAND,width:34,height:34,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="pencil" size={15}/></button>
      </Card>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,margin:"1.25rem 0 1.5rem"}}>
        {[
          {label:"Active Jobs",value:jobs.filter(j=>j.status==="active").length,icon:"briefcase"},
          {label:"Talent Pool Requests",value:requests.length,icon:"users"},
          {label:"Contacts Obtained",value:requests.filter(r=>r.status==="accepted").length,icon:"mail-check"}
        ].map(stat=>(
          <Card key={stat.label} style={{marginBottom:0,display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:44,height:44,borderRadius:12,background:BRAND_LIGHT,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name={stat.icon} size={20} style={{color:BRAND}}/></div>
            <div><p style={{fontSize:24,fontWeight:800,color:BRAND,margin:"0 0 2px"}}>{stat.value}</p><p style={{fontSize:11,fontWeight:700,color:"var(--color-text-secondary)",textTransform:"uppercase",letterSpacing:.5,margin:0}}>{stat.label}</p></div>
          </Card>
        ))}
      </div>
      <h3 style={{fontSize:13,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"0 0 10px"}}>Your Jobs</h3>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {jobs.length===0&&<p style={{textAlign:"center",color:"var(--color-text-secondary)",padding:"3rem"}}>No jobs posted yet.</p>}

function StageAction({app,round,onSave,canNext}){
  const existing=(app.stageData||{})[round]||{};
  const [status,setStatus]=useState("");
  const [reason,setReason]=useState(existing.reason||"");
  const [note,setNote]=useState(existing.note||"");
  const needsReason=status==="Reject";
  const chooseStatus=(value)=>{
    setStatus(value);
    if(value==="Pending"||value==="Pass"||value==="Reject"||value==="next"||value==="Pipeline"){
      onSave(value,reason,note);
      setStatus("");
    }
  };
  return <div style={{marginTop:12,paddingTop:12,borderTop:"0.5px solid var(--color-border-tertiary)"}}>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <select value={status} onChange={e=>chooseStatus(e.target.value)} style={{width:"auto",minWidth:180}}>
        <option value="">Update status…</option>
        {canNext&&<option value="next">Move to next step</option>}
        <option value="Pass">Pass</option>
        <option value="Reject">Reject</option>
        <option value="Pending">Pending</option>
        <option value="Pipeline">Move to Pipeline</option>
      </select>
      {needsReason&&<select value={reason} onChange={e=>{setReason(e.target.value);if(e.target.value)onSave("Reject",e.target.value,note)}} style={{width:"auto",minWidth:180}}>
        <option value="">Select reason…</option>{ROUND_REASONS.map(r=><option key={r}>{r}</option>)}
      </select>}
      <input value={note} onChange={e=>setNote(e.target.value)} placeholder="Note for this candidate…" style={{flex:1,minWidth:220}}/>
    </div>
    <p style={{fontSize:11,color:"var(--color-text-secondary)",margin:"8px 0 0"}}>Selecting a status applies the action immediately.</p>
  </div>;
}

function RichTextEditor({value,onChange,minHeight=140}){
  const ref=useRef(null);
  const initialized=useRef(false);
  useEffect(()=>{
    if(!initialized.current && ref.current){
      ref.current.innerHTML=value||"";
      initialized.current=true;
    }
  },[]);
  const exec=(cmd,arg)=>{
    if(ref.current) ref.current.focus();
    document.execCommand(cmd,false,arg);
    if(ref.current) onChange(ref.current.innerHTML);
  };
  const tools=[["bold","bold","Bold"],["italic","italic","Italic"],["underline","underline","Underline"],["insertUnorderedList","list","Bullet list"],["insertOrderedList","list-numbers","Numbered list"]];
  return <div>
    <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center",marginBottom:6,padding:"6px 8px",background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:8}}>
      {tools.map(([cmd,icon,title])=>(
        <button key={cmd} type="button" title={title} onMouseDown={e=>e.preventDefault()} onClick={()=>exec(cmd)} style={{width:30,height:30,border:"0.5px solid var(--color-border-secondary)",background:"#fff",borderRadius:6,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:BRAND}}>
          <Icon name={icon} size={14}/>
        </button>
      ))}
      <select onMouseDown={e=>e.stopPropagation()} onChange={e=>{if(e.target.value){exec("fontSize",e.target.value);e.target.value="";}}} style={{width:"auto",fontSize:11,padding:"4px 6px"}}>
        <option value="">Size</option>
        <option value="2">Small</option>
        <option value="3">Normal</option>
        <option value="5">Large</option>
        <option value="7">Huge</option>
      </select>
    </div>
    <div ref={ref} contentEditable suppressContentEditableWarning onInput={e=>onChange(e.currentTarget.innerHTML)} style={{minHeight,padding:"10px 12px",border:"0.5px solid var(--color-border-secondary)",borderRadius:8,fontFamily:FONT,fontSize:13,background:"var(--color-background-primary)",outline:"none",overflowY:"auto",lineHeight:1.6}}/>
  </div>;
}

function NotificationsPage({onRefresh,role,session,onBack}){
  const [notifs,setNotifs]=useState([]);
  const typeIcon={contact_request:"mail",response:"check-circle",job_posted:"briefcase",application:"file-text",system:"bell"};

  useEffect(()=>{
    (async()=>{
      const all=((await ld(SK.NOTIFS,true))||[]).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      const scoped=all.filter(x=>role==="jobseeker"
        ?(x.to===session?.code||x.to==="jobseeker"||x.to==="all")
        :(x.to===session?.email||x.to==="employer"||x.to==="all"));
      setNotifs(scoped);
      const unread=scoped.filter(n=>!n.read);
      if(unread.length){
        const updated=all.map(n=>scoped.some(s=>s.id===n.id)?{...n,read:true}:n);
        await sd(SK.NOTIFS,updated,true);
        onRefresh();
      }
    })();
  },[]);

  return(
    <div style={{maxWidth:680,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontSize:13,fontWeight:600,fontFamily:FONT,marginBottom:"1.25rem",display:"flex",alignItems:"center",gap:6}}><Icon name="arrow-left" size={14}/>Back</button>
      <h1 style={{fontSize:26,fontWeight:800,marginBottom:4}}>Notifications</h1>
      <p style={{color:"var(--color-text-secondary)",fontSize:13,marginBottom:"1.5rem"}}>All new notifications appear here automatically.</p>
      {notifs.length===0&&<p style={{textAlign:"center",color:"var(--color-text-secondary)",padding:"3rem"}}>No notifications yet.</p>}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {notifs.map(n=>(
          <div key={n.id} style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:14,padding:"1.25rem"}}>
            <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
              <div style={{width:36,height:36,borderRadius:"50%",background:BRAND_LIGHT,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name={typeIcon[n.type]||"bell"} size={16} style={{color:BRAND}}/></div>
              <div style={{flex:1}}>
                <p style={{fontSize:14,fontWeight:600,margin:"0 0 4px",lineHeight:1.5}}>{n.message||`${n.type} notification`}</p>
                <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}>{fmt(n.createdAt)}</p>
                {n.type==="response"&&n.action&&<div style={{marginTop:8,padding:"8px 12px",background:n.action==="accepted"?BRAND_LIGHT:"#FDEAEA",borderRadius:8,fontSize:13}}><strong>Candidate {n.candidateCode}</strong> has <strong>{n.action==="accepted"?"accepted ✓":"declined ✕"}</strong> your contact request for <em>{n.position}</em>.</div>}
                {n.type==="application"&&<div style={{marginTop:8,padding:"8px 12px",background:BRAND_LIGHT,borderRadius:8,fontSize:13}}>Application received for <strong>{n.title}</strong>.</div>}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [role,setRole]=useState(null);
  const [session,setSession]=useState(null);
  const [company,setCompany]=useState(null);   // employer's company profile, or undefined until checked
  const [companyChecked,setCompanyChecked]=useState(false);
  const [booting,setBooting]=useState(true);
  const [page,setPage]=useState("candidate");
  const [prevPage,setPrevPage]=useState("candidate");
  const [refresh,setRefresh]=useState(0);
  const [notifCount,setNotifCount]=useState(0);
  const [showSync,setShowSync]=useState(false);
  const isAdmin=typeof window!=="undefined"&&window.location.hash==="#admin";
  const bump=useCallback(()=>setRefresh(r=>r+1),[]);

  // Restore session on load (checks both "remembered" (7-day) and session-only storage)
  useEffect(()=>{
    (async()=>{
      let s=await ld(SK.SESSION,true);
      if(s&&s.expiresAt&&s.expiresAt<Date.now()){ await sd(SK.SESSION,null,true); s=null; }
      if(!s){
        try{ const raw=sessionStorage.getItem(SK.SESSION); if(raw)s=JSON.parse(raw); }catch(e){}
      }
      if(s){
        setRole(s.role);setSession(s);
        setPage(s.role==="jobseeker"?"candidate":"employer");
      }
      setBooting(false);
    })();
  },[]);

  // Check / load company profile whenever an employer session is active
  useEffect(()=>{
    if(session?.role==="employer"){
      setCompanyChecked(false);
      (async()=>{
        const all=(await ld(SK.COMPANIES,true))||[];
        const found=all.find(c=>c.code===session.code)||null;
        setCompany(found);
        setCompanyChecked(true);
      })();
    }
  },[session,refresh]);

  useEffect(()=>{(async()=>{
    const n=(await ld(SK.NOTIFS,true))||[];
    const relevant=n.filter(x=>{
      if(!session)return false;
      return session.role==="jobseeker"
        ?(x.to===session.code||x.to==="jobseeker"||x.to==="all")
        :(x.to===session.email||x.to==="employer"||x.to==="all");
    });
    setNotifCount(relevant.filter(x=>!x.read).length);
  })();},[refresh,session]);

  const openNotifs=()=>{ if(page!=="notifications"){ setPrevPage(page); setPage("notifications"); } };

  const clearSession=async()=>{
    await sd(SK.SESSION,null,true);
    try{sessionStorage.removeItem(SK.SESSION);}catch(e){}
  };

  const logout=async()=>{
    await clearSession();
    setSession(null);setRole(null);setCompany(null);setCompanyChecked(false);
  };

  const deleteAccount=async()=>{
    if(!window.confirm("This will permanently delete your account and profile data. This cannot be undone. Continue?"))return;
    if(session.role==="jobseeker"){
      const accounts=((await ld(SK.ACCOUNTS_JS,true))||[]).filter(a=>a.email.toLowerCase()!==session.email.toLowerCase());
      await sd(SK.ACCOUNTS_JS,accounts,true);
      await sd("pairup_my_profile_"+session.email,null,true);
      const candidates=((await ld(SK.CANDIDATES,true))||[]).filter(c=>c.code!==session.code);
      await sd(SK.CANDIDATES,candidates,true);
    }else{
      const accounts=((await ld(SK.ACCOUNTS_EMP,true))||[]).filter(a=>a.email.toLowerCase()!==session.email.toLowerCase());
      await sd(SK.ACCOUNTS_EMP,accounts,true);
      const companies=((await ld(SK.COMPANIES,true))||[]).filter(c=>c.code!==session.code);
      await sd(SK.COMPANIES,companies,true);
    }
    await clearSession();
    setSession(null);setRole(null);setCompany(null);setCompanyChecked(false);
  };

  if(booting)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--color-background-tertiary)"}}>
      <Icon name="loader-2" size={26} style={{color:BRAND,animation:"spin 1s linear infinite"}}/>
    </div>
  );

  // Admin console (talent pool & jobs moderation) — accessible via #admin, no
  // job-seeker/employer login required.
  if(isAdmin)return <AdminPage/>;

  if(!role)return <RoleSelection onSelect={r=>setRole(r)}/>;

  if(!session)return <AuthPage role={role} onBack={()=>setRole(null)} onAuthed={s=>{setSession(s);setPage(s.role==="jobseeker"?"candidate":"employer");}}/>;

  if(session.role==="employer"&&!companyChecked)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--color-background-tertiary)"}}>
      <Icon name="loader-2" size={26} style={{color:BRAND,animation:"spin 1s linear infinite"}}/>
    </div>
  );

  if(session.role==="employer"&&companyChecked&&!company){
    return <CompanyProfilePage session={session} onSaved={(c)=>{setCompany(c);}}/>;
  }

  return(
    <div style={{minHeight:"100vh",background:"var(--color-background-tertiary)",fontFamily:FONT}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap');
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        input,select,textarea{font-family:'Noto Sans Khmer',sans-serif;font-size:13px;padding:8px 12px;border:0.5px solid var(--color-border-secondary);border-radius:8px;outline:none;background:var(--color-background-primary);color:var(--color-text-primary);width:100%;box-sizing:border-box;}
        input:focus,select:focus,textarea:focus{border-color:${BRAND};box-shadow:0 0 0 3px ${BRAND}18;}
        select{width:auto;}
      `}</style>
      <Nav page={page} setPage={setPage} notifCount={notifCount} role={role} onLogout={logout} onDeleteAccount={deleteAccount} onOpenSync={()=>setShowSync(true)} showSync={isAdmin} onOpenNotifs={openNotifs}/>
      {page==="candidate"&&role==="jobseeker"&&<CandidatePage onSubmit={bump} refresh={refresh} session={session}/>}
      {page==="public"&&<PublicPage onRequest={bump} session={session} company={company}/>}
      {page==="jobs"&&role==="jobseeker"&&<JobsPage onApply={bump} session={session}/>}
      {page==="employer"&&role==="employer"&&<EmployerPage onPost={bump} refresh={refresh} session={session} company={company} onCompanyUpdated={setCompany}/>}
      {page==="notifications"&&<NotificationsPage onRefresh={bump} role={role} session={session} onBack={()=>setPage(prevPage)}/>}
      {showSync&&<SyncSettingsModal onClose={()=>setShowSync(false)}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
