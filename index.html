      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {jobs.length===0&&<p style={{textAlign:"center",color:"var(--color-text-secondary)",padding:"3rem"}}>No jobs posted yet.</p>}
        {jobs.map(j=>{const apps=appsForJob(j.code);const isActive=j.status==="active";return <div key={j.code} style={{textAlign:"left",background:isActive?"var(--color-background-primary)":"var(--color-background-secondary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:14,padding:"1.25rem",fontFamily:FONT,opacity:isActive?1:0.65}}><button onClick={()=>openJob(j)} style={{width:"100%",textAlign:"left",background:"none",border:"none",padding:0,cursor:"pointer",fontFamily:FONT,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}><div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span style={{fontFamily:"monospace",fontSize:11,fontWeight:700,background:isActive?BRAND_LIGHT:"#e5e7eb",color:isActive?BRAND:"#6b7280",padding:"2px 8px",borderRadius:6}}>{j.code}</span><Badge color={isActive?"blue":"gray"}>{isActive?"Active":"Deactive"}</Badge></div><h3 style={{fontWeight:700,fontSize:16,margin:"0 0 3px",color:isActive?BRAND:"#6b7280"}}>{j.title}</h3><p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>{j.company} · {(j.locations||[]).join(", ")}</p></div><div style={{textAlign:"center",flexShrink:0,padding:"6px 14px",background:isActive?BRAND_LIGHT:"#e5e7eb",borderRadius:10}}><div style={{fontSize:20,fontWeight:800,color:isActive?BRAND:"#6b7280"}}>{apps.length}</div><div style={{fontSize:10,color:isActive?BRAND_DIM:"#6b7280",whiteSpace:"nowrap"}}>applicant{apps.length!==1?"s":""}</div></div></button></div>})}
      </div>
    </div>}
    {tab==="company"&&company&&<div style={{maxWidth:680}}><CompanyProfilePage session={session} existing={company} onSaved={(c)=>{onCompanyUpdated&&onCompanyUpdated(c);setTab("employer");}}/></div>}
    {tab==="requests"&&(
      <div>
        <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:"0 0 1.25rem"}}>Requests you've sent to candidates in the Talent Pool. When a candidate accepts, their CV and portfolio links are shown here <strong>only once</strong> — after that they're hidden for privacy, so be sure to save the details.</p>
        {requests.length===0?(
          <div style={{textAlign:"center",padding:"3rem 1rem",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16}}>
            <Icon name="mail-off" size={36} style={{color:BRAND_DIM,display:"block",margin:"0 auto 12px"}}/>
            <p style={{fontWeight:700,fontSize:15,margin:"0 0 6px"}}>No contact requests sent yet</p>
            <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>Browse the Talent Pool to reach out to candidates</p>
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {requests.map(r=>(
              <div key={r.id} onClick={()=>openRequest(r)} style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:14,padding:"1rem 1.25rem",cursor:"pointer",display:"flex",alignItems:"center",gap:14}}>
                <div style={{width:44,height:44,borderRadius:10,background:BRAND_LIGHT,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <Icon name="user" size={20} style={{color:BRAND}}/>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{fontWeight:800,fontSize:15,margin:"0 0 2px",fontFamily:"monospace",color:BRAND}}>{r.candidateCode}</p>

    {/* CONTACT REQUEST DETAIL — CV/portfolio revealed only once per request */}
    {viewingRequest&&(()=>{

              <div style={{marginTop:"1.25rem",padding:"1.25rem",background:"var(--color-background-secondary)",borderRadius:14,textAlign:"center"}}>
                <Icon name="lock" size={24} style={{color:BRAND_DIM}}/>

                <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}>You viewed this candidate's contact details, CV, and portfolio on {fmt(r.viewedAt)}. For the candidate's privacy, it's only shown once and can't be viewed again from here.</p>

}

function StageAction({app,round,onSave,onSaveNote,canNext,canPrev}){
  const existing=(app.stageData||{})[round]||{};
  const [status,setStatus]=useState("");
  const [reason,setReason]=useState(existing.reason||"");
  const [note,setNote]=useState(existing.note||"");
  const [justSaved,setJustSaved]=useState(false);
  const needsReason=status==="Reject";
  const chooseStatus=(value)=>{
    setStatus(value);
    if(value==="Pending"||value==="Pass"||value==="Reject"||value==="next"||value==="prev"||value==="Pipeline"){
      onSave(value,reason,note);
      setStatus("");
    }
  };
  const saveNoteOnly=()=>{
    onSaveNote(note);
    setJustSaved(true);
    setTimeout(()=>setJustSaved(false),1800);
  };
  return <div style={{marginTop:12,paddingTop:12,borderTop:"0.5px solid var(--color-border-tertiary)"}}>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <select value={status} onChange={e=>chooseStatus(e.target.value)} style={{width:"auto",minWidth:180}}>
        <option value="">Update status…</option>
        {canNext&&<option value="next">Move to next step</option>}
        {canPrev&&<option value="prev">Go back a stage</option>}
        <option value="Pass">Pass</option>
        <option value="Reject">Reject</option>
        <option value="Pending">Pending</option>
        <option value="Pipeline">Move to Pipeline</option>
      </select>
      {needsReason&&<select value={reason} onChange={e=>{setReason(e.target.value);if(e.target.value)onSave("Reject",e.target.value,note)}} style={{width:"auto",minWidth:180}}>
        <option value="">Select reason…</option>{ROUND_REASONS.map(r=><option key={r}>{r}</option>)}
      </select>}
      <input value={note} onChange={e=>setNote(e.target.value)} placeholder="Note for this candidate…" style={{flex:1,minWidth:220}}/>
      <Btn variant="outline" onClick={saveNoteOnly} style={{padding:"8px 14px",whiteSpace:"nowrap"}}>

  </div>;
}

function RichTextEditor({value,onChange,minHeight=140}){
  const ref=useRef(null);
  // Tracks the last value the DOM is known to hold — either what we just typed
  // (echoed back via onChange→value on the next render) or what we just set
  // programmatically. Only re-sync innerHTML when `value` differs from that,
  // i.e. an EXTERNAL change (like "Use same as before" loading saved benefits).
  // Without this guard, typing would fight the cursor on every keystroke; the
  // previous "set innerHTML once on mount only" version instead had the
  // opposite bug — external updates arriving after mount were silently ignored.
  const lastKnown=useRef(null);
  useEffect(()=>{
    if(ref.current && value!==lastKnown.current){
      ref.current.innerHTML=value||"";
      lastKnown.current=value||"";
    }
  },[value]);
  const emit=()=>{
    if(!ref.current)return;
    lastKnown.current=ref.current.innerHTML;
    onChange(ref.current.innerHTML);
  };
  const exec=(cmd,arg)=>{
    if(ref.current) ref.current.focus();
    document.execCommand(cmd,false,arg);
    emit();
  };
  const tools=[["bold","bold","Bold"],["italic","italic","Italic"],["underline","underline","Underline"],["insertUnorderedList","list","Bullet list"],["insertOrderedList","list-numbers","Numbered list"]];
  return <div>
    <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center",marginBottom:6,padding:"6px 8px",background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:8}}>
      {tools.map(([cmd,icon,title])=>(
        <button key={cmd} type="button" title={title} onMouseDown={e=>e.preventDefault()} onClick={()=>exec(cmd)} style={{width:30,height:30,border:"0.5px solid var(--color-border-secondary)",background:"#fff",borderRadius:6,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:BRAND}}>
          <Icon name={icon} size={14}/>
        </button>
      ))}
      <select onMouseDown={e=>e.stopPropagation()} onChange={e=>{if(e.target.value){exec("fontSize",e.target.value);e.target.value="";}}} style={{width:"auto",fontSize:11,padding:"4px 6px"}}>
        <option value="">Size</option>
        <option value="2">Small</option>
        <option value="3">Normal</option>
        <option value="5">Large</option>
        <option value="7">Huge</option>
      </select>
    </div>
    <div ref={ref} contentEditable suppressContentEditableWarning onInput={emit} style={{minHeight,padding:"10px 12px",border:"0.5px solid var(--color-border-secondary)",borderRadius:8,fontFamily:FONT,fontSize:13,background:"var(--color-background-primary)",outline:"none",overflowY:"auto",lineHeight:1.6}}/>
  </div>;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const initialRouteRef=useRef(parseRoute());
  const [role,setRole]=useState(()=>{
    const r=initialRouteRef.current;
    if(r.page==="candidate")return "jobseeker";
    if(r.page==="employer")return "employer";
    return null;
  });
  const [session,setSession]=useState(null);
  const [company,setCompany]=useState(null);   // employer's company profile, or undefined until checked
  const [companyChecked,setCompanyChecked]=useState(false);
  const [booting,setBooting]=useState(true);
  const [page,setPage]=useState(()=>{
    const r=initialRouteRef.current;
    return (r.page==="public"||r.page==="jobs")?r.page:"candidate";
  });
  const [prevPage,setPrevPage]=useState("candidate");
  const [refresh,setRefresh]=useState(0);
  const [notifCount,setNotifCount]=useState(0);
  const [showSync,setShowSync]=useState(false);
  const [navigationData,setNavigationData]=useState(null);
  const menuNavigationId=useRef(0);
  const isAdmin=typeof window!=="undefined"&&isAdminHash(window.location.hash);
  const bump=useCallback(()=>setRefresh(r=>r+1),[]);

  // Count one visit for this full document load. SPA navigation does not remount App.
  useEffect(()=>{trackWebsiteVisit();},[]);

  // Restore session on load (checks both "remembered" (7-day) and session-only storage)
  useEffect(()=>{
    (async()=>{
      let s=await ld(SK.SESSION,true);
      if(s&&s.expiresAt&&s.expiresAt<Date.now()){ await sd(SK.SESSION,null,true); s=null; }
      if(!s){
        try{ const raw=sessionStorage.getItem(SK.SESSION); if(raw)s=JSON.parse(raw); }catch(e){}
      }
      if(s){
        setRole(s.role);setSession(s);
        const route=initialRouteRef.current;
        const allowedPages={notifications:true,public:true,jobs:true,candidate:s.role==="jobseeker",employer:s.role==="employer"};
        const defaultPage=s.role==="jobseeker"?"candidate":"employer";
        const initialPage=(route.page&&route.page!=="admin"&&allowedPages[route.page])?route.page:defaultPage;
        setPage(initialPage);
        replaceRoute(initialPage,initialPage===route.page?route.sub:"");
        // Warm the cache in the background (not awaited) so the first page the
        // person actually lands on often finds its data already cached.
        const prefetchSheets=s.role==="jobseeker"
          ?["Job Seekers","Jobs","Companies","Notifications"]
          :["Jobs","Requests","Applied","Job Seekers","Companies","Notifications"];
        sheetListMulti(prefetchSheets).catch(()=>{});
      }
      setBooting(false);
    })();
  },[]);

  // Browser Back/Forward: keep in-app page state in sync with the URL so the
  // history entries pushRoute() creates are actually navigable, not just
  // decorative. Deep-linking into a page you don't have access to (wrong
  // role, or not logged in) is intentionally ignored here — the effect above
  // already resolved that once at boot, and this only reacts to real
  // back/forward, not to that initial resolution.
  useEffect(()=>{
    const onPopState=()=>{
      const route=parseRoute();
      if(!route.page||route.page==="admin")return;
      // "public"/"jobs" are viewable while signed out, so they sync regardless
      // of role; anything else still requires a matching signed-in role.
      if(route.page==="public"||route.page==="jobs"){setPage(route.page);return;}
      if(!role)return;
      const allowedPages={notifications:true,candidate:role==="jobseeker",employer:role==="employer"};
      if(allowedPages[route.page])setPage(route.page);
    };
    window.addEventListener("popstate",onPopState);
    return ()=>window.removeEventListener("popstate",onPopState);
  },[role]);

  // Check / load company profile when an employer session starts. Deliberately
  // does NOT depend on `refresh`: bump() fires after routine actions like
  // updating a candidate's status, sending a request, or applying to a job —
  // none of which change the company profile. Re-running this on every bump()
  // used to flip companyChecked to false, which made the render below fall
  // through to the full-page "PairUp is loading" screen and re-mount
  // EmployerPage from scratch — wiping out whatever job/candidate the employer
  // had open. Now it only runs when the session itself changes (login/logout),
  // plus whenever the company profile is saved directly (onCompanyUpdated).
  useEffect(()=>{
    if(session?.role==="employer"){
      setCompanyChecked(false);
      (async()=>{
        const all=(await ld(SK.COMPANIES,true))||[];
        const found=all.find(c=>c.code===session.code)||null;
        setCompany(found);
        setCompanyChecked(true);
      })();
    }
  },[session]);

  useEffect(()=>{
    const checkNotifs=async()=>{
      if(!session)return;
      const matchValues=session.role==="jobseeker"
        ?[session.code,"jobseeker","all"]
        :[session.email,"employer","all"];
      const count=await fetchNotifUnreadCount(matchValues);
      if(count!==null) setNotifCount(count);
    };
    checkNotifs();
    // Poll so new notifications created by someone else (a different browser/
    // device) show up on their own, without the person needing to refresh.
    const interval=setInterval(checkNotifs,20000);
    return ()=>clearInterval(interval);
  },[refresh,session]);

  const navigateMenu=useCallback(async destination=>{
    if(destination===page)return;
    startGlobalLoadingOperation();
    const navigationId=++menuNavigationId.current;
    try{
      let nextData=null;

      // Batched into ONE round-trip via list_multi (forceFresh=true still
      // bypasses the client cache to get up-to-date data on tab switch, but
      // no longer fires N separate HTTP requests to do it — that fan-out of
      // parallel-but-separate requests, not the network itself, was the main
      // cause of the multi-second wait when switching tabs).
      if(destination==="public"){
        await sheetListMulti(["Job Seekers"],true);
        const candidates=await ld(SK.CANDIDATES,true);
        nextData={destination,candidates:candidates||[]};
      }else if(destination==="jobs"){
        await sheetListMulti(["Jobs","Applied","Companies"],true);
        const [jobs,applications,companies]=await Promise.all([
          ld(SK.JOBS,true),
          ld(SK.APPLICATIONS,true),
          ld(SK.COMPANIES,true)
        ]);
        nextData={destination,jobs:jobs||[],applications:applications||[],companies:companies||[]};
      }else if(destination==="candidate"&&role==="jobseeker"){
        await sheetListMulti(["Job Seekers","Requests","Applied"],true);
      }else if(destination==="employer"&&role==="employer"){
        await sheetListMulti(["Jobs","Requests","Applied","Job Seekers"],true);
      }

      if(navigationId!==menuNavigationId.current)return;
      setNavigationData(nextData);
      setPage(destination);
      pushRoute(destination);
      await waitForReactCommit();
    }finally{
      finishGlobalLoadingOperation();
    }
  },[page,role]);

  const openNotifs=()=>{ if(page!=="notifications"){ setPrevPage(page); setPage("notifications"); pushRoute("notifications"); } };

  const clearSession=async()=>{
    await sd(SK.SESSION,null,true);
    try{sessionStorage.removeItem(SK.SESSION);}catch(e){}
  };

  const logout=async()=>{
    await clearSession();
    setSession(null);setRole(null);setCompany(null);setCompanyChecked(false);
  };

  const deleteAccount=async()=>{
    if(!window.confirm("This will permanently delete your account and profile data. This cannot be undone. Continue?"))return;
    if(session.role==="jobseeker"){
      const accounts=((await ld(SK.ACCOUNTS_JS,true))||[]).filter(a=>a.email.toLowerCase()!==session.email.toLowerCase());
      await sd(SK.ACCOUNTS_JS,accounts,true);
      await sd("pairup_my_profile_"+session.email,null,true);
      await deleteOne(SK.CANDIDATES,"code",session.code);
    }else{
      const accounts=((await ld(SK.ACCOUNTS_EMP,true))||[]).filter(a=>a.email.toLowerCase()!==session.email.toLowerCase());
      await sd(SK.ACCOUNTS_EMP,accounts,true);
      await deleteOne(SK.COMPANIES,"code",session.code);
    }
    await clearSession();
    setSession(null);setRole(null);setCompany(null);setCompanyChecked(false);
  };

  if(booting)return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,background:"var(--color-background-tertiary)",fontFamily:FONT}}>
      <Icon name="loader-2" size={26} style={{color:BRAND,animation:"spin 1s linear infinite"}}/>
      <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>PairUp is loading, please wait...</p>
    </div>
  );

  // Admin console (talent pool & jobs moderation) — accessible via #admin, no
  // job-seeker/employer login required.
  if(isAdmin)return <PageErrorBoundary><AdminGate/></PageErrorBoundary>;

  // Public preview: anyone visiting a Talent Pool / Jobs URL (including a
  // deep link straight to one candidate or job) sees that content immediately,
  // signed in or not — matching how job boards normally work. Actions that
  // need an identity (Apply, Contact Request) prompt sign-in only when
  // actually attempted, via onNeedSignIn below, rather than blocking the
  // whole page up front.
  if(!session&&(page==="public"||page==="jobs")){
    const navigateGuest=destination=>{ setPage(destination); pushRoute(destination); };
    const needSignIn=()=>{ setPage(role==="employer"?"employer":"candidate"); }; // falls through to RoleSelection/AuthPage below; the URL (and thus initialRouteRef/parseRoute at sign-in time) still points at whatever was open, so signing in returns here
    return (
      <div style={{minHeight:"100vh",background:"var(--color-background-tertiary)",fontFamily:FONT}}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap');
          @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
          input,select,textarea{font-family:'Noto Sans Khmer',sans-serif;font-size:13px;padding:8px 12px;border:0.5px solid var(--color-border-secondary);border-radius:8px;outline:none;background:var(--color-background-primary);color:var(--color-text-primary);width:100%;box-sizing:border-box;}
          input:focus,select:focus,textarea:focus{border-color:${BRAND};box-shadow:0 0 0 3px ${BRAND}18;}
          select{width:auto;}
        `}</style>
        <GuestNav page={page} onNavigate={navigateGuest} onSignIn={needSignIn}/>
        <PageErrorBoundary key={page}>
          {page==="public"&&<PublicPage onRequest={()=>{}} session={null} company={null} initialCandidates={[]} initialSelectedCode={parseRoute().sub} onNeedSignIn={needSignIn}/>}
          {page==="jobs"&&<JobsPage onApply={()=>{}} session={null} initialJobs={[]} initialCompanies={[]} initialApplications={[]} initialSelectedCode={parseRoute().sub} onNeedSignIn={needSignIn}/>}
        </PageErrorBoundary>
      </div>
    );
  }

  if(!role)return <RoleSelection onSelect={r=>setRole(r)}/>;

  if(!session)return <AuthPage role={role} onBack={()=>setRole(null)} onAuthed={s=>{
    setSession(s);
    const route=initialRouteRef.current;
    const allowedPages={notifications:true,public:true,jobs:true,candidate:s.role==="jobseeker",employer:s.role==="employer"};
    const defaultPage=s.role==="jobseeker"?"candidate":"employer";
    const initialPage=(route.page&&route.page!=="admin"&&allowedPages[route.page])?route.page:defaultPage;
    setPage(initialPage);
    replaceRoute(initialPage,initialPage===route.page?route.sub:"");
  }}/>;

  if(session.role==="employer"&&!companyChecked)return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,background:"var(--color-background-tertiary)",fontFamily:FONT}}>
      <Icon name="loader-2" size={26} style={{color:BRAND,animation:"spin 1s linear infinite"}}/>
      <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>PairUp is loading, please wait...</p>
    </div>
  );

  if(session.role==="employer"&&companyChecked&&!company){
    return <CompanyProfilePage session={session} onSaved={(c)=>{setCompany(c);}}/>;
  }

  return(
    <div style={{minHeight:"100vh",background:"var(--color-background-tertiary)",fontFamily:FONT}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap');
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        input,select,textarea{font-family:'Noto Sans Khmer',sans-serif;font-size:13px;padding:8px 12px;border:0.5px solid var(--color-border-secondary);border-radius:8px;outline:none;background:var(--color-background-primary);color:var(--color-text-primary);width:100%;box-sizing:border-box;}
        input:focus,select:focus,textarea:focus{border-color:${BRAND};box-shadow:0 0 0 3px ${BRAND}18;}
        select{width:auto;}
      `}</style>
      <Nav page={page} onNavigate={navigateMenu} notifCount={notifCount} role={role} onLogout={logout} onDeleteAccount={deleteAccount} onOpenSync={()=>setShowSync(true)} showSync={isAdmin} onOpenNotifs={openNotifs}/>
      <PageErrorBoundary key={page}>
        {page==="candidate"&&role==="jobseeker"&&<CandidatePage onSubmit={bump} refresh={refresh} session={session} initialTab={initialRouteRef.current.page==="candidate"?Object.keys(CANDIDATE_SUBTABS).find(k=>CANDIDATE_SUBTABS[k]===initialRouteRef.current.sub):undefined}/>}
        {page==="public"&&<PublicPage onRequest={bump} session={session} company={company} initialCandidates={navigationData?.destination==="public"?navigationData.candidates:[]} initialSelectedCode={initialRouteRef.current.page==="public"?initialRouteRef.current.sub:""}/>}
        {page==="jobs"&&<JobsPage onApply={bump} session={session} initialJobs={navigationData?.destination==="jobs"?navigationData.jobs:[]} initialCompanies={navigationData?.destination==="jobs"?navigationData.companies:[]} initialApplications={navigationData?.destination==="jobs"?navigationData.applications:[]} initialSelectedCode={initialRouteRef.current.page==="jobs"?initialRouteRef.current.sub:""}/>}
        {page==="employer"&&role==="employer"&&<EmployerPage onPost={bump} refresh={refresh} session={session} company={company} onCompanyUpdated={setCompany} initialTab={initialRouteRef.current.page==="employer"?Object.keys(EMPLOYER_SUBTABS).find(k=>EMPLOYER_SUBTABS[k]===initialRouteRef.current.sub):undefined}/>}
        {page==="notifications"&&<NotificationsPage onRefresh={bump} role={role} session={session} onBack={()=>{setPage(prevPage);pushRoute(prevPage);}}/>}
      </PageErrorBoundary>
      {showSync&&<SyncSettingsModal onClose={()=>setShowSync(false)}/>}
    </div>
  );
}

// Catches render-time exceptions in whichever page is mounted below it,
// instead of letting them propagate up and blank the entire app with no
// feedback (which is what used to happen — one bad record in the data, e.g.
// an old-format field a newer UI didn't expect, could crash the whole tree).
// Scoped per-page (see PageBoundary usage below) so a bug on one tab can't
// take down navigation or any other tab; "Try again" just re-mounts the
// crashed subtree without a full page reload, and the person's session is
// untouched either way since this never affects React state elsewhere.
class PageErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={hasError:false};}
  static getDerivedStateFromError(){return{hasError:true};}
  componentDidCatch(error,info){console.error("Page render error:",error,info);}
  render(){
    if(this.state.hasError){
      return (
        <div style={{maxWidth:480,margin:"4rem auto",textAlign:"center",padding:"0 1.5rem",fontFamily:FONT}}>
          <div style={{width:64,height:64,borderRadius:"50%",background:"#FFF1F0",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 1.25rem"}}>
            <Icon name="alert-triangle" size={28} style={{color:"#D4483F"}}/>
          </div>
          <h2 style={{fontWeight:800,fontSize:19,margin:"0 0 8px",color:BRAND}}>Something went wrong loading this page</h2>
          <p style={{color:"var(--color-text-secondary)",fontSize:13,marginBottom:"1.5rem",lineHeight:1.6}}>This is likely a temporary glitch. You can try again, or head back and come back later.</p>
          <Btn onClick={()=>this.setState({hasError:false})}>Try again</Btn>
        </div>
      );
    }
    return this.props.children;
  }
}

function AppRoot(){
  return <><GlobalInteractionLoading/><App/></>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppRoot />);
  </script>
</body>
