            </div>

            {/* Career Details */}
            <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16,padding:"1.5rem",marginBottom:"1.25rem"}}>
              <h3 style={{fontSize:12,fontWeight:800,color:BRAND,margin:"0 0 1.25rem",textTransform:"uppercase",letterSpacing:1,display:"flex",alignItems:"center",gap:6}}>
                <Icon name="briefcase" size={14}/>Career Details
              </h3>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 32px",marginBottom:"1.25rem"}}>
                <InfoCell label="Field" value={p.field}/>
                <InfoCell label="Years of Experience" value={p.years}/>
                <InfoCell label="Available to Start" value={p.onboard}/>
              </div>
              {[["Preferred Locations",p.locations||[],"blue"],["Industries",p.industries||[],"blue"]].map(([l,items,color])=>(
                <div key={l} style={{marginBottom:"1rem"}}>
                  <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 8px"}}>{l}</p>
                  {items.length>0
                    ?<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{items.map(i=><Badge key={i} color={color}>{i}</Badge>)}</div>
                    :<p style={{fontSize:13,color:"#bbb",margin:0,fontStyle:"italic"}}>Not provided</p>
                  }
                </div>
              ))}
              <div style={{marginBottom:"1rem"}}>
                <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 8px"}}>Languages</p>
                {(p.languages||[]).length>0
                  ?<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{(p.languages||[]).map(l=><span key={l.lang} style={{background:BRAND_LIGHT,color:BRAND,fontSize:12,fontWeight:600,padding:"4px 12px",borderRadius:99,display:"inline-flex",alignItems:"center",gap:4}}>{l.lang}<span style={{opacity:0.5,fontSize:10}}>· {l.level}</span></span>)}</div>
                  :<p style={{fontSize:13,color:"#bbb",margin:0,fontStyle:"italic"}}>Not provided</p>
                }
              </div>
              <div style={{marginBottom:p.intro?"1rem":"0"}}>
                <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 6px"}}>Key Skills</p>
                <p style={{fontSize:14,margin:0,lineHeight:1.6,color:p.skills?"var(--color-text-primary)":"#bbb",fontStyle:p.skills?"normal":"italic"}}>{p.skills||"Not provided"}</p>
              </div>
              {p.intro&&(
                <div style={{marginTop:"1rem"}}>
                  <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 8px"}}>Professional Summary</p>
                  <div style={{fontSize:14,lineHeight:1.8,margin:0}} dangerouslySetInnerHTML={{__html:p.intro}}/>
                </div>
              )}
            </div>

            {/* Sharing status */}
            {profile&&(!shareOn?(
              <div style={{background:"#FEF3CD",borderRadius:12,padding:"1rem 1.25rem",display:"flex",alignItems:"center",gap:12,border:"1px solid #F59E0B33"}}>
                <Icon name="eye-off" size={18} style={{color:"#7A4F00",flexShrink:0}}/>
                <div style={{flex:1}}>
                  <p style={{fontWeight:700,fontSize:13,color:"#7A4F00",margin:"0 0 2px"}}>Your profile is private</p>
                  <p style={{fontSize:12,color:"#92400E",margin:0}}>Enable "Share profile" to appear in the Talent Pool.</p>
                </div>
                <button onClick={()=>doToggleShare(true)} style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid #7A4F00",background:"none",color:"#7A4F00",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:FONT,whiteSpace:"nowrap"}}>Share now</button>
              </div>
            ):(
              <div style={{background:"#E6F4EA",borderRadius:12,padding:"1rem 1.25rem",display:"flex",alignItems:"center",gap:10,border:"1px solid #1A5C2A33"}}>
                <Icon name="eye" size={18} style={{color:"#1A5C2A",flexShrink:0}}/>
                <p style={{fontSize:13,color:"#1A5C2A",margin:0,fontWeight:600}}>Visible in the Talent Pool — contact details are hidden until you approve each request.</p>
              </div>
            ))}
          </>
        )}

        {/* APPLIED JOBS TAB */}
        {tab==="applied"&&(
          <div>
            <div style={{marginBottom:"1rem"}}>
              <h2 style={{fontSize:16,fontWeight:800,margin:"0 0 3px",color:BRAND}}>Applied Jobs</h2>
              <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>Track the jobs you have applied for and employer activity on your profile.</p>
            </div>
            {appliedJobs.length===0?(
              <div style={{textAlign:"center",padding:"3rem 1rem",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16}}>
                <Icon name="briefcase-off" size={36} style={{color:BRAND_DIM,display:"block",margin:"0 auto 12px"}}/>
                <p style={{fontWeight:700,fontSize:15,margin:"0 0 6px"}}>No applied jobs yet</p>
                <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>Your applications will appear here.</p>
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {appliedJobs.map(a=>(
                  <div key={a.id} style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:14,padding:"1rem 1.25rem"}}>
                    <div style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"flex-start"}}>
                      <div>
                        <p style={{fontWeight:800,fontSize:15,color:BRAND,margin:"0 0 4px"}}>{a.jobTitle}</p>
                        <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}>{a.company} · Applied {fmt(a.createdAt)}</p>
                      </div>
                      <Badge color={a.status==="rejected"?"red":a.status==="passed"?"green":(!a.status||a.status==="applied")?"blue":"amber"}>{a.status==="rejected"?"Rejected":a.status==="passed"?"Passed":(!a.status||a.status==="applied")?"Applied":"Processing"}</Badge>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* CONTACT REQUESTS TAB */}
        {tab==="requests"&&(
          <div>
            <div style={{marginBottom:"1rem"}}>
              <h2 style={{fontSize:16,fontWeight:800,margin:"0 0 3px",color:BRAND}}>Contact Requests</h2>
              <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>
                {requests.length} request{requests.length!==1?"s":""}{pendingCount>0?` · ${pendingCount} pending`:""}</p>
            </div>
            {requests.length===0?(
              <div style={{textAlign:"center",padding:"3rem 1rem",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16}}>
                <Icon name="mail-off" size={36} style={{color:BRAND_DIM,display:"block",margin:"0 auto 12px"}}/>
                <p style={{fontWeight:700,fontSize:15,margin:"0 0 6px"}}>No contact requests yet</p>
                <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>Share your profile to get discovered by employers</p>
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {requests.map(r=>(
                  <div key={r.id} onClick={()=>setSelReq(r)} style={{background:"var(--color-background-primary)",border:`1px solid ${r.status==="pending"?BRAND+"44":"var(--color-border-tertiary)"}`,borderRadius:14,padding:"1rem 1.25rem",cursor:"pointer",display:"flex",alignItems:"center",gap:14,boxShadow:r.status==="pending"?"0 2px 10px "+BRAND+"14":"none"}}>
                    <div style={{width:44,height:44,borderRadius:10,background:r.status==="pending"?BRAND_LIGHT:"var(--color-background-secondary)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:r.status==="pending"?`1px solid ${BRAND}22`:"0.5px solid var(--color-border-tertiary)"}}>
                      <Icon name="building" size={20} style={{color:r.status==="pending"?BRAND:"var(--color-text-secondary)"}}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                        <p style={{fontWeight:800,fontSize:15,margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.company}</p>
                        {r.status==="pending"&&<span style={{width:7,height:7,borderRadius:"50%",background:"#FF6B6B",flexShrink:0}}/>}
                      </div>
                      <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:"0 0 2px"}}>{r.title}</p>
                      <p style={{fontSize:11,color:"var(--color-text-secondary)",margin:0}}>{fmt(r.createdAt)}{r.salary?` · ${r.salary}`:""}</p>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
                      <Badge color={r.status==="pending"?"amber":r.status==="accepted"?"green":"red"}>
                        {r.status==="pending"?"Awaiting reply":r.status==="accepted"?"Accepted":"Declined"}
                      </Badge>
                      <Icon name="chevron-right" size={14} style={{color:"var(--color-text-secondary)"}}/>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── TALENT POOL ───────────────────────────────────────────────────────────────
function PublicPage({onRequest,session,company,initialCandidates=[],initialSelectedCode="",onNeedSignIn}){
  const [candidates,setCandidates]=useState(()=>initialCandidates.filter(c=>c.consentPool&&c.shareActive));
  const [filter,setFilter]=useState({location:"",industry:"",years:"",field:"",activelyExploring:"",workingModel:"",contractType:""});
  const [search,setSearch]=useState("");
  const [selected,setSelected]=useState(null);
  const [showContactForm,setShowContactForm]=useState(false);
  const [reqForm,setReqForm]=useState({company:company?.name||"",contactName:company?.contactPerson||"",contactEmail:session?.email||"",contactPhone:"",title:"",jd:"",salary:"",benefits:""});
  const [reqErrors,setReqErrors]=useState({});
  const [reqSent,setReqSent]=useState(false);
  const [isSendingRequest,setIsSendingRequest]=useState(false);
  const rfset=(k,v)=>setReqForm(f=>({...f,[k]:v}));
  const triedAutoOpen=useRef(false);
  const [needsListFallbackOpen,setNeedsListFallbackOpen]=useState(false);
  const [listLoadedOnce,setListLoadedOnce]=useState(false);
  const [deepLinkLoading,setDeepLinkLoading]=useState(!!initialSelectedCode);

  // If we're opening a specific shared link, don't ALSO fire the full-list
  // fetch at the exact same instant — Apps Script serializes/limits how many
  // requests from the same client it services at once, so two simultaneous
  // requests can each end up slower than either run alone. The one-record
  // lookup below gets priority; the full list (needed for browsing/filtering)
  // loads right after it settles instead of racing it.
  useEffect(()=>{
    if(!initialSelectedCode){
      ld(SK.CANDIDATES,true).then(d=>{setCandidates((d||[]).filter(c=>c.consentPool&&c.shareActive));setListLoadedOnce(true);});
    }
  },[]);

  // Deep link support: "#/talent-pool/<code>" opens that candidate directly.
  // Uses the lightweight get_row lookup (one record, not the whole table) so
  // a shared profile link opens fast regardless of how many candidates are
  // in the pool — this used to wait for the ENTIRE candidates list to finish
  // loading first, which was the main reason opening a shared link felt slow.
  // Falls back to waiting on the full list only if an older Apps Script
  // deployment doesn't recognize "get_row" yet.
  useEffect(()=>{
    if(!initialSelectedCode)return;
    (async()=>{
      const composite=await postCompositeAction("get_row",{sheet:"Job Seekers",key:"code",value:initialSelectedCode});
      if(composite.supported){
        triedAutoOpen.current=true;
        // Only open if the candidate is still opted into the Talent Pool —
        // if they've since turned Share off, an old link shouldn't keep
        // exposing their profile.
        if(composite.success&&composite.row&&composite.row.consentPool&&composite.row.shareActive)openCandidate(composite.row);
        setDeepLinkLoading(false);
        ld(SK.CANDIDATES,true).then(d=>{setCandidates((d||[]).filter(c=>c.consentPool&&c.shareActive));setListLoadedOnce(true);});
        return;
      }
      setNeedsListFallbackOpen(true);
      ld(SK.CANDIDATES,true).then(d=>{setCandidates((d||[]).filter(c=>c.consentPool&&c.shareActive));setListLoadedOnce(true);});
    })();
  },[]);
  useEffect(()=>{
    if(triedAutoOpen.current||!needsListFallbackOpen||!listLoadedOnce)return;
    const match=candidates.find(c=>c.code===initialSelectedCode);
    if(match){triedAutoOpen.current=true;openCandidate(match);}
    setDeepLinkLoading(false);
  },[candidates,needsListFallbackOpen,listLoadedOnce]);

  // Browser Back/Forward while a candidate is open: close/switch to match the
  // URL, rather than leaving a stale modal open after the address bar moved on.
  useEffect(()=>{
    const onPop=()=>{
      const route=parseRoute();
      if(route.page!=="public")return;
      if(!route.sub){setSelected(null);setShowContactForm(false);return;}
      const match=candidates.find(c=>c.code===route.sub);
      if(match)setSelected(match);
    };
    window.addEventListener("popstate",onPop);
    return ()=>window.removeEventListener("popstate",onPop);
  },[candidates]);

  const q=search.trim().toLowerCase();
  const filtered=candidates.filter(c=>
    (!filter.location||(filter.location==="Others"?(c.locations||[]).some(l=>!LOCATIONS.includes(l)):c.locations?.includes(filter.location)))&&
    (!filter.industry||(c.industries||[]).includes(filter.industry))&&
    (!filter.years||c.years===filter.years)&&
    (!filter.field||c.field===filter.field)&&
    (!filter.activelyExploring||c.activelyExploring===filter.activelyExploring)&&
    (!filter.workingModel||asArr(c.workingModel).includes(filter.workingModel))&&
    (!filter.contractType||c.contractType===filter.contractType)&&
    (!q||[c.code,c.position,c.field,c.skills,(c.industries||[]).join(" "),(c.locations||[]).join(" "),stripHtml(c.intro)].filter(Boolean).join(" ").toLowerCase().includes(q))
  );

  const openCandidate=(c)=>{
    setSelected(c);setShowContactForm(false);
    setReqSent(false);setReqForm({company:company?.name||"",contactName:company?.contactPerson||"",contactEmail:session?.email||"",contactPhone:"",title:"",jd:"",salary:"",benefits:""});setReqErrors({});
    pushRoute("public",c.code);
  };
  const closeCandidate=()=>{setSelected(null);setShowContactForm(false);replaceRoute("public","");};

  const sendRequest=async()=>{
    if(isSendingRequest)return;
    const e={};
    if(!reqForm.company.trim())e.company="Required";
    if(!reqForm.contactName.trim())e.contactName="Required";
    if(!reqForm.contactEmail.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/))e.contactEmail="Invalid email";
    if(!reqForm.title.trim())e.title="Required";
    if(!reqForm.jd.trim())e.jd="Required";
    if(Object.keys(e).length){setReqErrors(e);return;}

    setIsSendingRequest(true);
    setReqErrors({});
    const createdAt=new Date().toISOString();
    const request={id:gid(),candidateCode:selected.code,employerEmail:session?.email||null,companyCode:session?.code||null,...reqForm,createdAt,status:"pending"};
    const notification={id:gid(),type:"contact_request",to:selected.code,company:reqForm.company,title:reqForm.title,message:`${reqForm.company} has sent you a contact request for the role of ${reqForm.title}`,detail:request,createdAt,read:false};
    const email=selected.email?{to:selected.email,subject:`${reqForm.company} wants to connect with you about ${reqForm.title}`,body:`Hi ${selected.name||"there"},\n\n${reqForm.company} found your profile in the pairup Talent Pool and would like to connect with you about the ${reqForm.title} role.\n\n${reqForm.jd}\n\n${reqForm.salary?`Salary range: ${reqForm.salary}\n`:""}${reqForm.benefits?`Benefits: ${reqForm.benefits}\n`:""}\nContact: ${reqForm.contactName} (${reqForm.contactEmail}${reqForm.contactPhone?`, ${reqForm.contactPhone}`:""})\n\nLog in to pairup to review and respond to this request.\n\nBest regards,\n${reqForm.company}`} : null;
    try{
      const result=await submitContactRequest(request,notification,email);
      if(!result.success){
        setReqErrors({submit:"Could not send the request. Please check your connection and try again."});
        return;
      }
      setReqSent(true);
      onRequest();
    }catch(error){
      console.error("Contact request submission failed",error);
      setReqErrors({submit:"Could not send the request. Please check your connection and try again."});
    }finally{
      setIsSendingRequest(false);
    }
  };

  // Filter bar helper - now handled by FilterPills component

  const TABLE_COLS=["Code","Position","Field","Industry","Location","Working Model","Contract","Experience","Languages","Skills","Salary","Summary","Exploring",""];

  return(
    <div style={{maxWidth:1200,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      {deepLinkLoading&&(
        <div style={{position:"fixed",inset:0,background:"rgba(255,255,255,0.85)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,zIndex:400}}>
          <Icon name="loader-2" size={28} style={{color:BRAND,animation:"spin 1s linear infinite"}}/>
          <p style={{fontSize:13,color:BRAND,fontWeight:600,margin:0}}>Loading this profile...</p>
        </div>
      )}
      <h1 style={{fontSize:26,fontWeight:800,marginBottom:4}}>Talent Pool</h1>
      <p style={{color:"var(--color-text-secondary)",fontSize:13,marginBottom:"1.5rem"}}>Browse candidates who are open to new opportunities</p>

      {/* Search */}
      <div style={{position:"relative",marginBottom:"1rem"}}>
        <Icon name="search" size={16} style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"var(--color-text-secondary)"}}/>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by position, skill, field, industry, location..." style={{...inp,padding:"10px 14px 10px 38px"}}/>
      </div>

      {/* Filters */}
      <Card style={{marginBottom:"1.5rem"}}>
        <SH icon="filter" title="Filters"/>
        <FilterPills title="Location" options={[...LOCATIONS,"Others"]} value={filter.location} onChange={v=>setFilter(f=>({...f,location:v}))} inline={4}/>
        <FilterPills title="Working Model" options={WORKING_MODELS} value={filter.workingModel} onChange={v=>setFilter(f=>({...f,workingModel:v}))} inline={3}/>
        <FilterPills title="Type of Contract" options={CONTRACT_TYPES} value={filter.contractType} onChange={v=>setFilter(f=>({...f,contractType:v}))} inline={3}/>
        <FilterPills title="Field" options={FIELDS} value={filter.field} onChange={v=>setFilter(f=>({...f,field:v}))} inline={6}/>
        <FilterPills title="Industry" options={INDUSTRIES} value={filter.industry} onChange={v=>setFilter(f=>({...f,industry:v}))} inline={5}/>
        <FilterPills title="Experience" options={YEARS_OPTS} value={filter.years} onChange={v=>setFilter(f=>({...f,years:v}))} inline={6}/>
        <FilterPills title="Actively Exploring" options={["Yes","No"]} value={filter.activelyExploring} onChange={v=>setFilter(f=>({...f,activelyExploring:v}))} inline={2}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4,paddingTop:8,borderTop:"0.5px solid var(--color-border-tertiary)"}}>
          <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}><strong>{filtered.length}</strong> candidate{filtered.length!==1?"s":""} found</p>
          <button onClick={()=>setFilter({location:"",industry:"",years:"",field:"",activelyExploring:"",workingModel:"",contractType:""})} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:BRAND,fontFamily:FONT,fontWeight:600}}>Clear all filters</button>
        </div>
      </Card>

      {/* Table */}
      <div style={{overflowX:"auto",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,fontFamily:FONT,minWidth:900}}>
          <thead>
            <tr style={{background:BRAND}}>
              {TABLE_COLS.map(h=><th key={h} style={{textAlign:"left",padding:"11px 14px",fontWeight:700,fontSize:11,color:"rgba(255,255,255,0.9)",whiteSpace:"nowrap",textTransform:"uppercase",letterSpacing:0.6}}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {filtered.map((c,i)=>(
              <tr key={c.code} style={{borderBottom:"0.5px solid var(--color-border-tertiary)",background:i%2===0?"var(--color-background-primary)":"var(--color-background-secondary)",transition:"background 0.1s"}} onMouseEnter={e=>e.currentTarget.style.background=BRAND_LIGHT} onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"var(--color-background-primary)":"var(--color-background-secondary)"}>
                <td style={{padding:"12px 14px",fontFamily:"monospace",fontWeight:700,fontSize:12,color:BRAND,whiteSpace:"nowrap"}}>{c.code}</td>
                <td style={{padding:"12px 14px",fontWeight:600,minWidth:140}}>{c.position}</td>
                <td style={{padding:"12px 14px",minWidth:100}}>{c.field&&<Badge color="purple">{c.field}</Badge>}</td>
                <td style={{padding:"12px 14px",minWidth:130,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--color-text-secondary)"}}>{(c.industries||[]).join(", ")}</td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap"}}><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(c.locations||[]).map(l=><Badge key={l} color="blue">{l}</Badge>)}</div></td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap",color:"var(--color-text-secondary)"}}>{asArr(c.workingModel).join(", ")||"—"}</td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap",color:"var(--color-text-secondary)"}}>{c.contractType||"—"}</td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap",color:"var(--color-text-secondary)"}}>{c.years}</td>
                <td style={{padding:"12px 14px",minWidth:120}}><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(c.languages||[]).map(l=><span key={l.lang} style={{background:BRAND_LIGHT,color:BRAND,fontSize:10,fontWeight:600,padding:"2px 7px",borderRadius:99,whiteSpace:"nowrap"}}>{l.lang}{l.level?` · ${l.level}`:""}</span>)}</div></td>
                <td style={{padding:"12px 14px",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--color-text-secondary)"}}>{c.skills}</td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap",color:BRAND,fontWeight:600}}>{c.salary||"—"}</td>
                <td style={{padding:"12px 14px",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--color-text-secondary)",fontSize:12}}>{stripHtml(c.intro)||"—"}</td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap"}}>{c.activelyExploring&&<Badge color={c.activelyExploring==="Yes"?"green":"gray"}>{c.activelyExploring}</Badge>}</td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap"}}>
                  <Btn onClick={()=>openCandidate(c)} style={{fontSize:11,padding:"5px 12px"}}>View</Btn>
                </td>
              </tr>
            ))}
            {filtered.length===0&&<tr><td colSpan={TABLE_COLS.length} style={{padding:"3rem",textAlign:"center",color:"var(--color-text-secondary)"}}>No candidates match your filters</td></tr>}
          </tbody>
        </table>
      </div>

      {/* CANDIDATE DETAIL MODAL */}
      {selected&&!showContactForm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,30,80,0.45)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:200,padding:"2rem 1rem",overflowY:"auto"}}>
          {
            <div style={{background:"#ffffff",borderRadius:20,width:"100%",maxWidth:1000,padding:"2rem",fontFamily:FONT,boxShadow:"0 24px 60px rgba(0,44,118,0.18)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"1.5rem"}}>
                <div>
                  <span style={{fontFamily:"monospace",fontWeight:700,background:BRAND_LIGHT,color:BRAND,padding:"3px 10px",borderRadius:6,fontSize:12}}>{selected.code}</span>
                  <h2 style={{fontSize:21,fontWeight:800,margin:"8px 0 4px",color:BRAND}}>{selected.position}</h2>
                  <p style={{color:"var(--color-text-secondary)",fontSize:13,margin:0,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                    {selected.field&&<Badge color="purple">{selected.field}</Badge>}
                    <span>{(selected.industries||[]).join(", ")}</span>
                    <span>·</span><span>{selected.years}</span>
                  </p>
                </div>
                <button onClick={closeCandidate} style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",fontSize:16,color:BRAND,width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,flexShrink:0}}>✕</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 280px",gap:"1.5rem",alignItems:"start"}}>
                <div>
                  <Card>
                    <div style={{marginBottom:"0.875rem"}}><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 4px"}}>Key Skills</p><p style={{fontSize:14,lineHeight:1.7,margin:0}}>{selected.skills}</p></div>
                    {selected.intro&&<div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 4px"}}>Professional Summary</p><div style={{fontSize:14,lineHeight:1.8,margin:0}} dangerouslySetInnerHTML={{__html:selected.intro}}/></div>}
                  </Card>
                  <div style={{background:BRAND_LIGHT,borderRadius:10,padding:"0.875rem 1rem",marginTop:"1.25rem",display:"flex",alignItems:"center",gap:10,border:`1px solid ${BRAND}22`}}>
                    <Icon name="lock" size={16} style={{color:BRAND}}/>
                    <span style={{fontSize:12,color:BRAND,fontWeight:600}}>Portfolio and CV links are private and will only be shared after the candidate accepts your request.</span>
                  </div>
                </div>
                <div>
                  <Card style={{position:"sticky",top:16}}>
                    <SH icon="user-circle" title="Candidate Details"/>
                    <div style={{display:"flex",flexDirection:"column",gap:14}}>
                      <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 5px"}}>Location</p><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(selected.locations||[]).map(l=><Badge key={l} color="blue">{l}</Badge>)}</div></div>
                      <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 5px"}}>Working Model</p>{asArr(selected.workingModel).length?<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{asArr(selected.workingModel).map(w=><Badge key={w} color="blue">{w}</Badge>)}</div>:<p style={{fontSize:13,margin:0}}>—</p>}</div>
                      <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 3px"}}>Type of Contract</p><p style={{fontSize:13,margin:0}}>{selected.contractType||"—"}</p></div>
                      <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 3px"}}>Salary Expectation</p><p style={{fontSize:13,fontWeight:700,color:BRAND,margin:0}}>{selected.salary||"—"}</p></div>
                      <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 5px"}}>Languages</p><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(selected.languages||[]).map(l=><span key={l.lang} style={{background:BRAND_LIGHT,color:BRAND,fontSize:11,fontWeight:600,padding:"3px 9px",borderRadius:99}}>{l.lang} · {l.level}</span>)}</div></div>
                      <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 3px"}}>Available</p><p style={{fontSize:13,margin:0}}>{selected.onboard||"—"}</p></div>
                      <div><p style={{fontSize:11,fontWeight:700,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.5,margin:"0 0 3px"}}>Actively Exploring</p>{selected.activelyExploring?<Badge color={selected.activelyExploring==="Yes"?"green":"gray"}>{selected.activelyExploring}</Badge>:<p style={{fontSize:13,margin:0}}>—</p>}</div>
                    </div>
                    <Btn onClick={()=>session?setShowContactForm(true):onNeedSignIn&&onNeedSignIn()} style={{width:"100%",justifyContent:"center",fontSize:14,padding:"12px",marginTop:16}}><Icon name="send" size={14}/>{session?"Contact Request":"Sign in to contact"}</Btn>
                  </Card>
                </div>
              </div>
            </div>
          }
        </div>
      )}

      {/* CONTACT FORM MODAL */}
      {showContactForm&&selected&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,30,80,0.45)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:300,padding:"2rem 1rem",overflowY:"auto"}}>
          <div style={{background:"#ffffff",borderRadius:20,width:"100%",maxWidth:580,padding:"2rem",fontFamily:FONT,boxShadow:"0 24px 60px rgba(0,44,118,0.18)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.5rem"}}>
              <div>
                <h2 style={{fontSize:18,fontWeight:800,margin:"0 0 4px",color:BRAND}}>Send Contact Request</h2>
                <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}>To candidate: <strong style={{fontFamily:"monospace",color:BRAND}}>{selected.code}</strong></p>
              </div>
              <button onClick={closeCandidate} style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",fontSize:16,color:BRAND,width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,flexShrink:0}}>✕</button>
            </div>
            {reqSent?(
              <div style={{textAlign:"center",padding:"2rem",background:BRAND_LIGHT,borderRadius:14}}>
                <Icon name="check-circle" size={36} style={{color:BRAND}}/>
                <p style={{fontWeight:800,marginTop:8,fontSize:16,color:BRAND}}>Request sent!</p>
                <p style={{fontSize:13,color:"var(--color-text-secondary)"}}>The candidate will be notified and will respond to your request.</p>
                <Btn onClick={closeCandidate} style={{marginTop:12}}>Close</Btn>
              </div>
            ):(
              <>
                <p style={{fontSize:11,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"0 0 1rem"}}>Company Information</p>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
                  <F label="Company name" error={reqErrors.company} required><input style={inp} value={reqForm.company} onChange={e=>rfset("company",e.target.value)}/></F>
                  <F label="Contact person" error={reqErrors.contactName} required><input style={inp} value={reqForm.contactName} onChange={e=>rfset("contactName",e.target.value)}/></F>
                  <F label="Contact email" error={reqErrors.contactEmail} required><input style={inp} type="email" value={reqForm.contactEmail} onChange={e=>rfset("contactEmail",e.target.value)}/></F>
                  <F label="Contact phone"><input style={inp} value={reqForm.contactPhone} onChange={e=>rfset("contactPhone",e.target.value)}/></F>
                </div>
                <p style={{fontSize:11,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"1rem 0"}}>Role Details</p>
                <F label="Job title" error={reqErrors.title} required><input style={inp} value={reqForm.title} onChange={e=>rfset("title",e.target.value)} placeholder="e.g. Senior Frontend Developer"/></F>
                <F label="Job description" error={reqErrors.jd} required><textarea rows={4} style={{...inp,resize:"vertical"}} value={reqForm.jd} onChange={e=>rfset("jd",e.target.value)} placeholder="Describe the role, responsibilities, and team…"/></F>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
                  <F label="Offered salary"><input style={inp} value={reqForm.salary} onChange={e=>rfset("salary",e.target.value)} placeholder="e.g. 30–40M VND/month"/></F>
                  <F label="Additional benefits"><input style={inp} value={reqForm.benefits} onChange={e=>rfset("benefits",e.target.value)} placeholder="e.g. insurance, remote, equity"/></F>
                </div>
                {reqErrors.submit&&<p style={{fontSize:12,color:"#E24B4A",margin:"0 0 10px"}}>{reqErrors.submit}</p>}
                <Btn onClick={sendRequest} disabled={isSendingRequest} style={{width:"100%",justifyContent:"center",fontSize:14,padding:"13px",marginTop:4,opacity:isSendingRequest?0.65:1,cursor:isSendingRequest?"not-allowed":"pointer"}}>{isSendingRequest?"Sending…":"Send Request →"}</Btn>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── POST JOB PAGE (full page, not modal) ─────────────────────────────────────
const BENEFITS_KEY="pairup_saved_benefits";
const RECRUITMENT_ROUNDS=["Applied","Screening","Test","Interview","Offer","Onboard","Rejected","Pipeline"];
const STAGE_DESCRIPTIONS={Applied:"Application received",Screening:"Initial qualification and screening",Test:"Skills or take-home assessment",Interview:"Hiring team interview",Offer:"Offer stage",Onboard:"New hire onboarding",Rejected:"Candidate not moving forward",Pipeline:"Saved for future consideration"};
const ROUND_REASONS=["Over qualified","Under qualified","Lack of experience","Salary","Culture","Motivation","Career Path","Others"];
const DEFAULT_RECRUITMENT_PROCESS=RECRUITMENT_ROUNDS.map((name)=>({name,enabled:true,description:STAGE_DESCRIPTIONS[name]||""}));

function PostJobPage({onBack,onSuccess,company,session}){
  // Prefill from the employer's company profile so they don't have to
  // re-type what's already on file — still editable per job (e.g. a role
  // based in a different office than HQ, or a different point of contact).
  const defaultContact=company?.contactPerson?`${company.contactPerson} — ${session?.email||""}`:(session?.email||"");
  const defaultLocations=company?.location?[company.location]:[];
  const blankForm=()=>({title:"",company:company?.name||"",summary:"",description:"",requirements:"",benefits:"",salary:"",locations:defaultLocations,workingModel:[],contractType:"",industries:[],field:"",contact:defaultContact,deadline:"",recruitmentProcess:DEFAULT_RECRUITMENT_PROCESS.map(x=>({...x}))});
  const [form,setForm]=useState(blankForm);
  const [errors,setErrors]=useState({});
  const [done,setDone]=useState(null);
  const [benefitsSaved,setBenefitsSaved]=useState(false);
  const [applyBenefitsToAll,setApplyBenefitsToAll]=useState(false);
  const [posting,setPosting]=useState(false);
  const s=(k,v)=>setForm(f=>({...f,[k]:v}));
  const ti=(i)=>setForm(f=>({...f,industries:f.industries.includes(i)?f.industries.filter(x=>x!==i):[...f.industries,i]}));

  useEffect(()=>{
    // Prefer the employer's synced benefits template (works from any device/browser);
    // fall back to the local cache for instant same-tab reuse.
    (async()=>{
      let b=company?.savedBenefits;
      if(!b) b=await ld(BENEFITS_KEY);
      if(b){setForm(f=>({...f,benefits:b}));setBenefitsSaved(true);}
    })();
  },[]);

  const useSameBenefits=async()=>{
    let saved=company?.savedBenefits;
    if(!saved) saved=await ld(BENEFITS_KEY);
    if(saved){setForm(f=>({...f,benefits:saved}));setBenefitsSaved(true);}
  };

  const saveBenefits=async()=>{
    await sd(BENEFITS_KEY,form.benefits); // instant local cache
    setBenefitsSaved(true);
    if(session?.code&&company){
      await saveOne(SK.COMPANIES,{...company,savedBenefits:form.benefits},"code");
    }
  };

  const submit=async()=>{
    const e={};
    if(!form.title.trim())e.title="Required";
    if(!form.company.trim())e.company="Required";
    if(!form.summary.trim())e.summary="Required";
    if(!form.description.trim())e.description="Required";
    if(!form.requirements.trim())e.requirements="Required";

    if(form.locations.length===0)e.locations="Select at least one";
    if(!form.workingModel.length)e.workingModel="Select at least one";
    if(!form.contractType)e.contractType="Required";
    if(form.industries.length===0)e.industries="Select at least one";
    if(!form.contact.trim())e.contact="Required";
    if(Object.keys(e).length){setErrors(e);return;}
    setPosting(true);
    const code=gjid();
    const job={...form,code,companyCode:session?.code||null,companyEmail:session?.email||null,createdAt:new Date().toISOString(),status:"active",recruitmentProcess:form.recruitmentProcess?.length?form.recruitmentProcess:DEFAULT_RECRUITMENT_PROCESS.map(x=>({...x}))};

    if(applyBenefitsToAll && form.benefits.trim()){
      // Genuinely touches many rows at once, so this one still needs the
      // read-everything-then-rewrite-everything path — upsert only helps
      // when a single row is changing.
      await sd(BENEFITS_KEY,form.benefits);
      const ex=await ldForWrite(SK.JOBS);
      if(ex===null)return;
      const jobsToSave=ex.map(existing=>existing.companyCode===session?.code?{...existing,benefits:form.benefits}:existing);
      await sd(SK.JOBS,[...jobsToSave,job],true);
    }else{
      await saveOne(SK.JOBS,job,"code");
    }
    // Push notification
    await saveOne(SK.NOTIFS,{id:gid(),type:"job_posted",to:session?.email||"employer",message:`Job posted: ${form.title} at ${form.company}`,jobCode:code,company:form.company,title:form.title,createdAt:new Date().toISOString(),read:false},"id");
    setPosting(false);
    setDone(code);onSuccess();
  };

  if(done)return(
    <div style={{maxWidth:520,margin:"4rem auto",textAlign:"center",padding:"0 1rem",fontFamily:FONT}}>
      <div style={{width:72,height:72,borderRadius:"50%",background:BRAND_LIGHT,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 1.5rem"}}><Icon name="check" size={34} style={{color:BRAND}}/></div>
      <h2 style={{fontWeight:800,fontSize:24,margin:"0 0 0.5rem",color:BRAND}}>Job posted!</h2>
      <p style={{color:"var(--color-text-secondary)",marginBottom:"2rem",lineHeight:1.6,fontSize:14}}>Your listing is now live on pairup.</p>
      <div style={{background:BRAND_LIGHT,borderRadius:16,padding:"1.5rem 2rem",marginBottom:"1.5rem",border:`1.5px solid ${BRAND}22`}}>
        <p style={{fontSize:11,color:BRAND,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:1.5}}>Job ID</p>
        <p style={{fontFamily:"monospace",fontSize:36,fontWeight:800,color:BRAND,margin:0,letterSpacing:4}}>{done}</p>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"center"}}>
        <Btn variant="outline" onClick={()=>{setDone(null);setForm(blankForm());setErrors({});}}>Post another job</Btn>
        <Btn onClick={onBack}>Back to dashboard</Btn>
      </div>
    </div>
  );

  return(
    <div style={{maxWidth:700,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontSize:13,fontWeight:600,fontFamily:FONT,marginBottom:"1.5rem",display:"flex",alignItems:"center",gap:6}}><Icon name="arrow-left" size={14}/>Back to dashboard</button>
      <div style={{marginBottom:"2rem"}}>
        <h1 style={{fontSize:26,fontWeight:800,margin:"0 0 6px",color:BRAND}}>Post a job</h1>
        <p style={{color:"var(--color-text-secondary)",fontSize:13,margin:0}}>All fields are required</p>
      </div>

      <Card>
        <SH icon="briefcase" title="Role Details"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Job title" error={errors.title} required><input style={inp} value={form.title} onChange={e=>s("title",e.target.value)} placeholder="e.g. Senior Frontend Developer"/></F>
          <F label="Company name" error={errors.company} required hint="Locked to your registered company"><input style={{...inp,background:"var(--color-background-secondary)",cursor:"not-allowed"}} value={form.company} disabled/></F>
          <F label="Offered salary" error={errors.salary}><input style={inp} value={form.salary} onChange={e=>s("salary",e.target.value)} placeholder="e.g. 25–35M VND/month"/></F>
          <F label="Field"><select style={inp} value={form.field} onChange={e=>s("field",e.target.value)}><option value="">-- Select --</option>{FIELDS.map(f=><option key={f}>{f}</option>)}</select></F>
          <F label="Contact & email" error={errors.contact} required><input style={inp} value={form.contact} onChange={e=>s("contact",e.target.value)} placeholder="HR Manager — hr@company.com"/></F>
          <F label="Application deadline"><input style={inp} type="date" value={form.deadline} onChange={e=>s("deadline",e.target.value)}/></F>
        </div>
        <F label="Location(s)" error={errors.locations} required>
          <MultiLocationPicker selected={form.locations} onChange={v=>s("locations",v)} error={errors.locations}/>
        </F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Working model (select all that apply)" error={errors.workingModel} required>
            <PillSel options={WORKING_MODELS} selected={form.workingModel} onToggle={v=>s("workingModel",form.workingModel.includes(v)?form.workingModel.filter(x=>x!==v):[...form.workingModel,v])} error={errors.workingModel}/>
          </F>
          <F label="Type of contract" error={errors.contractType} required>
            <SingleSelectPills options={CONTRACT_TYPES} value={form.contractType} onChange={v=>s("contractType",v)} error={errors.contractType}/>
          </F>
        </div>
        <F label="Industry (select all that apply)" error={errors.industries} required>
          <IndustryPicker selected={form.industries} onToggle={ti} error={errors.industries}/>
        </F>
      </Card>

      <Card>
        <SH icon="file-description" title="Job Description"/>
        <F label="Job Summary" error={errors.summary} required hint="A 2–3 sentence overview of the role and its purpose">
          <RichTextEditor value={form.summary} onChange={v=>s("summary",v)} minHeight={70}/>
        </F>
        <F label="Description" error={errors.description} required hint="Detailed day-to-day responsibilities and team context">
          <RichTextEditor value={form.description} onChange={v=>s("description",v)} minHeight={110}/>
        </F>
        <F label="Requirements" error={errors.requirements} required hint="Must-have skills, experience, and qualifications">
          <RichTextEditor value={form.requirements} onChange={v=>s("requirements",v)} minHeight={90}/>
        </F>
        <F label="Benefits" error={errors.benefits} hint="Optional. You can save this and reuse it for future jobs.">
          <div style={{marginBottom:8,display:"flex",gap:8,alignItems:"center"}}>
            {benefitsSaved&&(
              <button type="button" onClick={useSameBenefits} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",borderRadius:8,border:`1.5px solid ${BRAND}`,background:BRAND_LIGHT,color:BRAND,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:FONT,whiteSpace:"nowrap"}}>
                <Icon name="copy" size={12}/>Use same as before
              </button>
            )}
            {form.benefits.trim()&&(
              <button type="button" onClick={saveBenefits} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",borderRadius:8,border:"0.5px solid var(--color-border-secondary)",background:"none",color:"var(--color-text-secondary)",cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:FONT,whiteSpace:"nowrap"}}>
                <Icon name="device-floppy" size={12}/>Save for future use
              </button>
            )}
          </div>
          <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--color-text-primary)",cursor:"pointer",marginBottom:8}}>
            <input type="checkbox" checked={applyBenefitsToAll} onChange={e=>setApplyBenefitsToAll(e.target.checked)} style={{width:16,height:16,accentColor:BRAND}}/>
            <span><strong>Apply these benefits to all other jobs</strong> (existing and future jobs)</span>
          </label>
          <RichTextEditor value={form.benefits} onChange={v=>{s("benefits",v);setBenefitsSaved(false);}} minHeight={80}/>
        </F>
      </Card>

      <Card><SH icon="git-merge" title="Recruitment Process"/><p style={{fontSize:13,color:"var(--color-text-secondary)",marginTop:0}}>Customize the process for this role. You can edit it later from the job detail page.</p>{form.recruitmentProcess.map((r,i)=><div key={r.name} style={{display:"grid",gridTemplateColumns:"160px 1fr",gap:10,alignItems:"start",padding:"10px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}}><div style={{fontWeight:800,color:BRAND,paddingTop:8}}>{r.name}</div><textarea style={{...inp,minHeight:55}} value={r.description||""} onChange={e=>setForm(f=>({...f,recruitmentProcess:f.recruitmentProcess.map((x,idx)=>idx===i?{...x,description:e.target.value}:x)}))}/></div>)}</Card>

      <Btn onClick={submit} disabled={posting} data-loading-immediate="true" style={{width:"100%",justifyContent:"center",fontSize:15,padding:"14px",opacity:posting?0.7:1}}>{posting?"Posting...":"Post job →"}</Btn>
    </div>
  );
}

// ── JOBS ───────────────────────────────────────────────────────────────────────
function JobsPage({onApply,session,initialJobs=[],initialCompanies=[],initialApplications=[],initialSelectedCode="",onNeedSignIn}){
  const [jobs,setJobs]=useState(()=>initialJobs.filter(j=>j.status==="active"));
  const [companies,setCompanies]=useState(initialCompanies);
  const [filter,setFilter]=useState({location:"",industry:"",years:"",field:"",workingModel:"",contractType:""});
  const [search,setSearch]=useState("");
  const [selected,setSelected]=useState(null);
  const [form,setForm]=useState({name:"",email:"",phone:"",cvLink:"",portfolio:"",salary:"",onboard:"",consent:false});
  const [errors,setErrors]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const [alreadyApplied,setAlreadyApplied]=useState(false);
  const [isApplying,setIsApplying]=useState(false);
  const [appliedCodes,setAppliedCodes]=useState(()=>new Set(initialApplications.filter(a=>a.candidateCode===session?.code||(a.email&&session?.email&&a.email.toLowerCase()===session.email.toLowerCase())).map(a=>a.jobCode)));
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const triedAutoOpen=useRef(false);
  const [needsListFallbackOpen,setNeedsListFallbackOpen]=useState(false);
  const [listLoadedOnce,setListLoadedOnce]=useState(false);
  const [deepLinkLoading,setDeepLinkLoading]=useState(!!initialSelectedCode);
  const deepLinkLoadingRef=useRef(!!initialSelectedCode);
  const finishDeepLinkLoading=()=>{deepLinkLoadingRef.current=false;setDeepLinkLoading(false);};

  // Deep link support: "#/jobs/<code>" opens that job directly. Uses the
  // lightweight get_row lookup (one record, not the whole table) so a shared
  // job link opens fast regardless of how many jobs are posted — this used
  // to wait for the ENTIRE jobs list to finish loading first, which was the
  // main reason opening a shared link felt slow. Falls back to waiting on
  // the full list only if an older Apps Script deployment doesn't recognize
  // "get_row" yet. Deliberately does NOT run alongside the full-list fetch
  // below — Apps Script serializes/limits simultaneous requests from the same
  // client, so firing both at once made each one slower than running alone.
  useEffect(()=>{
    if(!initialSelectedCode)return;
    (async()=>{
      const composite=await postCompositeAction("get_row",{sheet:"Jobs",key:"code",value:initialSelectedCode});
      if(composite.supported){
        triedAutoOpen.current=true;
        // Only open if the job is still active — a deactivated job shouldn't
        // keep being reachable via an old shared link.
        if(composite.success&&composite.row&&composite.row.status==="active")openJob(composite.row);
        finishDeepLinkLoading();
        return;
      }
      // Older backend without get_row: release the gate so the full-list
      // fetch below can run (it's the only way left to find this job).
      deepLinkLoadingRef.current=false;
      setNeedsListFallbackOpen(true);
    })();
  },[]);
  useEffect(()=>{
    if(triedAutoOpen.current||!needsListFallbackOpen||!listLoadedOnce)return;
    const match=jobs.find(j=>j.code===initialSelectedCode);
    if(match){triedAutoOpen.current=true;openJob(match);}
    finishDeepLinkLoading();
  },[jobs,needsListFallbackOpen,listLoadedOnce]);

  // Browser Back/Forward while a job is open: close/switch to match the URL.
  useEffect(()=>{
    const onPop=()=>{
      const route=parseRoute();
      if(route.page!=="jobs")return;
      if(!route.sub){setSelected(null);return;}
      const match=jobs.find(j=>j.code===route.sub);
      if(match)setSelected(match);
    };
    window.addEventListener("popstate",onPop);
    return ()=>window.removeEventListener("popstate",onPop);
  },[jobs]);

  const load=async()=>{
    const {d,co}=await ldMany({d:SK.JOBS,co:SK.COMPANIES});
    setJobs((d||[]).filter(j=>j.status==="active"));
    setCompanies(co||[]);
    setListLoadedOnce(true);
  };
  useEffect(()=>{
    (async()=>{
      // If a specific job was requested via URL, let that lightweight lookup
      // (above) finish first instead of racing it with this full-list fetch.
      if(initialSelectedCode){
        while(deepLinkLoadingRef.current)await new Promise(r=>setTimeout(r,60));
      }
      if(session?.role==="jobseeker"){
        // One batched round-trip for Jobs+Companies+Applied instead of two
        // separate sequential fetches — cuts time-to-interactive on this tab.
        const [{d,co,apps},profile]=await Promise.all([
          ldMany({d:SK.JOBS,co:SK.COMPANIES,apps:SK.APPLICATIONS}),
          ld("pairup_my_profile_"+session.email)
        ]);
        setJobs((d||[]).filter(j=>j.status==="active"));
        setCompanies(co||[]);
        setAppliedCodes(new Set((apps||[]).filter(a=>a.candidateCode===session.code||(profile?.email&&a.email===profile.email)).map(a=>a.jobCode)));
        setListLoadedOnce(true);
      }else{
        await load();
      }
    })();
    const iv=setInterval(load,10000); // keep the list fresh as employers post/reactivate jobs
    return ()=>clearInterval(iv);
  },[]);

  const filtered=jobs.filter(j=>{
    const q=search.trim().toLowerCase();
    return (!filter.location||(filter.location==="Others"?(j.locations||[]).some(l=>!LOCATIONS.includes(l)):(j.locations||[]).includes(filter.location)))&&
    (!filter.industry||(j.industries||[]).includes(filter.industry))&&
    (!filter.years||j.years===filter.years)&&
    (!filter.field||j.field===filter.field)&&
    (!filter.workingModel||asArr(j.workingModel).includes(filter.workingModel))&&
    (!filter.contractType||j.contractType===filter.contractType)&&
    (!q||[j.code,j.title,j.company,j.field,(j.industries||[]).join(" "),(j.locations||[]).join(" "),j.summary,j.requirements].filter(Boolean).join(" ").toLowerCase().includes(q));
  });

  const openJob=async(j)=>{
    setSelected(j);setSubmitted(false);setErrors({});
    pushRoute("jobs",j.code);
    if(!session||session.role!=="jobseeker")return;
    // "Already applied?" is answered from the appliedCodes state (kept in
    // sync on mount and right after a successful apply) instead of fetching
    // the entire, ever-growing Applied table over the network on every single
    // job click — that round-trip was what made opening the apply form feel
    // slow.
    const profile=await ld("pairup_my_profile_"+session.email);
    setAlreadyApplied(appliedCodes.has(j.code));
    setForm({
      name:profile?.name||"",email:profile?.email||session.email,phone:profile?.phone||"",
      cvLink:profile?.cvLink||"",portfolio:profile?.portfolio||"",salary:profile?.salary||"",
      onboard:profile?.onboard||"",consent:false
    });
  };
  const closeJob=()=>{setSelected(null);replaceRoute("jobs","");};

  const apply=async()=>{
    if(!session){onNeedSignIn&&onNeedSignIn();return;}
    if(alreadyApplied||isApplying)return;
    const e={};
    if(!form.name.trim())e.name="Required";
    if(!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/))e.email="Invalid email";
    if(!form.phone.trim())e.phone="Required";
    if(!form.cvLink.trim())e.cvLink="Required";
    if(!form.salary.trim())e.salary="Required";
    if(!form.onboard)e.onboard="Required";
    if(!form.consent)e.consent="You must agree before applying";
    if(Object.keys(e).length){setErrors(e);return;}

    setIsApplying(true);
    setErrors({});
    const profile=await ld("pairup_my_profile_"+session.email);
    const createdAt=new Date().toISOString();
    const application={id:gid(),jobCode:selected.code,jobTitle:selected.title,company:selected.company,companyEmail:selected.companyEmail||null,candidateCode:session.code,profileSnapshot:profile||null,...form,createdAt,status:"applied",profileEvents:[]};
    const notification={id:gid(),type:"application",to:selected.companyEmail||"employer",message:`New application for ${selected.title} at ${selected.company}`,title:selected.title,company:selected.company,applicationId:application.id,candidateCode:application.candidateCode,createdAt,read:false};
    try{
      const result=await submitApplication(application,notification,appliedCodes.has(selected.code));
      if(!result.success){
        setErrors({submit:"Could not submit your application. Please check your connection and try again."});
        return;
      }
      setAlreadyApplied(true);
      setAppliedCodes(prev=>new Set([...prev,selected.code]));
      if(!result.duplicate){setSubmitted(true);onApply();}
    }catch(error){
      console.error("Application submission failed",error);
      setErrors({submit:"Could not submit your application. Please check your connection and try again."});
    }finally{
      setIsApplying(false);
    }
  };

  return(
    <div style={{maxWidth:1200,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      {deepLinkLoading&&(
        <div style={{position:"fixed",inset:0,background:"rgba(255,255,255,0.85)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,zIndex:400}}>
          <Icon name="loader-2" size={28} style={{color:BRAND,animation:"spin 1s linear infinite"}}/>
          <p style={{fontSize:13,color:BRAND,fontWeight:600,margin:0}}>Loading this job...</p>
        </div>
      )}
      <h1 style={{fontSize:26,fontWeight:800,marginBottom:4}}>Jobs</h1>
      <p style={{color:"var(--color-text-secondary)",fontSize:13,marginBottom:"1.5rem"}}>Browse all active jobs posted on pairup.</p>
      <div style={{position:"relative",marginBottom:"1rem"}}>
        <Icon name="search" size={16} style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"var(--color-text-secondary)"}}/>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by job title, company, field, industry, location..." style={{...inp,padding:"10px 14px 10px 38px"}}/>
      </div>
      <Card style={{marginBottom:"1.5rem"}}>
        <SH icon="filter" title="Filters"/>
        <FilterPills title="Location" options={[...LOCATIONS,"Others"]} value={filter.location} onChange={v=>setFilter(f=>({...f,location:v}))} inline={4}/>
        <FilterPills title="Working Model" options={WORKING_MODELS} value={filter.workingModel} onChange={v=>setFilter(f=>({...f,workingModel:v}))} inline={3}/>
        <FilterPills title="Type of Contract" options={CONTRACT_TYPES} value={filter.contractType} onChange={v=>setFilter(f=>({...f,contractType:v}))} inline={3}/>
        <FilterPills title="Field" options={FIELDS} value={filter.field} onChange={v=>setFilter(f=>({...f,field:v}))} inline={6}/>
        <FilterPills title="Industry" options={INDUSTRIES} value={filter.industry} onChange={v=>setFilter(f=>({...f,industry:v}))} inline={5}/>
        <FilterPills title="Experience" options={YEARS_OPTS} value={filter.years} onChange={v=>setFilter(f=>({...f,years:v}))} inline={6}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4,paddingTop:8,borderTop:"0.5px solid var(--color-border-tertiary)"}}>
          <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}><strong>{filtered.length}</strong> job{filtered.length!==1?"s":""} found</p>
          <button onClick={()=>setFilter({location:"",industry:"",years:"",field:"",workingModel:"",contractType:""})} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:BRAND,fontFamily:FONT,fontWeight:600}}>Clear all filters</button>
        </div>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filtered.map(j=>(
          <div key={j.code} onClick={()=>openJob(j)} role="button" tabIndex={0} onKeyDown={e=>{if(e.key==="Enter")openJob(j);}} style={{textAlign:"left",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:14,padding:"1.25rem",cursor:"pointer",fontFamily:FONT}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:16,alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:5}}><Badge color="blue">{j.field||"Job"}</Badge><span style={{fontFamily:"monospace",fontSize:11,color:BRAND_DIM}}>{j.code}</span></div>
                <h2 style={{fontSize:18,fontWeight:800,color:BRAND,margin:"0 0 5px"}}>{j.title}</h2>
                <p style={{fontSize:13,fontWeight:600,margin:"0 0 8px"}}>{j.company}</p>
                <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}>{(j.locations||[]).join(" · ")}{asArr(j.workingModel).length?` · ${asArr(j.workingModel).join(", ")}`:""}{j.contractType?` · ${j.contractType}`:""} · {(j.industries||[]).join(", ")}{j.salary?` · ${j.salary}`:""}</p>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
                {appliedCodes.has(j.code)&&<Badge color="green">Applied</Badge>}
                <button onClick={e=>{e.stopPropagation();openJob(j);}} style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",color:BRAND,fontSize:12,fontWeight:700,fontFamily:FONT,padding:"8px 14px",borderRadius:8,whiteSpace:"nowrap"}}>View JD</button>
                <Icon name="chevron-right" size={18} style={{color:BRAND_DIM}}/>
              </div>
            </div>
          </div>
        ))}
        {filtered.length===0&&<div style={{textAlign:"center",padding:"3rem",color:"var(--color-text-secondary)",background:"var(--color-background-primary)",borderRadius:16}}>No jobs match your filters.</div>}
      </div>

      {selected&&<div style={{position:"fixed",inset:0,background:"rgba(0,30,80,0.45)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:300,padding:"2rem 1rem",overflowY:"auto"}}>
        <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:1000,padding:"2rem",fontFamily:FONT}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"1.5rem"}}>
            <div><Badge color="blue">{selected.field||"Job"}</Badge><h2 style={{fontSize:24,fontWeight:800,color:BRAND,margin:"8px 0 4px"}}>{selected.title}</h2><p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>{selected.company} · {(selected.locations||[]).join(", ")}{asArr(selected.workingModel).length?` · ${asArr(selected.workingModel).join(", ")}`:""}{selected.contractType?` · ${selected.contractType}`:""}</p></div>
            <button onClick={closeJob} style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",fontSize:16,color:BRAND,width:32,height:32,borderRadius:"50%"}}>✕</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 280px",gap:"1.5rem",alignItems:"start"}}>
            <div>
              <Card><h3 style={{fontSize:12,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"0 0 10px"}}>Job Description</h3><p style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",margin:"0 0 1rem"}} dangerouslySetInnerHTML={{__html:selected.summary||""}}/><div style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",margin:"0 0 1rem"}} dangerouslySetInnerHTML={{__html:selected.description||""}}/><h4 style={{fontSize:12,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"1rem 0 8px"}}>Requirements</h4><div style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",margin:"0 0 1rem"}} dangerouslySetInnerHTML={{__html:selected.requirements||""}}/>{selected.benefits&&<><h4 style={{fontSize:12,fontWeight:800,color:BRAND,textTransform:"uppercase",letterSpacing:1,margin:"1rem 0 8px"}}>Benefits</h4><div style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",margin:0}} dangerouslySetInnerHTML={{__html:selected.benefits||""}}/></>}</Card>
              {!session?(
                <div style={{textAlign:"center",background:BRAND_LIGHT,borderRadius:14,padding:"1.5rem"}}>
                  <Icon name="lock" size={28} style={{color:BRAND}}/>
                  <p style={{fontSize:13,color:BRAND,margin:"10px 0 14px",fontWeight:600}}>Sign in to apply for this job.</p>
                  <Btn onClick={onNeedSignIn} style={{margin:"0 auto"}}>Sign in →</Btn>
                </div>
              ):session.role!=="jobseeker"?(
                <div style={{textAlign:"center",background:"var(--color-background-secondary)",borderRadius:14,padding:"1.5rem"}}>
                  <Icon name="eye" size={28} style={{color:BRAND_DIM}}/>
                  <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:"10px 0 0"}}>You're viewing this listing as an employer — applying is only available for job seeker accounts.</p>
                </div>
              ):alreadyApplied||submitted?<div style={{textAlign:"center",background:BRAND_LIGHT,borderRadius:14,padding:"2rem"}}><Icon name="check-circle" size={36} style={{color:BRAND}}/><h3 style={{color:BRAND,margin:"8px 0"}}>{submitted?"Application submitted!":"Applied"}</h3><p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>{submitted?`You've successfully applied for ${selected.title}. You can track its status under "Applied Jobs".`:"You have already applied for this position."}</p></div>:(<>
                <Card><SH icon="user-circle" title="Apply for this position"/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}><F label="Full name" error={errors.name} required><input style={inp} value={form.name} onChange={e=>sf("name",e.target.value)}/></F><F label="Email" error={errors.email} required><input style={inp} type="email" value={form.email} onChange={e=>sf("email",e.target.value)}/></F><F label="Phone number" error={errors.phone} required><input style={inp} value={form.phone} onChange={e=>sf("phone",e.target.value)}/></F><F label="CV link" error={errors.cvLink} required><input style={inp} type="url" value={form.cvLink} onChange={e=>sf("cvLink",e.target.value)} placeholder="https://..."/></F><F label="Portfolio link"><input style={inp} type="url" value={form.portfolio} onChange={e=>sf("portfolio",e.target.value)} placeholder="https://..."/></F><F label="Salary expected" error={errors.salary} required><input style={inp} value={form.salary} onChange={e=>sf("salary",e.target.value)} placeholder="e.g. 35M VND/month"/></F><F label="Available to start" error={errors.onboard} required><select style={inp} value={form.onboard} onChange={e=>sf("onboard",e.target.value)}><option value="">-- Select --</option>{ONBOARD_OPTS.map(o=><option key={o}>{o}</option>)}</select></F></div></Card>
                <label style={{display:"flex",alignItems:"flex-start",gap:10,padding:"1rem",background:"#F8F9FB",borderRadius:10,border:`1px solid ${form.consent?BRAND:"var(--color-border-tertiary)"}`,cursor:"pointer",marginBottom:"1rem"}}><input type="checkbox" checked={form.consent} onChange={e=>sf("consent",e.target.checked)} style={{marginTop:3,accentColor:BRAND,width:16,height:16,flexShrink:0}}/><span style={{fontSize:12,color:"var(--color-text-primary)",lineHeight:1.6}}>I agree that my personal information and application details may be stored and processed for this job application. This consent is required to apply.</span></label>{errors.consent&&<p style={{fontSize:11,color:"#E24B4A",margin:"-6px 0 10px"}}>{errors.consent}</p>}
                {errors.submit&&<p style={{fontSize:12,color:"#E24B4A",margin:"0 0 10px"}}>{errors.submit}</p>}
                <Btn onClick={apply} disabled={isApplying} style={{width:"100%",justifyContent:"center",fontSize:14,padding:"13px",opacity:isApplying?0.65:1,cursor:isApplying?"not-allowed":"pointer"}}>{isApplying?"Applying…":"Apply →"}</Btn>
              </>)}
            </div>
            <div>
              {(()=>{const jc=companies.find(c=>c.code===selected.companyCode);return(
                <Card style={{position:"sticky",top:16}}>
                  <SH icon="building" title="About the company"/>
                  <h4 style={{fontSize:15,fontWeight:800,color:BRAND,margin:"0 0 6px"}}>{selected.company}</h4>
                  {jc?(<>
                    <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:"0 0 10px"}}>{jc.industry}{jc.teamSize?` · ${jc.teamSize} employees`:""}</p>
                    {jc.address&&<p style={{fontSize:12,margin:"0 0 8px",display:"flex",gap:6}}><Icon name="map-pin" size={13} style={{color:BRAND_DIM,flexShrink:0,marginTop:2}}/>{jc.address}</p>}
                    {jc.website&&<p style={{fontSize:12,margin:"0 0 10px",display:"flex",gap:6}}><Icon name="world" size={13} style={{color:BRAND_DIM,flexShrink:0,marginTop:2}}/><a href={normalizeUrl(jc.website)} target="_blank" rel="noreferrer" style={{color:BRAND}}>{jc.website}</a></p>}
                    {jc.intro&&<p style={{fontSize:13,lineHeight:1.7,margin:0,paddingTop:8,borderTop:"0.5px solid var(--color-border-tertiary)"}}>{jc.intro}</p>}
                  </>):(
                    <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0,fontStyle:"italic"}}>No additional company information provided.</p>
                  )}
                </Card>
              );})()}
            </div>
          </div>
        </div>
      </div>}
    </div>
  );
}

// ── EMPLOYER ──────────────────────────────────────────────────────────────────
function EmployerPage({onPost,refresh,session,company,onCompanyUpdated,initialTab}){
  const [postingJob,setPostingJob]=useState(false);
  const [jobsAll,setJobsAll]=useState([]);
  const [requestsAll,setRequestsAll]=useState([]);
  const [applications,setApplications]=useState([]);
  const [candidates,setCandidates]=useState([]);
  const [tab,setTab]=useState(initialTab||"employer");
  const [selectedJob,setSelectedJob]=useState(null);
  const [viewingC,setViewingC]=useState(null);
  const [jobView,setJobView]=useState("pipeline");
  const [selectedRound,setSelectedRound]=useState("Applied");
  const [selectedApp,setSelectedApp]=useState(null);
  const [viewingRequest,setViewingRequest]=useState(null);
  useEffect(()=>{ replaceRoute("employer",EMPLOYER_SUBTABS[tab]||""); },[tab]);

  const load=async()=>{
    const{jobsD,reqD,appsD,candD}=await ldMany({jobsD:SK.JOBS,reqD:SK.REQUESTS,appsD:SK.APPLICATIONS,candD:SK.CANDIDATES});
    setJobsAll(jobsD||[]);
    setRequestsAll(reqD||[]);
    setApplications(appsD||[]);
    setCandidates(candD||[]);
  };
  useEffect(()=>{load();},[refresh]);

  // Scope this employer's own company data
  const jobs=jobsAll.filter(j=>j.companyCode===session.code);
  const requests=requestsAll.filter(r=>r.companyCode===session.code);

  // ── Contact requests: candidate CV/portfolio & full contact info is revealed to
  // the employer only ONCE, the first time an accepted request is opened. After
  // that — even after navigating away and back, or reloading — it stays masked.
  const openRequest=async(r)=>{
    if(r.status==="accepted"&&!r.viewedByEmployer){
      const viewedAt=new Date().toISOString();
      const updated={...r,viewedByEmployer:true,viewedAt};
      await saveOne(SK.REQUESTS,updated,"id");
      setRequestsAll(all=>all.map(x=>x.id===r.id?updated:x));
      setViewingRequest({...updated,__firstView:true});
    }else{
      setViewingRequest(r);
    }
  };

  const appsForJob=code=>applications.filter(a=>a.jobCode===code);
  const currentJob=selectedJob?jobs.find(j=>j.code===selectedJob.code)||selectedJob:null;

  const normalizeJob=j=>({
    ...j,
    recruitmentProcess:j.recruitmentProcess?.length?j.recruitmentProcess:DEFAULT_RECRUITMENT_PROCESS.map(x=>({...x}))
  });

  const saveJob=async(updated)=>{
    await saveOne(SK.JOBS,updated,"code");
    setJobsAll(all=>{
      const idx=all.findIndex(j=>j.code===updated.code);
      if(idx>=0){ const copy=[...all]; copy[idx]=updated; return copy; }
      return [...all,updated];
    });
    setSelectedJob(updated);onPost();
  };

  const toggleJobStatus=async(job)=>{
    const updated={...job,status:job.status==="active"?"inactive":"active"};
    await saveOne(SK.JOBS,updated,"code");
    setJobsAll(all=>all.map(j=>j.code===job.code?updated:j));
    if(selectedJob?.code===job.code)setSelectedJob(updated);
    onPost();
  };

  const openJob=job=>{
    const normalized=normalizeJob(job);
    setSelectedJob(normalized);
    setJobView("pipeline");
    setSelectedRound(normalized.recruitmentProcess?.[0]?.name||"Applied");
    setSelectedApp(null);
  };

  const updateApplication=async(app,patch)=>{
    const updated={...app,...patch,updatedAt:new Date().toISOString()};
    await saveOne(SK.APPLICATIONS,updated,"id");
    setApplications(all=>all.map(a=>a.id===app.id?updated:a));
    onPost();
  };

  const moveCandidate=async(app,round,status,reason,note)=>{
    const jobNow=normalizeJob(currentJob);
    const process=jobNow.recruitmentProcess||DEFAULT_RECRUITMENT_PROCESS;
    const currentIndex=process.findIndex(r=>r.name===round);
    let nextRound=round;
    if(status==="next") nextRound=process[currentIndex+1]?.name||round;
    if(status==="prev") nextRound=currentIndex>0?process[currentIndex-1].name:round;
    if(status==="Reject") nextRound="Rejected";
    if(status==="Pipeline") nextRound="Pipeline";
    const now=new Date().toISOString();
    const stageStatusLabel=status==="next"?"Passed":(status==="prev"?"Moved back":(status==="Pipeline"?"Move to Pipeline":status));
    const stageReason=(status==="next"||status==="prev"||status==="Pipeline")?"":(reason||"");
    const stageData={...(app.stageData||{}),[round]:{
      status:stageStatusLabel,
      reason:stageReason,
      note:note||"",
      updatedAt:now
    }};
    const applicationStatus=status==="Reject"?"rejected":(status==="Pass"?"passed":"processing");
    // Timeline: append-only log of every status change, so the employer can see
    // exactly when each move happened — not just the latest state per round.
    const statusHistory=[...(app.statusHistory||[]),{round,status:stageStatusLabel,reason:stageReason,note:note||"",updatedAt:now}];
    await updateApplication(app,{currentRound:nextRound,stageData,status:applicationStatus,lastStatusUpdate:now,statusHistory});
    setSelectedApp({...app,currentRound:nextRound,stageData,status:applicationStatus,lastStatusUpdate:now,statusHistory});

  // Lets the employer jot a note on a candidate without it counting as a status
  // change (no timeline entry, no round move) — just persists the note text.
  const saveNote=async(app,round,note)=>{

  if(selectedJob){

          </Card>
          <Card style={{minHeight:420}}>
            {!selectedApp?<div style={{height:360,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--color-text-secondary)",fontSize:13}}>Select a candidate to view application details.</div>:
              <div>
                <div style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"flex-start",marginBottom:"1rem"}}><div><h2 style={{fontSize:20,fontWeight:800,color:BRAND,margin:"0 0 4px"}}>{selectedCandidate?.name||"Candidate"}</h2><p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}>{selectedCandidate?.position||selectedApp.position||"Application"}</p></div><Badge color={selectedApp.status==="rejected"?"red":selectedApp.status==="passed"?"green":selectedApp.currentRound==="Pipeline"?"purple":"blue"}>{selectedRound}</Badge></div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px 24px",marginBottom:"1.25rem"}}>{[["Email",selectedCandidate?.email||selectedApp.email],["Phone",selectedCandidate?.phone||selectedApp.phone],["CV",selectedCandidate?.cvLink||selectedApp.cvLink],["Portfolio",selectedCandidate?.portfolio||selectedApp.portfolio],["Salary",selectedCandidate?.salary||selectedApp.salary],["Available",selectedCandidate?.onboard||selectedApp.onboard]].map(([l,v])=><div key={l}><p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",margin:"0 0 4px"}}>{l}</p><p style={{fontSize:13,margin:0,wordBreak:"break-word"}}>{v||"—"}</p></div>)}</div>

                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>}
          </Card>
        </div>
      </div>}

            {company.address&&<p style={{fontSize:12,margin:"0 0 4px",display:"flex",gap:6,alignItems:"flex-start"}}><Icon name="map-pin" size={13} style={{color:BRAND_DIM,flexShrink:0,marginTop:2}}/>{company.address}</p>}
            {company.website&&<p style={{fontSize:12,margin:"0 0 8px",display:"flex",gap:6,alignItems:"flex-start"}}><Icon name="world" size={13} style={{color:BRAND_DIM,flexShrink:0,marginTop:2}}/><a href={normalizeUrl(company.website)} target="_blank" rel="noreferrer" style={{color:BRAND}}>{company.website}</a></p>}

      </Card>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,margin:"1.25rem 0 1.5rem"}}>
        {[
          {label:"Active Jobs",value:jobs.filter(j=>j.status==="active").length,icon:"briefcase"},
          {label:"Talent Pool Requests",value:requests.length,icon:"users"},
          {label:"Contacts Obtained",value:requests.filter(r=>r.status==="accepted").length,icon:"mail-check"}
        ].map(stat=>(
          <Card key={stat.label} style={{marginBottom:0,display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:44,height:44,borderRadius:12,background:BRAND_LIGHT,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name={stat.icon} size={20} style={{color:BRAND}}/></div>
            <div><p style={{fontSize:24,fontWeight:800,color:BRAND,margin:"0 0 2px"}}>{stat.value}</p><p style={{fontSize:11,fontWeight:700,color:"var(--color-text-secondary)",textTransform:"uppercase",letterSpacing:.5,margin:0}}>{stat.label}</p></div>
          </Card>
        ))}
