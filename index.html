// ── MY PROFILE ────────────────────────────────────────────────────────────────
function CandidatePage({onSubmit,refresh,session,initialTab}){
  const LKEY="pairup_my_profile_"+session.email;
  const blank={name:"",email:session.email,phone:"",social:"",position:"",field:"",locations:[],workingModel:[],contractType:"",industries:[],skills:"",years:"",languages:[],intro:"",onboard:"",salary:"",portfolio:"",cvLink:"",activelyExploring:"",consentPool:false,consentStore:false};
  const [profile,setProfile]=useState(null); // null = not yet loaded
  const [ready,setReady]=useState(false);    // true once storage check done
  const [mode,setMode]=useState("view");     // "view" | "edit"
  const [tab,setTab]=useState(initialTab||"info");       // "info" | "requests" | "applied"
  const [form,setForm]=useState(blank);
  const [submitted,setSubmitted]=useState(null);
  const [errors,setErrors]=useState({});
  const [requests,setRequests]=useState([]);
  const [selReq,setSelReq]=useState(null);
  const [shareOn,setShareOn]=useState(false);
  const [appliedJobs,setAppliedJobs]=useState([]);
  const [profileEvents,setProfileEvents]=useState([]);
  const [saving,setSaving]=useState(false);
  const [justSaved,setJustSaved]=useState(false);
  useEffect(()=>{ replaceRoute("candidate",CANDIDATE_SUBTABS[tab]||""); },[tab]);
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));

  // Load profile from storage once. The per-browser LKEY cache is just a fast
  // local pointer — if it's empty (e.g. logging in from a new browser/device),
  // fall back to the synced candidates list so the real profile is recovered.
  useEffect(()=>{
    (async()=>{
      let p=await ld(LKEY);
      if(!p){
        const all=(await ld(SK.CANDIDATES,true))||[];
        const match=all.find(x=>x.code===session.code||(x.email&&x.email.toLowerCase()===session.email.toLowerCase()));
        if(match){ p=match; await sd(LKEY,match); }
      }
      if(p){setProfile(p);setShareOn(p.shareActive||false);}
      setReady(true);
    })();
  },[refresh]);

  // Load requests whenever profile changes. Uses the normal cache-aware,
  // batched ldMany (not two separate forced-fresh calls) — those two forced-
  // fresh fetches used to fire on every refresh() bump, including from
  // completely unrelated actions like toggling "Share profile", which made
  // that toggle feel slow even though it doesn't actually need this data.
  useEffect(()=>{
    if(profile?.code){
      ldMany({r:SK.REQUESTS,a:SK.APPLICATIONS}).then(({r,a})=>{
        setRequests((r||[]).filter(x=>x.candidateCode===profile.code));
        setAppliedJobs((a||[]).filter(x=>x.candidateCode===profile.code || (x.email&&x.email===profile.email)));
      });
      setProfileEvents(profile.profileEvents||[]);
    }
  },[profile,refresh]);

  // ── Helpers ──
  const persist=async(c)=>{
    await sd(LKEY,c);
    return await saveOne(SK.CANDIDATES,c,"code");
  };

  const validate=()=>{
    const e={};
    if(!form.name.trim())e.name="Required";
    if(!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/))e.email="Invalid email";
    if(!form.phone.trim())e.phone="Required";
    if(!form.cvLink.trim())e.cvLink="Required";
    if(!form.position.trim())e.position="Required";
    if(!form.field)e.field="Required";
    if(form.locations.length===0)e.locations="Select at least one";
    if(!form.workingModel.length)e.workingModel="Select at least one";
    if(!form.contractType)e.contractType="Required";
    if(form.industries.length===0)e.industries="Select at least one";
    if(!form.skills.trim())e.skills="Required";
    if(!form.years)e.years="Required";
    if(form.languages.length===0)e.languages="Add at least one language";
    if(!form.intro.trim())e.intro="Required";
    if(!form.onboard)e.onboard="Required";
    if(!form.salary)e.salary="Required";
    if(!form.consentStore)e.consentStore="You must agree to data storage";
    return e;
  };

  const openEdit=()=>{
    const s=profile||{};
    setForm({name:s.name||"",email:s.email||"",phone:s.phone||"",social:s.social||"",position:s.position||"",field:s.field||"",locations:s.locations||[],workingModel:Array.isArray(s.workingModel)?s.workingModel:(s.workingModel?[s.workingModel]:[]),contractType:s.contractType||"",industries:s.industries||[],skills:s.skills||"",years:s.years||"",languages:s.languages||[],intro:s.intro||"",onboard:s.onboard||"",salary:s.salary||"",portfolio:s.portfolio||"",cvLink:s.cvLink||"",activelyExploring:s.activelyExploring||"",consentPool:s.shareActive||false,consentStore:!!s.code});
    setErrors({});setMode("edit");
  };

  const doToggleShare=async(val)=>{
    if(!profile){openEdit();return;}
    const u={...profile,shareActive:val,consentPool:val};
    if(!(await persist(u)))return;
    setShareOn(val);setProfile(u);onSubmit();
  };

  const doSubmit=async()=>{
    const e=validate();if(Object.keys(e).length){setErrors(e);return;}
    setSaving(true);
    const code=session.code;
    const c={...form,code,createdAt:new Date().toISOString(),status:"active",shareActive:form.consentPool};
    const ok=await persist(c);
    setSaving(false);
    if(!ok)return;
    setProfile(c);setShareOn(form.consentPool);setSubmitted(code);onSubmit();
  };

  const doUpdate=async()=>{
    const e=validate();if(Object.keys(e).length){setErrors(e);return;}
    setSaving(true);
    const c={...profile,...form,updatedAt:new Date().toISOString(),shareActive:form.consentPool};
    const ok=await persist(c);
    setSaving(false);
    if(!ok)return;
    setProfile(c);setMode("view");onSubmit();
    // Make the "did this actually save?" moment unambiguous: flash a
    // confirmation banner on the profile view for a couple seconds right
    // after landing back on it, instead of silently switching modes with no
    // feedback (which is what made saves feel like they'd gone nowhere).
    setJustSaved(true);
    setTimeout(()=>setJustSaved(false),3000);
  };

  const doRespond=async(req,action)=>{
    const respondedAt=new Date().toISOString();
    const updatedRequest={...req,status:action,respondedAt};
    const requestSaved=await saveOne(SK.REQUESTS,updatedRequest,"id");
    const notificationSaved=await saveOne(SK.NOTIFS,{id:gid(),type:"response",to:req.employerEmail||"employer",candidateCode:profile.code,companyName:req.company,position:req.title,action,createdAt:respondedAt,read:false},"id");
    if(requestSaved&&notificationSaved&&req.employerEmail){
      const result=action==="accepted"?"Accepted":"Declined";
      await sendAutomationEmail(
        req.employerEmail,
        `Candidate ${profile.code} ${result.toLowerCase()} your contact request`,
        `Candidate code: ${profile.code}
Position: ${req.title||"—"}
Company: ${req.company||"—"}
Result: ${result}
Response timestamp: ${respondedAt}`
      );
    }
    setRequests(r=>r.map(x=>x.id===req.id?updatedRequest:x));
    setSelReq(null);onSubmit();
  };

  // Wait for storage to load before rendering
  if(!ready)return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,padding:"4rem",fontFamily:FONT}}>
      <Icon name="loader-2" size={24} style={{color:BRAND,animation:"spin 1s linear infinite"}}/>
      <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>PairUp is loading, please wait...</p>
    </div>
  );

  // ── SUCCESS screen ──
  if(submitted)return(
    <div style={{maxWidth:500,margin:"4rem auto",textAlign:"center",padding:"0 1.5rem",fontFamily:FONT}}>
      <div style={{width:72,height:72,borderRadius:"50%",background:BRAND_LIGHT,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 1.5rem"}}>
        <Icon name="check" size={34} style={{color:BRAND}}/>
      </div>
      <h2 style={{fontWeight:800,fontSize:24,margin:"0 0 0.5rem",color:BRAND}}>Profile saved!</h2>
      <p style={{color:"var(--color-text-secondary)",marginBottom:"2rem",lineHeight:1.6,fontSize:14}}>Your profile is ready. Employers will reach out when a suitable role arises.</p>
      <div style={{background:BRAND_LIGHT,borderRadius:16,padding:"1.5rem 2rem",marginBottom:"1.5rem",border:`1.5px solid ${BRAND}22`}}>
        <p style={{fontSize:10,color:BRAND,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:1.5}}>Your Candidate Code</p>
        <p style={{fontSize:42,fontWeight:800,letterSpacing:4,color:BRAND,margin:0,fontFamily:"monospace"}}>{submitted}</p>
      </div>
      <Btn variant="outline" onClick={()=>{setSubmitted(null);setMode("view");}} style={{marginTop:"0.5rem"}}>View my profile →</Btn>
    </div>
  );

  // ── REQUEST DETAIL ──
  if(selReq)return(
    <div style={{maxWidth:700,margin:"0 auto",fontFamily:FONT,paddingBottom:"4rem"}}>
      <div style={{background:BRAND,padding:"1rem 2rem",display:"flex",alignItems:"center",gap:12,position:"sticky",top:48,zIndex:90}}>
        <button onClick={()=>setSelReq(null)} style={{background:"rgba(255,255,255,0.15)",border:"none",cursor:"pointer",color:"#fff",width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <Icon name="arrow-left" size={15}/>
        </button>
        <div style={{flex:1}}>
          <p style={{color:"rgba(255,255,255,0.65)",fontSize:11,margin:0,fontFamily:FONT}}>Contact Request from</p>
          <p style={{color:"#fff",fontWeight:800,fontSize:16,margin:0,fontFamily:FONT}}>{selReq.company}</p>
        </div>
        <Badge color={selReq.status==="pending"?"amber":selReq.status==="accepted"?"green":"red"}>
          {selReq.status==="pending"?"Awaiting reply":selReq.status==="accepted"?"Accepted":"Declined"}
        </Badge>
      </div>
      <div style={{padding:"1.5rem 2rem"}}>
        <Card>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 28px"}}>
            {[["Company",selReq.company],["Position",selReq.title],["Offered Salary",selReq.salary||"—"],["Contact Person",selReq.contactName||"—"],["Contact Email",selReq.contactEmail||"—"],["Contact Phone",selReq.contactPhone||"—"]].map(([l,v])=>(
              <div key={l} style={{borderBottom:"0.5px solid var(--color-border-tertiary)",paddingBottom:10}}>
                <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 4px"}}>{l}</p>
                <p style={{fontSize:14,fontWeight:500,margin:0}}>{v}</p>
              </div>
            ))}
          </div>
        </Card>
        {selReq.jd&&<Card><p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>Job Description</p><p style={{fontSize:14,lineHeight:1.8,margin:0}}>{selReq.jd}</p></Card>}
        {selReq.benefits&&<Card><p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>Benefits</p><p style={{fontSize:14,lineHeight:1.8,margin:0}}>{selReq.benefits}</p></Card>}
        {selReq.status==="pending"?(
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <Btn onClick={()=>doRespond(selReq,"accepted")} style={{flex:1,justifyContent:"center",fontSize:14,padding:"13px"}}>
              <Icon name="check" size={15}/>Agree — share my contact
            </Btn>
            <Btn variant="danger" onClick={()=>doRespond(selReq,"denied")} style={{flex:1,justifyContent:"center",fontSize:14,padding:"13px"}}>
              <Icon name="x" size={15}/>Deny
            </Btn>
          </div>
        ):(
          <div style={{padding:"1.25rem",background:selReq.status==="accepted"?BRAND_LIGHT:"#FDEAEA",borderRadius:14,textAlign:"center",fontWeight:700,fontSize:15,color:selReq.status==="accepted"?BRAND:"#8B1A1A",border:`1.5px solid ${selReq.status==="accepted"?BRAND+"33":"#E24B4A33"}`}}>
            {selReq.status==="accepted"?"✓ You accepted — your contact info was shared":"✕ You declined this request"}
          </div>
        )}
      </div>
    </div>
  );

  // ── EDIT FORM ──
  if(mode==="edit")return(
    <div style={{maxWidth:700,margin:"2rem auto",padding:"0 1rem 5rem",fontFamily:FONT}}>
      <button onClick={()=>setMode("view")} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontSize:13,fontWeight:600,fontFamily:FONT,marginBottom:"1.5rem",display:"flex",alignItems:"center",gap:6}}>
        <Icon name="arrow-left" size={14}/>Back to profile
      </button>
      <div style={{marginBottom:"2rem"}}>
        <h1 style={{fontSize:24,fontWeight:800,margin:"0 0 4px"}}>{profile?"Update your profile":"Complete your profile"}</h1>
        <p style={{color:"var(--color-text-secondary)",fontSize:13,margin:0}}>All fields required unless marked optional</p>
      </div>

      {/* CV Link */}
      <Card>
        <SH icon="link" title="CV / Resume"/>
        <F label="CV link" error={errors.cvLink} required hint="Paste a shareable link to your CV (Google Drive, Dropbox, OneDrive, Notion, or another public link).">
          <input style={inp} type="url" value={form.cvLink} onChange={e=>sf("cvLink",e.target.value)} placeholder="https://drive.google.com/..."/>
        </F>
        <p style={{fontSize:11,color:"var(--color-text-secondary)",margin:"-0.5rem 0 0"}}>Your CV link is private and will only be shared with an employer after you accept their contact request.</p>
      </Card>

      {/* Personal */}
      <Card>
        <SH icon="user-circle" title="Personal Information"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Full name" error={errors.name} required><input style={inp} value={form.name} onChange={e=>sf("name",e.target.value)} placeholder="Jane Smith"/></F>
          <F label="Email" error={errors.email} required><input style={inp} type="email" value={form.email} onChange={e=>sf("email",e.target.value)} placeholder="jane@example.com"/></F>
          <F label="Phone" error={errors.phone} required><input style={inp} value={form.phone} onChange={e=>sf("phone",e.target.value)} placeholder="+84 9xx xxx xxx"/></F>
          <F label="Social links (Facebook, LinkedIn…)"><input style={inp} value={form.social} onChange={e=>sf("social",e.target.value)} placeholder="https://linkedin.com/in/…"/></F>
        </div>
      </Card>

      {/* Career */}
      <Card>
        <SH icon="briefcase" title="Career Preferences"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Desired position" error={errors.position} required><input style={inp} value={form.position} onChange={e=>sf("position",e.target.value)} placeholder="e.g. Senior Product Designer"/></F>
          <F label="Field" error={errors.field} required>
            <select style={inp} value={form.field} onChange={e=>sf("field",e.target.value)}>
              <option value="">-- Select field --</option>
              {FIELDS.map(f=><option key={f}>{f}</option>)}
            </select>
          </F>
        </div>
        <F label="Preferred location(s)" error={errors.locations} required>
          <MultiLocationPicker selected={form.locations} onChange={v=>sf("locations",v)} error={errors.locations}/>
        </F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Working model (select all that apply)" error={errors.workingModel} required>
            <PillSel options={WORKING_MODELS} selected={form.workingModel} onToggle={v=>sf("workingModel",form.workingModel.includes(v)?form.workingModel.filter(x=>x!==v):[...form.workingModel,v])} error={errors.workingModel}/>
          </F>
          <F label="Type of contract" error={errors.contractType} required>
            <SingleSelectPills options={CONTRACT_TYPES} value={form.contractType} onChange={v=>sf("contractType",v)} error={errors.contractType}/>
          </F>
        </div>
        <F label="Industry (select all that apply)" error={errors.industries} required>
          <IndustryPicker selected={form.industries} onToggle={i=>sf("industries",form.industries.includes(i)?form.industries.filter(x=>x!==i):[...form.industries,i])} error={errors.industries}/>
        </F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Years of experience" error={errors.years} required>
            <select style={inp} value={form.years} onChange={e=>sf("years",e.target.value)}>
              <option value="">-- Select --</option>
              {YEARS_OPTS.map(o=><option key={o}>{o}</option>)}
            </select>
          </F>
          <F label="Salary expectation" error={errors.salary} required>
            <input style={inp} value={form.salary} onChange={e=>sf("salary",e.target.value)} placeholder="e.g. 30–50M VND"/>
          </F>
        </div>
        <F label="Languages" error={errors.languages} required>
          <LanguagePicker languages={form.languages} onChange={v=>sf("languages",v)} error={errors.languages}/>
        </F>
        <F label="Key skills" error={errors.skills} required>
          <input style={inp} value={form.skills} onChange={e=>sf("skills",e.target.value)} placeholder="e.g. React, Node.js, Figma, SQL…"/>
        </F>
        <F label="Professional summary" error={errors.intro} required>
          <RichTextEditor value={form.intro} onChange={v=>sf("intro",v)}/>
        </F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Portfolio link"><input style={inp} value={form.portfolio} onChange={e=>sf("portfolio",e.target.value)} placeholder="https://your-portfolio.com"/></F>
          <F label="Available to start" error={errors.onboard} required>
            <select style={inp} value={form.onboard} onChange={e=>sf("onboard",e.target.value)}>
              <option value="">-- Select --</option>
              {ONBOARD_OPTS.map(o=><option key={o}>{o}</option>)}
            </select>
          </F>
        </div>
        <F label="Actively exploring new opportunities" hint="Let employers know if you're currently open and actively looking">
          <select style={inp} value={form.activelyExploring} onChange={e=>sf("activelyExploring",e.target.value)}>
            <option value="">-- Select --</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </F>
      </Card>

      {/* Consent */}
      <Card>
        <SH icon="shield-check" title="Privacy & Consent"/>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",padding:"1rem",background:BRAND_LIGHT,borderRadius:10,border:`1px solid ${form.consentPool?BRAND:BRAND_LIGHT}`}}>
            <input type="checkbox" checked={form.consentPool} onChange={e=>sf("consentPool",e.target.checked)} style={{marginTop:3,accentColor:BRAND,width:16,height:16,flexShrink:0}}/>
            <span style={{fontSize:13,color:BRAND_MID,lineHeight:1.6,fontFamily:FONT}}>
              <strong>I agree to the display of my work history within the Talent Pool.</strong> (Contact details, social channels and CV are strictly excluded from this view.)
            </span>
          </label>
          <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",padding:"1rem",background:"#F8F9FB",borderRadius:10,border:`1px solid ${form.consentStore?BRAND:"var(--color-border-tertiary)"}`}}>
            <input type="checkbox" checked={form.consentStore} onChange={e=>sf("consentStore",e.target.checked)} style={{marginTop:3,accentColor:BRAND,width:16,height:16,flexShrink:0}}/>
            <span style={{fontSize:13,color:"var(--color-text-primary)",lineHeight:1.6,fontFamily:FONT}}>
              <strong>By submitting this form, I allow pairup to securely store my personal information.</strong> Your data will <strong>NEVER BE SHARED</strong> without your explicit approval.
            </span>
          </label>
          {errors.consentStore&&<p style={{fontSize:11,color:"#E24B4A",margin:0}}>{errors.consentStore}</p>}
        </div>
      </Card>

      <Btn onClick={profile?doUpdate:doSubmit} disabled={saving} data-loading-immediate="true" style={{width:"100%",justifyContent:"center",fontSize:15,padding:"14px",opacity:saving?0.7:1,cursor:saving?"default":"pointer"}}>
        {saving?<><Icon name="loader-2" size={16} style={{animation:"spin 1s linear infinite"}}/>Saving...</>:(profile?"Save changes →":"Submit profile →")}
      </Btn>
    </div>
  );

  // ── PROFILE VIEW (ALWAYS shown by default, blank if no data) ──
  const p=profile||{};
  const pendingCount=requests.filter(r=>r.status==="pending").length;

  const InfoCell=({label,value,link})=>(
    <div style={{borderBottom:"0.5px solid var(--color-border-tertiary)",paddingBottom:12}}>
      <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 5px"}}>{label}</p>
      {link&&value
        ?<a href={normalizeUrl(value)} target="_blank" rel="noreferrer" style={{fontSize:14,color:BRAND,fontWeight:500,wordBreak:"break-all"}}>{value}</a>
        :<p style={{fontSize:14,fontWeight:value?500:400,margin:0,color:value?"var(--color-text-primary)":"#bbb",fontStyle:value?"normal":"italic"}}>{value||"—"}</p>
      }
    </div>
  );

  return(
    <div style={{maxWidth:800,margin:"0 auto",paddingBottom:"4rem",fontFamily:FONT}}>

      {justSaved&&(
        <div style={{margin:"1rem 1.5rem 0",background:"#E7F7EE",border:"1px solid #34A853",borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:600,color:"#1E7A3D"}}>
          <Icon name="circle-check" size={16}/> Your profile changes have been saved.
        </div>
      )}

      {/* ── HERO HEADER ── */}
      <div style={{background:BRAND,padding:"2rem 2rem 0"}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16,flexWrap:"wrap",marginBottom:"1.5rem"}}>
          {/* Avatar + name */}
          <div style={{display:"flex",gap:16,alignItems:"center",flex:1,minWidth:200}}>
            <div style={{width:64,height:64,borderRadius:"50%",background:"rgba(255,255,255,0.12)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:"2px solid rgba(255,255,255,0.2)"}}>
              <Icon name="user" size={28} style={{color:"rgba(255,255,255,0.9)"}}/>
            </div>
            <div>
              <h1 style={{color:p.name?"#fff":"rgba(255,255,255,0.35)",fontWeight:800,fontSize:20,margin:"0 0 3px",fontStyle:p.name?"normal":"italic"}}>
                {p.name||"Your name here"}
              </h1>
              <p style={{color:p.position?"rgba(255,255,255,0.75)":"rgba(255,255,255,0.3)",fontSize:13,margin:"0 0 6px",fontStyle:p.position?"normal":"italic"}}>
                {p.position||"Desired position"}
              </p>
              {p.code&&<span style={{fontFamily:"monospace",fontSize:11,background:"rgba(255,255,255,0.15)",color:"rgba(255,255,255,0.85)",padding:"2px 10px",borderRadius:6,fontWeight:700,letterSpacing:1}}>{p.code}</span>}
            </div>
          </div>
          {/* Action buttons */}
          <div style={{display:"flex",gap:8,flexWrap:"wrap",flexShrink:0}}>
            <button onClick={openEdit} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"9px 16px",borderRadius:8,border:"1.5px solid rgba(255,255,255,0.35)",background:"rgba(255,255,255,0.1)",color:"#fff",cursor:"pointer",fontFamily:FONT,fontWeight:700,fontSize:13}}>
              <Icon name="edit" size={13}/>{profile?"Update information":"Complete profile"}
            </button>
            <button onClick={()=>doToggleShare(!shareOn)} style={{display:"inline-flex",alignItems:"center",gap:8,padding:"9px 16px",borderRadius:8,border:`1.5px solid ${shareOn?"rgba(255,255,255,0.6)":"rgba(255,255,255,0.25)"}`,background:shareOn?"rgba(255,255,255,0.15)":"rgba(255,255,255,0.06)",color:"#fff",cursor:"pointer",fontFamily:FONT,fontWeight:700,fontSize:13}}>
              <span style={{width:30,height:17,borderRadius:99,background:shareOn?"#4ADE80":"rgba(255,255,255,0.25)",position:"relative",display:"inline-block",flexShrink:0}}>
                <span style={{position:"absolute",top:2,left:shareOn?13:2,width:13,height:13,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/>
              </span>
              {shareOn?"Sharing to Talent Pool":"Share profile"}
            </button>
          </div>
        </div>
        {/* Stats bar */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",background:"rgba(0,0,0,0.2)",borderRadius:"10px 10px 0 0",overflow:"hidden"}}>
          {[["Salary",p.salary,"currency"],["Experience",p.years,"clock"],["Location",(p.locations||[]).slice(0,1).join("") ,"map-pin"],["Available",p.onboard,"calendar"]].map(([l,v,ic])=>(
            <div key={l} style={{padding:"0.75rem 1rem",borderRight:"0.5px solid rgba(255,255,255,0.08)"}}>
              <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:3}}>
                <Icon name={ic} size={10} style={{color:"rgba(255,255,255,0.45)"}}/>
                <p style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.45)",textTransform:"uppercase",letterSpacing:0.7,margin:0}}>{l}</p>
              </div>
              <p style={{fontSize:12,fontWeight:700,color:v?"#fff":"rgba(255,255,255,0.25)",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontStyle:v?"normal":"italic"}}>{v||"—"}</p>
            </div>
          ))}
        </div>
      </div>

      {/* ── TABS ── */}
      <div style={{background:"var(--color-background-primary)",borderBottom:"0.5px solid var(--color-border-tertiary)",display:"flex",padding:"0 2rem",position:"sticky",top:48,zIndex:80}}>
        {[["info","My Information","file-description",0],["requests","Contact Requests","mail",pendingCount],["applied","Applied Jobs","briefcase",appliedJobs.length]].map(([id,label,icon,badge])=>(
          <button key={id} onClick={()=>setTab(id)} style={{background:"none",border:"none",cursor:"pointer",padding:"13px 0",marginRight:24,color:tab===id?BRAND:"var(--color-text-secondary)",fontWeight:tab===id?700:400,fontSize:13,borderBottom:tab===id?`2.5px solid ${BRAND}`:"2.5px solid transparent",fontFamily:FONT,display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap",transition:"color 0.15s"}}>
            <Icon name={icon} size={14}/>{label}
            {id==="applied"?(badge>0&&<span style={{color:"inherit",fontWeight:400,fontSize:13}}>({badge})</span>):(badge>0&&<span style={{background:"#FF6B6B",color:"#fff",fontSize:10,fontWeight:700,borderRadius:99,padding:"1px 6px",minWidth:16,textAlign:"center"}}>{badge}</span>)}
          </button>
        ))}
      </div>

      {/* ── TAB CONTENT ── */}
      <div style={{padding:"1.5rem 2rem"}}>

        {/* MY INFORMATION TAB */}
        {tab==="info"&&(
          <>
            {/* Overall Information */}
            <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16,padding:"1.5rem",marginBottom:"1.25rem"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.25rem",flexWrap:"wrap",gap:8}}>
                <h3 style={{fontSize:12,fontWeight:800,color:BRAND,margin:0,textTransform:"uppercase",letterSpacing:1,display:"flex",alignItems:"center",gap:6}}>
                  <Icon name="id-badge-2" size={14}/>Overall Information
                </h3>
                {!profile&&(
                  <span style={{fontSize:11,background:"#FEF3CD",color:"#7A4F00",padding:"3px 12px",borderRadius:99,fontWeight:700}}>Profile not yet completed</span>
                )}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 32px"}}>
                <InfoCell label="Full Name" value={p.name}/>
                <InfoCell label="Email" value={p.email}/>
                <InfoCell label="Phone" value={p.phone}/>
                <InfoCell label="Social Links" value={p.social}/>
                <InfoCell label="Desired Position" value={p.position}/>
                <InfoCell label="Expected Salary" value={p.salary}/>
                <InfoCell label="Portfolio" value={p.portfolio} link/>
                <InfoCell label="CV / Resume" value={p.cvLink} link/>
              </div>
              {!profile&&(
                <div style={{marginTop:"1.25rem",background:BRAND_LIGHT,borderRadius:10,padding:"0.875rem 1rem",display:"flex",alignItems:"center",gap:12}}>
                  <Icon name="info-circle" size={18} style={{color:BRAND,flexShrink:0}}/>
                  <p style={{fontSize:13,color:BRAND,margin:0,flex:1}}>Complete your profile so employers can find you.</p>
                  <button onClick={openEdit} style={{padding:"7px 16px",borderRadius:8,background:BRAND,color:"#fff",border:"none",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:FONT,whiteSpace:"nowrap"}}>Complete now →</button>
