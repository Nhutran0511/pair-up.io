const GSHEET_URL_KEY="pairup_gsheet_webapp_url";

// any Google profile, any device) automatically uses the same Google Sheet
// backend for sign up / log in / data sync, with no per-browser setup needed.

// Keys marked "shared" (3rd arg = true) are the platform's real data — candidate
// profiles, jobs, contact requests, applications, companies, notifications.
// These must be visible to EVERY visitor regardless of browser/device, so they
// are mirrored to named tabs in the same Google Sheet used for auth. Local
// storage is still written as an instant-response cache / offline fallback,
// but the Sheet (via Apps Script) is the source of truth whenever it's reachable.
const SHEET_MAP={
  [SK.CANDIDATES]:{sheet:"Job Seekers",key:"code"},
  [SK.JOBS]:{sheet:"Jobs",key:"code"},
  [SK.REQUESTS]:{sheet:"Requests",key:"id"},
  [SK.APPLICATIONS]:{sheet:"Applied",key:"id"},
  [SK.COMPANIES]:{sheet:"Companies",key:"code"},
  [SK.NOTIFS]:{sheet:"Notifications",key:"id"},
};

async function sd(k,v,s=false){
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) { console.error(e); }
  if(s&&SHEET_MAP[k]){
    // Fire-and-forget: don't make the UI wait on a network round-trip for every save.
    sheetReplaceAll(SHEET_MAP[k].sheet,Array.isArray(v)?v:[],SHEET_MAP[k].key)
      .catch(e=>console.error(`Sheet sync failed for "${SHEET_MAP[k].sheet}"`,e));
  }
}
async function ld(k,s=false){
  if(s&&SHEET_MAP[k]){
    const remote=await sheetList(SHEET_MAP[k].sheet);
    if(remote!==null){
      try{ localStorage.setItem(k,JSON.stringify(remote)); }catch(e){}
      return remote;
    }
    console.warn(`Could not reach Google Sheet for "${SHEET_MAP[k].sheet}" — using local cache.`);
  }
  try { const v=localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; }
}

function gid(){return Math.random().toString(36).substring(2,10).toUpperCase();}
function gjid(){return"JD"+Math.random().toString(36).substring(2,8).toUpperCase();}
function fmt(iso){return iso?new Date(iso).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";}

// ── GOOGLE SHEETS SYNC ────────────────────────────────────────────────────────
// Static pages can't write to a private Google Sheet directly; a small Google Apps
// Script deployed as a Web App acts as the bridge. Its deployed URL is baked in
// above (DEFAULT_GSHEET_URL) so this works for every visitor automatically — no
// per-browser setup needed. Candidate profiles, jobs, contact requests,
// applications, companies, and notifications are all mirrored two-way ("list" to
// read, "replace" to write) to their own tab (see SHEET_MAP above), and sign up /
// log in read/write a "Users" tab (see sheetSignup/sheetLogin below). The sync
// settings (cloud icon, #admin) can set a local override if you ever redeploy to
// a new URL.
async function sheetList(sheetName){
  try{
    const url=await getSheetUrl();
    if(!url) return null;
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"list",sheet:sheetName})});
    const text=await res.text();
    let data; try{ data=JSON.parse(text); }catch(e){ console.error(`Sheet list "${sheetName}": non-JSON response`,text.slice(0,300)); return null; }
    // Only trust an explicit rows array. If the deployed Apps Script is an older
    // version that doesn't understand action:"list" yet, it will still often
    // reply {success:true} with no "rows" field — treating that as "0 rows" would
    // silently wipe out real data on the next save, so we treat it as a failure
    // (falls back to the local cache) instead.
    if(!data||data.success===false||!Array.isArray(data.rows)) return null;
    return data.rows;
  }catch(e){ console.error(`Sheet list failed for "${sheetName}"`,e); return null; }
}
async function sheetReplaceAll(sheetName,rows,keyField){
  try{
    const url=await getSheetUrl();
    if(!url) return false;
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"replace",sheet:sheetName,data:rows,keyField})});
    const text=await res.text();
    let data; try{ data=JSON.parse(text); }catch(e){ return false; }
    return !!(data&&data.success);
  }catch(e){ console.error(`Sheet replace failed for "${sheetName}"`,e); return false; }
}

async function sendAutomationEmail(to,subject,body){
  try{
    const url=await getSheetUrl();
    if(!url||!to) return false;
    await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"send_email",to,subject,body})});
    return true;
  }catch(e){ console.error("Automation email failed",e); return false; }
}

// ── AUTH VIA GOOGLE SHEET (Apps Script bridge) ────────────────────────────────
// Flow: Frontend --POST email/password--> Apps Script --reads Google Sheet--> finds
// email --> checks password --> returns {success, token/code} or {success:false, error}.
// A deployed Apps Script Web App URL is baked in via DEFAULT_GSHEET_URL above, so this
// works for every visitor automatically. The Admin sync settings (cloud icon, #admin)
// can still set a local override, e.g. if you redeploy to a new URL.
async function isSheetAuthConfigured(){
  const url=await getSheetUrl();
  return !!url;
}
async function sheetSignup(role,email,password,suggestedCode){
  const url=await getSheetUrl();
  if(!url) return {success:false,error:"not_configured"};
  try{
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"signup",role,email,password,suggestedCode})});
    const text=await res.text();
    try{ return JSON.parse(text); }
    catch(parseErr){ console.error("Sheet signup: non-JSON response",text.slice(0,300)); return {success:false,error:"bad_response",raw:text.slice(0,300)}; }
  }catch(e){ console.error("Sheet signup failed",e); return {success:false,error:"network"}; }
}
async function sheetLogin(role,email,password){
  const url=await getSheetUrl();
  if(!url) return {success:false,error:"not_configured"};
  try{
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"login",role,email,password})});
    const text=await res.text();
    try{ return JSON.parse(text); }
    catch(parseErr){ console.error("Sheet login: non-JSON response",text.slice(0,300)); return {success:false,error:"bad_response",raw:text.slice(0,300)}; }
  }catch(e){ console.error("Sheet login failed",e); return {success:false,error:"network"}; }
}

// ── PASSWORD HASHING ──────────────────────────────────────────────────────────
// Uses bcrypt (via CDN) as specified in the auth flow. Falls back to a salted
// SHA-256 digest if bcrypt failed to load (e.g. offline), so signup/login still
// work — clearly namespaced so verifyPassword can tell which scheme was used.
// Note: since this is a fully static, client-side app there is no server to keep
// a signing/pepper secret on — this is demo-grade, not a production auth system.
async function hashPassword(pw){
  try{
    if(window.dcodeIO&&window.dcodeIO.bcrypt){
      return window.dcodeIO.bcrypt.hashSync(pw,10);
    }
  }catch(e){}
  const enc=new TextEncoder().encode("pairup-salt::"+pw);
  const buf=await crypto.subtle.digest("SHA-256",enc);
  const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  return "sha256:"+hex;
}
async function verifyPassword(pw,hash){
  if(!hash)return false;
  if(hash.startsWith("sha256:")){
    const enc=new TextEncoder().encode("pairup-salt::"+pw);
    const buf=await crypto.subtle.digest("SHA-256",enc);
    const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    return "sha256:"+hex===hash;
  }
  try{
    if(window.dcodeIO&&window.dcodeIO.bcrypt) return window.dcodeIO.bcrypt.compareSync(pw,hash);
  }catch(e){}
  return false;
}
function isStrongPassword(pw){
  return !!pw && pw.length>=8 && /[A-Za-z]/.test(pw) && /[0-9]/.test(pw);
}

// ── GOOGLE SIGN-IN ────────────────────────────────────────────────────────────
// Uses Google Identity Services (loaded via <script> in <head>). Requires a real
// Google Cloud OAuth Client ID configured by the site admin (via #admin settings) —
// with no client ID configured, this simply isn't available yet. Any Google account
// can be used; pairup only matches it against an *existing* local account by email
// (it does not create new accounts via Google).
function googleGetEmail(){
  return new Promise((resolve,reject)=>{
    (async()=>{
      const clientId=(await ld(GOOGLE_CLIENT_ID_KEY,true))||"";
      if(!clientId){reject(new Error("not_configured"));return;}
      if(!window.google||!window.google.accounts||!window.google.accounts.oauth2){reject(new Error("gsi_not_loaded"));return;}
      try{
        const client=window.google.accounts.oauth2.initTokenClient({
          client_id:clientId,
          scope:"openid email profile",
          callback:async(resp)=>{
            if(!resp||!resp.access_token){reject(new Error("no_token"));return;}
            try{
              const r=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:`Bearer ${resp.access_token}`}});
              const info=await r.json();
              if(info&&info.email) resolve(info.email); else reject(new Error("no_email"));
            }catch(e){reject(e);}
          },
          error_callback:(err)=>reject(err||new Error("popup_failed"))
        });
        client.requestAccessToken();
      }catch(e){reject(e);}
    })();
  });
}

function LanguagePicker({languages,onChange,error}){
  // languages = [{lang:"English",level:"Fluent"}, ...]
  const [adding,setAdding]=useState(false);
  const [newLang,setNewLang]=useState("");
  const [newLevel,setNewLevel]=useState("Fluent");
  const [customLang,setCustomLang]=useState("");

  const addLang=()=>{
    const name=newLang==="Other"?customLang.trim():newLang;
    if(!name)return;
    if(languages.find(l=>l.lang===name))return;
    onChange([...languages,{lang:name,level:newLevel}]);
    setNewLang("");setCustomLang("");setNewLevel("Fluent");setAdding(false);
  };
  const removeLang=(l)=>onChange(languages.filter(x=>x.lang!==l));
  const updateLevel=(l,level)=>onChange(languages.map(x=>x.lang===l?{...x,level}:x));

  return(
    <div>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:languages.length>0?10:0}}>
        {languages.map(l=>(
          <div key={l.lang} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:BRAND_LIGHT,borderRadius:10,border:`1px solid ${BRAND}22`}}>
            <Icon name="language" size={14} style={{color:BRAND,flexShrink:0}}/>
            <span style={{fontWeight:700,fontSize:13,color:BRAND,flex:1}}>{l.lang}</span>
            <select value={l.level} onChange={e=>updateLevel(l.lang,e.target.value)} style={{width:"auto",fontFamily:FONT,fontSize:12,padding:"4px 8px",border:`1px solid ${BRAND}44`,borderRadius:6,background:"#fff",color:BRAND,fontWeight:600}}>
              {PROFICIENCY.map(p=><option key={p}>{p}</option>)}
            </select>
            <button type="button" onClick={()=>removeLang(l.lang)} style={{background:"none",border:"none",cursor:"pointer",color:"#E24B4A",fontSize:16,lineHeight:1,padding:"0 2px"}}>×</button>
          </div>
        ))}
      </div>

      {adding?(
        <div style={{background:"var(--color-background-secondary)",borderRadius:10,padding:"12px",border:"0.5px solid var(--color-border-secondary)"}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
            <select value={newLang} onChange={e=>setNewLang(e.target.value)} style={{...inp,width:"auto",flex:2,minWidth:140}}>
              <option value="">Select language…</option>
              {LANG_OPTS.filter(o=>!languages.find(l=>l.lang===o)).map(o=><option key={o}>{o}</option>)}
            </select>
            <select value={newLevel} onChange={e=>setNewLevel(e.target.value)} style={{...inp,width:"auto",flex:1,minWidth:110}}>
              {PROFICIENCY.map(p=><option key={p}>{p}</option>)}
            </select>
          </div>
          {newLang==="Other"&&<input style={{...inp,marginBottom:8}} value={customLang} onChange={e=>setCustomLang(e.target.value)} placeholder="Specify language…"/>}
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={addLang} style={{fontSize:12,padding:"6px 14px"}} disabled={!newLang}>Add</Btn>
            <Btn variant="ghost" onClick={()=>{setAdding(false);setNewLang("");setCustomLang("");}} style={{fontSize:12,padding:"6px 14px"}}>Cancel</Btn>
          </div>
        </div>
      ):(
        <button type="button" onClick={()=>setAdding(true)} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:8,border:`1.5px dashed ${BRAND}`,background:"none",color:BRAND,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:FONT}}>
          <Icon name="plus" size={14}/>Add language
        </button>
      )}
      {error&&<p style={{fontSize:11,color:"#E24B4A",margin:"4px 0 0"}}>{error}</p>}
    </div>
  );
}

// ── AUTH (SIGN UP / LOG IN) ───────────────────────────────────────────────────
function AuthPage({role,onAuthed,onBack}){
  const accountsKey=role==="jobseeker"?SK.ACCOUNTS_JS:SK.ACCOUNTS_EMP;
  const [mode,setMode]=useState("login"); // "login" | "signup" | "forgot" | "reset"
  const [form,setForm]=useState({email:"",password:"",confirm:""});
  const [resetForm,setResetForm]=useState({password:"",confirm:""});
  const [resetToken,setResetToken]=useState(null); // {email,token}
  const [forgotSent,setForgotSent]=useState(false);
  const [showPw,setShowPw]=useState(false);
  const [showPw2,setShowPw2]=useState(false);
  const [remember,setRemember]=useState(true);
  const [errors,setErrors]=useState({});
  const [notice,setNotice]=useState("");
  const [busy,setBusy]=useState(false);
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const MAX_ATTEMPTS=5, LOCK_MS=15*60*1000;

  const persistSession=async(session)=>{
    if(remember){
      await sd(SK.SESSION,{...session,expiresAt:Date.now()+7*24*60*60*1000},true);
      try{sessionStorage.removeItem(SK.SESSION);}catch(e){}
    }else{
      await sd(SK.SESSION,null,true); // ensure no stale 7-day session lingers
      try{sessionStorage.setItem(SK.SESSION,JSON.stringify(session));}catch(e){}
    }
  };

  const switchMode=(m)=>{setMode(m);setErrors({});setNotice("");};

  // ── Sign up ──────────────────────────────────────────────────────────────
  const doSignup=async()=>{
    const e={};
    if(!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/))e.email="Invalid email format";
    if(!isStrongPassword(form.password))e.password="At least 8 characters, with letters and numbers";
    if(form.confirm!==form.password)e.confirm="Passwords do not match";
    if(Object.keys(e).length){setErrors(e);return;}
    setBusy(true);
    const emailNorm=form.email.trim().toLowerCase();

    // ── Preferred path: Apps Script writes the new user straight into the Google Sheet ──
    if(await isSheetAuthConfigured()){
      const code=role==="jobseeker"?await nextCode():("CO"+gid());
      const result=await sheetSignup(role,form.email.trim(),form.password,code);
      if(!result||result.success===false){
        setBusy(false);
        const reason=result&&result.error;
        if(reason==="exists"){ setErrors({email:"Email already exists. Please log in instead."}); return; }
        const detail=result?.message||result?.raw||reason||"unknown error";
        setErrors({email:`Could not create your account (${detail}). Check the Apps Script URL/deployment in the Admin sync settings, or try again.`});
        return;
      }
      const session={role,email:form.email.trim(),code:result.code||code,token:result.token||(gid()+gid())};
      await persistSession(session);
      setBusy(false);
      onAuthed(session);
      return;
    }

    // ── Fallback: local-only demo mode (no Apps Script URL configured) ──
    const accounts=(await ld(accountsKey,true))||[];
    if(accounts.find(a=>a.email.toLowerCase()===emailNorm)){
      setBusy(false);
      setErrors({email:"Email already exists. Please log in instead."});
      return;
    }
    const code=role==="jobseeker"?await nextCode():("CO"+gid());
    const passwordHash=await hashPassword(form.password);
    const account={email:form.email.trim(),passwordHash,code,createdAt:new Date().toISOString(),failedAttempts:0,lockedUntil:null,active:true};
    await sd(accountsKey,[...accounts,account],true);
    const session={role,email:account.email,code,token:gid()+gid()};
    await persistSession(session);
    setBusy(false);
    onAuthed(session);
  };

  // ── Log in ───────────────────────────────────────────────────────────────
  const doLogin=async()=>{
    const e={};
    if(!form.email.trim())e.email="Required";
    if(!form.password)e.password="Required";
    if(Object.keys(e).length){setErrors(e);return;}
    setBusy(true);

    // ── Preferred path: Apps Script reads the Google Sheet, finds the email, checks the password ──
    if(await isSheetAuthConfigured()){
      const result=await sheetLogin(role,form.email.trim(),form.password);
      setBusy(false);
      if(!result||result.success===false){
        const reason=result&&result.error;
        if(reason==="not_found"){ setErrors({email:"This email is not registered. Please sign up first."}); return; }
        if(reason==="wrong_password"){ setErrors({password:"Incorrect password."}); return; }
        if(reason==="locked"){ setErrors({password:"Account is temporarily locked due to too many failed attempts. Try again later."}); return; }
        if(reason==="inactive"){ setErrors({password:"This account has been deactivated."}); return; }
        // Any other failure (network issue, misconfigured/undeployed Apps Script, server error,
        // unexpected response, etc.) — always show something concrete instead of failing silently.
        const detail=result?.message||result?.raw||reason||"unknown error";
        setErrors({password:`Could not log you in (${detail}). Check the Apps Script URL/deployment in the Admin sync settings, or try again.`});
        return;
      }
      const session={role,email:form.email.trim(),code:result.code,token:result.token||(gid()+gid())};
      await persistSession(session);
      onAuthed(session);
      return;
    }

    // ── Fallback: local-only demo mode (no Apps Script URL configured) ──
    const accounts=(await ld(accountsKey,true))||[];
    const emailNorm=form.email.trim().toLowerCase();
    const idx=accounts.findIndex(a=>a.email.toLowerCase()===emailNorm);
    if(idx===-1){
      setBusy(false);
      setErrors({email:"This email is not registered."});
      return;
    }
    const account=accounts[idx];
    if(account.lockedUntil&&account.lockedUntil>Date.now()){
      setBusy(false);
      const mins=Math.ceil((account.lockedUntil-Date.now())/60000);
      setErrors({password:`Account is temporarily locked due to too many failed attempts. Try again in ${mins} minute${mins!==1?"s":""}.`});
      return;
    }
    const ok=await verifyPassword(form.password,account.passwordHash);
    if(!ok){
      const updated=[...accounts];
      const attempts=(account.failedAttempts||0)+1;
      updated[idx]={...account,failedAttempts:attempts,lockedUntil:attempts>=MAX_ATTEMPTS?Date.now()+LOCK_MS:null};
      await sd(accountsKey,updated,true);
      setBusy(false);
      setErrors({password:attempts>=MAX_ATTEMPTS?`Too many failed attempts. Account locked for 15 minutes.`:"Incorrect password."});
      return;
    }
    if(account.active===false){
      setBusy(false);
      setErrors({password:"This account has been deactivated."});
      return;
    }
    const updated=[...accounts];
    updated[idx]={...account,failedAttempts:0,lockedUntil:null};
    await sd(accountsKey,updated,true);
    const session={role,email:account.email,code:account.code,token:gid()+gid()};
    await persistSession(session);
    setBusy(false);
    onAuthed(session);
  };

  // ── Sign in with Google (matches an existing pairup account by email) ──────
  const doGoogleSignIn=async()=>{
    setNotice("");setErrors({});
    setBusy(true);
    try{
      const email=await googleGetEmail();
      const accounts=(await ld(accountsKey,true))||[];
      const emailNorm=email.trim().toLowerCase();
      const account=accounts.find(a=>a.email.toLowerCase()===emailNorm);
      if(!account){
        setBusy(false);
        setNotice(`No pairup account found for ${email} under this role. Please sign up first, or make sure you selected the right role (${role==="jobseeker"?"Job Seeker":"Employer"}).`);
        return;
      }
      const session={role,email:account.email,code:account.code,token:gid()+gid()};
      await persistSession(session);
      setBusy(false);
      onAuthed(session);
    }catch(err){
      setBusy(false);
      if(err&&err.message==="not_configured"){
        setNotice("Google Sign-In isn't set up for this deployment yet — please use email/password.");
      }else if(err&&err.message==="gsi_not_loaded"){
        setNotice("Google Sign-In is still loading — please try again in a moment, or use email/password.");
      }else{
        setNotice("Google Sign-In was cancelled or failed. Please try again, or use email/password.");
      }
    }
  };

  // ── Forgot / reset password ─────────────────────────────────────────────
  const doForgot=async()=>{
    if(!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)){setErrors({email:"Invalid email format"});return;}
    setBusy(true);
    const accounts=(await ld(accountsKey,true))||[];
    const emailNorm=form.email.trim().toLowerCase();
    const idx=accounts.findIndex(a=>a.email.toLowerCase()===emailNorm);
    let token=null;
    if(idx!==-1){
      token=gid()+gid();
      const updated=[...accounts];
      updated[idx]={...accounts[idx],resetToken:token,resetExpiresAt:Date.now()+30*60*1000};
      await sd(accountsKey,updated,true);
    }
    // Always the same message, whether or not the email exists (avoids account enumeration)
    setResetToken({email:form.email.trim(),token}); // token may be null if email wasn't found
    setForgotSent(true);
    setBusy(false);
  };

  const doReset=async()=>{
    const e={};
    if(!isStrongPassword(resetForm.password))e.password="At least 8 characters, with letters and numbers";
    if(resetForm.confirm!==resetForm.password)e.confirm="Passwords do not match";
    if(Object.keys(e).length){setErrors(e);return;}
    setBusy(true);
    const accounts=(await ld(accountsKey,true))||[];
    const idx=accounts.findIndex(a=>a.email.toLowerCase()===(resetToken?.email||"").toLowerCase()
      && a.resetToken && resetToken?.token && a.resetToken===resetToken.token
      && a.resetExpiresAt && a.resetExpiresAt>Date.now());
    if(idx===-1){
      setBusy(false);
      setErrors({password:"This reset link is invalid or has expired. Please request a new one."});
      return;
    }
    const passwordHash=await hashPassword(resetForm.password);
    const updated=[...accounts];
    updated[idx]={...accounts[idx],passwordHash,resetToken:null,resetExpiresAt:null,failedAttempts:0,lockedUntil:null};
    await sd(accountsKey,updated,true);
    setBusy(false);
    setNotice("Your password has been reset. Please log in.");
    setForm({email:resetToken?.email||"",password:"",confirm:""});
    setResetToken(null);setForgotSent(false);
    switchMode("login");
    setNotice("Your password has been reset. Please log in.");
  };

  const submit=mode==="signup"?doSignup:mode==="forgot"?doForgot:mode==="reset"?doReset:doLogin;
  const onKey=e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } };
  const eyeBtn=(shown,toggle)=>(
    <button type="button" onClick={toggle} tabIndex={-1} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--color-text-secondary)",padding:4,display:"flex"}}>
      <Icon name={shown?"eye-off":"eye"} size={16}/>
    </button>
  );

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"2rem",fontFamily:FONT,background:"var(--color-background-tertiary)"}}>
      <div style={{width:"100%",maxWidth:440}}>
        <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontSize:13,fontWeight:700,fontFamily:FONT,display:"flex",alignItems:"center",gap:6,marginBottom:"1.25rem"}}><Icon name="arrow-left" size={14}/>Back</button>
        <Card>
          <form onSubmit={e=>{e.preventDefault();submit();}}>
            {mode!=="reset"&&<h2 style={{fontSize:20,fontWeight:800,margin:"0 0 10px",display:"flex",alignItems:"center",gap:8,color:"var(--color-text-primary)"}}>
              Welcome to <span style={{color:BRAND,fontWeight:800,letterSpacing:-0.5}}><span style={{opacity:.45,fontWeight:400}}>pair</span>up</span>
            </h2>}

            {mode==="login"&&<>
              <p style={{fontSize:12.5,color:"var(--color-text-secondary)",lineHeight:1.6,margin:"0 0 1.25rem"}}>By signing in, you agree to pairup's <a href="#" onClick={ev=>ev.preventDefault()} style={{color:BRAND}}>Terms &amp; Conditions</a> and <a href="#" onClick={ev=>ev.preventDefault()} style={{color:BRAND}}>Privacy Policy</a> in relation to your privacy information.</p>
              <button type="button" onClick={doGoogleSignIn} disabled={busy} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:"12px",border:`1px solid ${BRAND}`,borderRadius:8,background:"#fff",color:BRAND,fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:FONT,marginBottom:"1.25rem"}}>
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.5 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 35 26.9 36 24 36c-5.4 0-9.9-3.5-11.3-8.3l-6.6 5.1C9.6 39.7 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.7 4.8-5 6.3l6.3 5.3C39.8 36.9 44 31.1 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
                Sign In with Google
              </button>

// ── EMPLOYER COMPANY PROFILE (required once per employer account) ────────────
function CompanyProfilePage({session,onSaved,existing}){
  const blank={name:"",industry:"",taxCode:"",address:"",intro:"",website:"",teamSize:""};
  const [form,setForm]=useState(existing?{name:existing.name||"",industry:existing.industry||"",taxCode:existing.taxCode||"",address:existing.address||"",intro:existing.intro||"",website:existing.website||"",teamSize:existing.teamSize||""}:blank);
  const [errors,setErrors]=useState({});
  const s=(k,v)=>setForm(f=>({...f,[k]:v}));

  const validate=()=>{
    const e={};
    if(!form.name.trim())e.name="Required";
    if(!form.industry)e.industry="Required";
    if(!form.taxCode.trim())e.taxCode="Required";
    if(!form.address.trim())e.address="Required";
    if(!form.intro.trim())e.intro="Required";
    if(!form.website.trim())e.website="Required";
    if(!form.teamSize)e.teamSize="Required";
    return e;
  };

  const submit=async()=>{
    const e=validate();if(Object.keys(e).length){setErrors(e);return;}
    const company={...form,code:session.code,email:session.email,createdAt:new Date().toISOString()};
    const all=(await ld(SK.COMPANIES,true))||[];
    const i=all.findIndex(c=>c.code===session.code);
    if(i>=0)all[i]=company;else all.push(company);
    await sd(SK.COMPANIES,all,true);
    onSaved(company);
  };

  return(
    <div style={{maxWidth:680,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      <div style={{marginBottom:"1.5rem"}}>
        <h1 style={{fontSize:24,fontWeight:800,margin:"0 0 6px",color:BRAND}}>Tell us about your company</h1>
        <p style={{color:"var(--color-text-secondary)",fontSize:13,margin:0}}>This is required before you can post jobs. Each account represents one company. All fields are required.</p>
      </div>
      <Card>
        <SH icon="building" title="Company Information"/>
        <F label="Company name" error={errors.name} required><input style={inp} value={form.name} onChange={e=>s("name",e.target.value)}/></F>
        <F label="Industry" error={errors.industry} required><select style={inp} value={form.industry} onChange={e=>s("industry",e.target.value)}><option value="">-- Select --</option>{INDUSTRIES.map(i=><option key={i}>{i}</option>)}</select></F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Tax code" error={errors.taxCode} required><input style={inp} value={form.taxCode} onChange={e=>s("taxCode",e.target.value)}/></F>
          <F label="Company website" error={errors.website} required><input style={inp} value={form.website} onChange={e=>s("website",e.target.value)} placeholder="https://…"/></F>
        </div>
        <F label="Company address" error={errors.address} required><input style={inp} value={form.address} onChange={e=>s("address",e.target.value)}/></F>
        <F label="Number of employees" error={errors.teamSize} required><select style={inp} value={form.teamSize} onChange={e=>s("teamSize",e.target.value)}><option value="">-- Select --</option>{COMPANY_SIZES.map(sz=><option key={sz}>{sz}</option>)}</select></F>
        <F label="Company overview" error={errors.intro} required hint="A short introduction about your company"><textarea style={{...inp,minHeight:100}} value={form.intro} onChange={e=>s("intro",e.target.value)}/></F>
      </Card>
      <Btn onClick={submit} style={{width:"100%",justifyContent:"center",padding:"13px"}}>Save and continue →</Btn>
    </div>
  );
}

// ── SYNC SETTINGS (Google Sheets bridge URL) ──────────────────────────────────
function SyncSettingsModal({onClose}){
  const [url,setUrl]=useState("");
  const [clientId,setClientId]=useState("");
  const [saved,setSaved]=useState(false);
  const [testing,setTesting]=useState(false);
  const [testResults,setTestResults]=useState(null); // [{sheet, ok, message}]
  useEffect(()=>{
    ld(GSHEET_URL_KEY,true).then(u=>setUrl(u||""));
    ld(GOOGLE_CLIENT_ID_KEY,true).then(c=>setClientId(c||""));
  },[]);
  const save=async()=>{
    await sd(GSHEET_URL_KEY,url.trim(),true);
    await sd(GOOGLE_CLIENT_ID_KEY,clientId.trim(),true);
    setSaved(true);setTimeout(()=>setSaved(false),1800);
  };
  const checkOneSheet=async(activeUrl,sheetName)=>{
    try{
      const res=await fetch(activeUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"list",sheet:sheetName})});
      const text=await res.text();
      let data;
      try{ data=JSON.parse(text); }
      catch(e){ return {sheet:sheetName,ok:false,message:"Didn't return JSON (got HTML/other) — Web App access likely isn't set to \"Anyone\"."}; }
      if(!data||data.success===false) return {sheet:sheetName,ok:false,message:`Error: ${data?.error||"unknown"}${data?.message?" — "+data.message:""}`};
      if(!Array.isArray(data.rows)) return {sheet:sheetName,ok:false,message:'No "rows" array in response — OUTDATED deployment. Redeploy: Deploy → Manage deployments → Edit → New version → Deploy.'};
      return {sheet:sheetName,ok:true,message:`${data.rows.length} row(s)`};
    }catch(e){ return {sheet:sheetName,ok:false,message:"Network error — could not reach this URL at all."}; }
  };
  const testConnection=async()=>{
    setTesting(true);setTestResults(null);
    const activeUrl=url.trim()||DEFAULT_GSHEET_URL;
    const sheetNames=[...new Set(Object.values(SHEET_MAP).map(m=>m.sheet))];
    const results=await Promise.all(sheetNames.map(name=>checkOneSheet(activeUrl,name)));
    setTestResults(results);
    setTesting(false);
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,30,80,0.45)",zIndex:600,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:520,padding:"1.75rem",fontFamily:FONT}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
          <h3 style={{fontSize:15,fontWeight:800,margin:0,color:BRAND}}>Integrations</h3>
          <button onClick={onClose} style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",color:BRAND,width:30,height:30,borderRadius:"50%",fontSize:15,fontWeight:700}}>✕</button>
        </div>
        <p style={{fontSize:12,color:"var(--color-text-secondary)",lineHeight:1.6,margin:"0 0 1rem"}}>The app already ships with a deployed Apps Script Web App URL baked in, so sign up / log in / data sync work for every visitor out of the box — no per-browser setup needed. Only fill this in if you've deployed a <em>new</em> Apps Script URL and want to override the built-in one (e.g. after redeploying). Leave blank to keep using the built-in URL.</p>
        <F label="Web App URL override (optional)"><input style={inp} value={url} onChange={e=>setUrl(e.target.value)} placeholder={DEFAULT_GSHEET_URL}/></F>
        <p style={{fontSize:11,color:"var(--color-text-secondary)",margin:"-0.5rem 0 1rem",wordBreak:"break-all"}}>Currently active: {url.trim()||DEFAULT_GSHEET_URL}</p>
        <Btn variant="outline" onClick={testConnection} style={{width:"100%",justifyContent:"center",marginBottom:"1rem"}} disabled={testing}>{testing?"Testing…":"Test connection"}</Btn>
        {testResults&&(
          <div style={{marginBottom:"1.25rem",display:"flex",flexDirection:"column",gap:6}}>
            {testResults.map(r=>(
              <div key={r.sheet} style={{background:r.ok?"#E9F7EE":"#FFF1F0",border:`1px solid ${r.ok?"#B7E4C7":"#FFC9C6"}`,borderRadius:10,padding:"0.6rem 0.9rem",fontSize:12,color:r.ok?"#1E6B3A":"#8A2A26",lineHeight:1.5,display:"flex",gap:8}}>
                <strong style={{flexShrink:0}}>{r.sheet}:</strong><span>{r.message}</span>
              </div>
            ))}
          </div>
        )}
        <p style={{fontSize:12,color:"var(--color-text-secondary)",lineHeight:1.6,margin:"1.25rem 0 1rem"}}>Google Sign-In requires an OAuth Client ID from Google Cloud Console with this page's origin added as an authorized JavaScript origin.</p>
        <F label="Google OAuth Client ID"><input style={inp} value={clientId} onChange={e=>setClientId(e.target.value)} placeholder="xxxxxxxxxx.apps.googleusercontent.com"/></F>
        <Btn onClick={save} style={{width:"100%",justifyContent:"center"}}>{saved?"Saved ✓":"Save"}</Btn>
      </div>
    </div>
  );
}

        <div style={{position:"fixed",inset:0,background:"rgba(0,30,80,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:"1rem"}}>
          <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:640,maxHeight:"85vh",overflow:"auto",padding:"1.75rem"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.25rem"}}>
              <h3 style={{fontSize:16,fontWeight:800,margin:0,color:BRAND}}>{viewing.kind==="candidate"?`Candidate ${viewing.data.code}`:`Job ${viewing.data.code}`}</h3>
              <button onClick={()=>setViewing(null)} style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",color:BRAND,width:30,height:30,borderRadius:"50%",fontSize:15,fontWeight:700}}>✕</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 20px"}}>
              {Object.entries(viewing.data).filter(([k])=>!["recruitmentProcess","emailSettings"].includes(k)).map(([k,v])=>(
                <div key={k} style={{borderBottom:"0.5px solid var(--color-border-tertiary)",paddingBottom:8}}>
                  <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.6,margin:"0 0 3px"}}>{k}</p>
                  <p style={{fontSize:13,margin:0,wordBreak:"break-word"}}>{typeof v==="object"?JSON.stringify(v):String(v??"—")}</p>
                </div>
              ))}
            </div>
            <div style={{marginTop:"1.5rem",display:"flex",justifyContent:"flex-end"}}>
              <Btn variant="danger" onClick={()=>viewing.kind==="candidate"?deleteCandidate(viewing.data):deleteJob(viewing.data)}><Icon name="trash" size={14}/>Delete permanently</Btn>
            </div>
          </div>
        </div>
      )}

      {showSync&&<SyncSettingsModal onClose={()=>setShowSync(false)}/>}
    </div>
  );
}

// ── MY PROFILE ────────────────────────────────────────────────────────────────
function CandidatePage({onSubmit,refresh,session,initialTab}){
  const LKEY="pairup_my_profile_"+session.email;
  const blank={name:"",email:session.email,phone:"",social:"",position:"",field:"",locations:[],industries:[],skills:"",years:"",languages:[],intro:"",onboard:"",salary:"",portfolio:"",cvLink:"",consentPool:false,consentStore:false};
  const [profile,setProfile]=useState(null); // null = not yet loaded
  const [ready,setReady]=useState(false);    // true once storage check done
  const [mode,setMode]=useState("view");     // "view" | "edit"
  const [tab,setTab]=useState(initialTab||"info");       // "info" | "requests" | "applied"
  const [form,setForm]=useState(blank);
  const [submitted,setSubmitted]=useState(null);
  const [errors,setErrors]=useState({});
  const [requests,setRequests]=useState([]);
  const [selReq,setSelReq]=useState(null);
  const [shareOn,setShareOn]=useState(false);
  const [appliedJobs,setAppliedJobs]=useState([]);
  const [profileEvents,setProfileEvents]=useState([]);
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));

  // Load profile from storage once
  useEffect(()=>{
    ld(LKEY).then(p=>{
      if(p){setProfile(p);setShareOn(p.shareActive||false);}
      setReady(true);
    });
  },[refresh]);

  // Load requests whenever profile changes
  useEffect(()=>{
    if(profile?.code){
      Promise.all([ld(SK.REQUESTS,true),ld(SK.APPLICATIONS,true)]).then(([r,a])=>{
        setRequests((r||[]).filter(x=>x.candidateCode===profile.code));
        setAppliedJobs((a||[]).filter(x=>x.candidateCode===profile.code || (x.email&&x.email===profile.email)));
      });
      setProfileEvents(profile.profileEvents||[]);
    }
  },[profile,refresh]);

  // ── Helpers ──
  const persist=async(c)=>{
    await sd(LKEY,c);
    const all=(await ld(SK.CANDIDATES,true))||[];
    const i=all.findIndex(x=>x.code===c.code);
    if(i>=0)all[i]=c;else all.push(c);
    await sd(SK.CANDIDATES,all,true);
  };

  const validate=()=>{
    const e={};
    if(!form.name.trim())e.name="Required";
    if(!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/))e.email="Invalid email";
    if(!form.phone.trim())e.phone="Required";
    if(!form.position.trim())e.position="Required";
    if(!form.field)e.field="Required";
    if(form.locations.length===0)e.locations="Select at least one";
    if(form.industries.length===0)e.industries="Select at least one";
    if(!form.skills.trim())e.skills="Required";
    if(!form.years)e.years="Required";
    if(form.languages.length===0)e.languages="Add at least one language";
    if(!form.intro.trim())e.intro="Required";
    if(!form.onboard)e.onboard="Required";
    if(!form.salary)e.salary="Required";
    if(!form.consentStore)e.consentStore="You must agree to data storage";
    return e;
  };

  const openEdit=()=>{
    const s=profile||{};
    setForm({name:s.name||"",email:s.email||"",phone:s.phone||"",social:s.social||"",position:s.position||"",field:s.field||"",locations:s.locations||[],industries:s.industries||[],skills:s.skills||"",years:s.years||"",languages:s.languages||[],intro:s.intro||"",onboard:s.onboard||"",salary:s.salary||"",portfolio:s.portfolio||"",cvLink:s.cvLink||"",consentPool:s.shareActive||false,consentStore:!!s.code});
    setErrors({});setMode("edit");
  };

  const doToggleShare=async(val)=>{
    if(!profile){openEdit();return;}
    const u={...profile,shareActive:val,consentPool:val};
    await persist(u);setShareOn(val);setProfile(u);onSubmit();
  };

  const doSubmit=async()=>{
    const e=validate();if(Object.keys(e).length){setErrors(e);return;}
    const code=session.code;
    const c={...form,code,createdAt:new Date().toISOString(),status:"active",shareActive:form.consentPool};
    await persist(c);setProfile(c);setShareOn(form.consentPool);setSubmitted(code);onSubmit();
  };

  const doUpdate=async()=>{
    const e=validate();if(Object.keys(e).length){setErrors(e);return;}
    const c={...profile,...form,updatedAt:new Date().toISOString(),shareActive:form.consentPool};
    await persist(c);setProfile(c);setMode("view");onSubmit();
  };

  const doRespond=async(req,action)=>{
    const all=(await ld(SK.REQUESTS,true))||[];
    const i=all.findIndex(r=>r.id===req.id);
    if(i>=0){all[i].status=action;await sd(SK.REQUESTS,all,true);}
    const notifs=(await ld(SK.NOTIFS,true))||[];
    notifs.push({id:gid(),type:"response",to:req.employerEmail||"employer",candidateCode:profile.code,companyName:req.company,position:req.title,action,createdAt:new Date().toISOString(),read:false});
    await sd(SK.NOTIFS,notifs,true);
    setRequests(r=>r.map(x=>x.id===req.id?{...x,status:action}:x));
    setSelReq(null);onSubmit();
  };

  // Wait for storage to load before rendering
  if(!ready)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"4rem",fontFamily:FONT}}>
      <Icon name="loader-2" size={24} style={{color:BRAND,animation:"spin 1s linear infinite"}}/>
    </div>
  );

  // ── SUCCESS screen ──
  if(submitted)return(
    <div style={{maxWidth:500,margin:"4rem auto",textAlign:"center",padding:"0 1.5rem",fontFamily:FONT}}>
      <div style={{width:72,height:72,borderRadius:"50%",background:BRAND_LIGHT,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 1.5rem"}}>
        <Icon name="check" size={34} style={{color:BRAND}}/>
      </div>
      <h2 style={{fontWeight:800,fontSize:24,margin:"0 0 0.5rem",color:BRAND}}>Profile saved!</h2>
      <p style={{color:"var(--color-text-secondary)",marginBottom:"2rem",lineHeight:1.6,fontSize:14}}>Your profile is ready. Employers will reach out when a suitable role arises.</p>
      <div style={{background:BRAND_LIGHT,borderRadius:16,padding:"1.5rem 2rem",marginBottom:"1.5rem",border:`1.5px solid ${BRAND}22`}}>
        <p style={{fontSize:10,color:BRAND,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:1.5}}>Your Candidate Code</p>
        <p style={{fontSize:42,fontWeight:800,letterSpacing:4,color:BRAND,margin:0,fontFamily:"monospace"}}>{submitted}</p>
      </div>
      <Btn variant="outline" onClick={()=>{setSubmitted(null);setMode("view");}} style={{marginTop:"0.5rem"}}>View my profile →</Btn>
    </div>
  );

  // ── REQUEST DETAIL ──
  if(selReq)return(
    <div style={{maxWidth:700,margin:"0 auto",fontFamily:FONT,paddingBottom:"4rem"}}>
      <div style={{background:BRAND,padding:"1rem 2rem",display:"flex",alignItems:"center",gap:12,position:"sticky",top:48,zIndex:90}}>
        <button onClick={()=>setSelReq(null)} style={{background:"rgba(255,255,255,0.15)",border:"none",cursor:"pointer",color:"#fff",width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <Icon name="arrow-left" size={15}/>
        </button>
        <div style={{flex:1}}>
          <p style={{color:"rgba(255,255,255,0.65)",fontSize:11,margin:0,fontFamily:FONT}}>Contact Request from</p>
          <p style={{color:"#fff",fontWeight:800,fontSize:16,margin:0,fontFamily:FONT}}>{selReq.company}</p>
        </div>
        <Badge color={selReq.status==="pending"?"amber":selReq.status==="accepted"?"green":"red"}>
          {selReq.status==="pending"?"Awaiting reply":selReq.status==="accepted"?"Accepted":"Declined"}
        </Badge>
      </div>
      <div style={{padding:"1.5rem 2rem"}}>
        <Card>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 28px"}}>
            {[["Company",selReq.company],["Position",selReq.title],["Offered Salary",selReq.salary||"—"],["Contact Person",selReq.contactName||"—"],["Contact Email",selReq.contactEmail||"—"],["Contact Phone",selReq.contactPhone||"—"]].map(([l,v])=>(
              <div key={l} style={{borderBottom:"0.5px solid var(--color-border-tertiary)",paddingBottom:10}}>
                <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 4px"}}>{l}</p>
                <p style={{fontSize:14,fontWeight:500,margin:0}}>{v}</p>
              </div>
            ))}
          </div>
        </Card>
        {selReq.jd&&<Card><p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>Job Description</p><p style={{fontSize:14,lineHeight:1.8,margin:0}}>{selReq.jd}</p></Card>}
        {selReq.benefits&&<Card><p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 10px"}}>Benefits</p><p style={{fontSize:14,lineHeight:1.8,margin:0}}>{selReq.benefits}</p></Card>}
        {selReq.status==="pending"?(
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <Btn onClick={()=>doRespond(selReq,"accepted")} style={{flex:1,justifyContent:"center",fontSize:14,padding:"13px"}}>
              <Icon name="check" size={15}/>Agree — share my contact
            </Btn>
            <Btn variant="danger" onClick={()=>doRespond(selReq,"denied")} style={{flex:1,justifyContent:"center",fontSize:14,padding:"13px"}}>
              <Icon name="x" size={15}/>Deny
            </Btn>
          </div>
        ):(
          <div style={{padding:"1.25rem",background:selReq.status==="accepted"?BRAND_LIGHT:"#FDEAEA",borderRadius:14,textAlign:"center",fontWeight:700,fontSize:15,color:selReq.status==="accepted"?BRAND:"#8B1A1A",border:`1.5px solid ${selReq.status==="accepted"?BRAND+"33":"#E24B4A33"}`}}>
            {selReq.status==="accepted"?"✓ You accepted — your contact info was shared":"✕ You declined this request"}
          </div>
        )}
      </div>
    </div>
  );

  // ── EDIT FORM ──
  if(mode==="edit")return(
    <div style={{maxWidth:700,margin:"2rem auto",padding:"0 1rem 5rem",fontFamily:FONT}}>
      <button onClick={()=>setMode("view")} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontSize:13,fontWeight:600,fontFamily:FONT,marginBottom:"1.5rem",display:"flex",alignItems:"center",gap:6}}>
        <Icon name="arrow-left" size={14}/>Back to profile
      </button>
      <div style={{marginBottom:"2rem"}}>
        <h1 style={{fontSize:24,fontWeight:800,margin:"0 0 4px"}}>{profile?"Update your profile":"Complete your profile"}</h1>
        <p style={{color:"var(--color-text-secondary)",fontSize:13,margin:0}}>All fields required unless marked optional</p>
      </div>

      {/* CV Link */}
      <Card>
        <SH icon="link" title="CV / Resume"/>
        <F label="CV link" hint="Paste a shareable link to your CV (Google Drive, Dropbox, OneDrive, Notion, or another public link).">
          <input style={inp} type="url" value={form.cvLink} onChange={e=>sf("cvLink",e.target.value)} placeholder="https://drive.google.com/..."/>
        </F>
        <p style={{fontSize:11,color:"var(--color-text-secondary)",margin:"-0.5rem 0 0"}}>Your CV link is private and will only be shared with an employer after you accept their contact request.</p>
      </Card>

      {/* Personal */}
      <Card>
        <SH icon="user-circle" title="Personal Information"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Full name" error={errors.name} required><input style={inp} value={form.name} onChange={e=>sf("name",e.target.value)} placeholder="Jane Smith"/></F>
          <F label="Email" error={errors.email} required><input style={inp} type="email" value={form.email} onChange={e=>sf("email",e.target.value)} placeholder="jane@example.com"/></F>
          <F label="Phone" error={errors.phone} required><input style={inp} value={form.phone} onChange={e=>sf("phone",e.target.value)} placeholder="+84 9xx xxx xxx"/></F>
          <F label="Social links (Facebook, LinkedIn…)"><input style={inp} value={form.social} onChange={e=>sf("social",e.target.value)} placeholder="https://linkedin.com/in/…"/></F>
        </div>
      </Card>

      {/* Career */}
      <Card>
        <SH icon="briefcase" title="Career Preferences"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Desired position" error={errors.position} required><input style={inp} value={form.position} onChange={e=>sf("position",e.target.value)} placeholder="e.g. Senior Product Designer"/></F>
          <F label="Field" error={errors.field} required>
            <select style={inp} value={form.field} onChange={e=>sf("field",e.target.value)}>
              <option value="">-- Select field --</option>
              {FIELDS.map(f=><option key={f}>{f}</option>)}
            </select>
          </F>
        </div>
        <F label="Preferred location(s)" error={errors.locations} required>
          <PillSel options={LOCATIONS} selected={form.locations} onToggle={l=>sf("locations",form.locations.includes(l)?form.locations.filter(x=>x!==l):[...form.locations,l])} error={errors.locations}/>
        </F>
        <F label="Industry (select all that apply)" error={errors.industries} required>
          <IndustryPicker selected={form.industries} onToggle={i=>sf("industries",form.industries.includes(i)?form.industries.filter(x=>x!==i):[...form.industries,i])} error={errors.industries}/>
        </F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Years of experience" error={errors.years} required>
            <select style={inp} value={form.years} onChange={e=>sf("years",e.target.value)}>
              <option value="">-- Select --</option>
              {YEARS_OPTS.map(o=><option key={o}>{o}</option>)}
            </select>
          </F>
          <F label="Salary expectation" error={errors.salary} required>
            <select style={inp} value={form.salary} onChange={e=>sf("salary",e.target.value)}>
              <option value="">-- Select --</option>
              {SALARY_OPTS.map(o=><option key={o}>{o}</option>)}
            </select>
          </F>
        </div>
        <F label="Languages" error={errors.languages} required>
          <LanguagePicker languages={form.languages} onChange={v=>sf("languages",v)} error={errors.languages}/>
        </F>
        <F label="Key skills" error={errors.skills} required>
          <input style={inp} value={form.skills} onChange={e=>sf("skills",e.target.value)} placeholder="e.g. React, Node.js, Figma, SQL…"/>
        </F>
        <F label="Professional summary" error={errors.intro} required>
          <textarea style={{...inp,minHeight:100,resize:"vertical"}} value={form.intro} onChange={e=>sf("intro",e.target.value)} placeholder="Brief overview of your background, achievements, and career goals…"/>
        </F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Portfolio link"><input style={inp} value={form.portfolio} onChange={e=>sf("portfolio",e.target.value)} placeholder="https://your-portfolio.com"/></F>
          <F label="Available to start" error={errors.onboard} required>
            <select style={inp} value={form.onboard} onChange={e=>sf("onboard",e.target.value)}>
              <option value="">-- Select --</option>
              {ONBOARD_OPTS.map(o=><option key={o}>{o}</option>)}
            </select>
          </F>
        </div>
      </Card>

      {/* Consent */}
      <Card>
        <SH icon="shield-check" title="Privacy & Consent"/>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",padding:"1rem",background:BRAND_LIGHT,borderRadius:10,border:`1px solid ${form.consentPool?BRAND:BRAND_LIGHT}`}}>
            <input type="checkbox" checked={form.consentPool} onChange={e=>sf("consentPool",e.target.checked)} style={{marginTop:3,accentColor:BRAND,width:16,height:16,flexShrink:0}}/>
            <span style={{fontSize:13,color:BRAND_MID,lineHeight:1.6,fontFamily:FONT}}>
              <strong>I agree to the display of my work history within the Talent Pool.</strong> (Contact details, social channels and CV are strictly excluded from this view.)
            </span>
          </label>
          <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",padding:"1rem",background:"#F8F9FB",borderRadius:10,border:`1px solid ${form.consentStore?BRAND:"var(--color-border-tertiary)"}`}}>
            <input type="checkbox" checked={form.consentStore} onChange={e=>sf("consentStore",e.target.checked)} style={{marginTop:3,accentColor:BRAND,width:16,height:16,flexShrink:0}}/>
            <span style={{fontSize:13,color:"var(--color-text-primary)",lineHeight:1.6,fontFamily:FONT}}>
              <strong>By submitting this form, I allow pairup to securely store my personal information.</strong> Your data will <strong>NEVER BE SHARED</strong> without your explicit approval.
            </span>
          </label>
          {errors.consentStore&&<p style={{fontSize:11,color:"#E24B4A",margin:0}}>{errors.consentStore}</p>}
        </div>
      </Card>

      <Btn onClick={profile?doUpdate:doSubmit} style={{width:"100%",justifyContent:"center",fontSize:15,padding:"14px"}}>
        {profile?"Save changes →":"Submit profile →"}
      </Btn>
    </div>
  );

  // ── PROFILE VIEW (ALWAYS shown by default, blank if no data) ──
  const p=profile||{};
  const pendingCount=requests.filter(r=>r.status==="pending").length;

  const InfoCell=({label,value,link})=>(
    <div style={{borderBottom:"0.5px solid var(--color-border-tertiary)",paddingBottom:12}}>
      <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 5px"}}>{label}</p>
      {link&&value
        ?<a href={value} target="_blank" rel="noreferrer" style={{fontSize:14,color:BRAND,fontWeight:500,wordBreak:"break-all"}}>{value}</a>
        :<p style={{fontSize:14,fontWeight:value?500:400,margin:0,color:value?"var(--color-text-primary)":"#bbb",fontStyle:value?"normal":"italic"}}>{value||"—"}</p>
      }
    </div>
  );

  return(
    <div style={{maxWidth:800,margin:"0 auto",paddingBottom:"4rem",fontFamily:FONT}}>

      {/* ── HERO HEADER ── */}
      <div style={{background:BRAND,padding:"2rem 2rem 0"}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16,flexWrap:"wrap",marginBottom:"1.5rem"}}>
          {/* Avatar + name */}
          <div style={{display:"flex",gap:16,alignItems:"center",flex:1,minWidth:200}}>
            <div style={{width:64,height:64,borderRadius:"50%",background:"rgba(255,255,255,0.12)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:"2px solid rgba(255,255,255,0.2)"}}>
              <Icon name="user" size={28} style={{color:"rgba(255,255,255,0.9)"}}/>
            </div>
            <div>
              <h1 style={{color:p.name?"#fff":"rgba(255,255,255,0.35)",fontWeight:800,fontSize:20,margin:"0 0 3px",fontStyle:p.name?"normal":"italic"}}>
                {p.name||"Your name here"}
              </h1>
              <p style={{color:p.position?"rgba(255,255,255,0.75)":"rgba(255,255,255,0.3)",fontSize:13,margin:"0 0 6px",fontStyle:p.position?"normal":"italic"}}>
                {p.position||"Desired position"}
              </p>
              {p.code&&<span style={{fontFamily:"monospace",fontSize:11,background:"rgba(255,255,255,0.15)",color:"rgba(255,255,255,0.85)",padding:"2px 10px",borderRadius:6,fontWeight:700,letterSpacing:1}}>{p.code}</span>}
            </div>
          </div>
          {/* Action buttons */}
          <div style={{display:"flex",gap:8,flexWrap:"wrap",flexShrink:0}}>
            <button onClick={openEdit} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"9px 16px",borderRadius:8,border:"1.5px solid rgba(255,255,255,0.35)",background:"rgba(255,255,255,0.1)",color:"#fff",cursor:"pointer",fontFamily:FONT,fontWeight:700,fontSize:13}}>
              <Icon name="edit" size={13}/>{profile?"Update information":"Complete profile"}
            </button>
            <button onClick={()=>doToggleShare(!shareOn)} style={{display:"inline-flex",alignItems:"center",gap:8,padding:"9px 16px",borderRadius:8,border:`1.5px solid ${shareOn?"rgba(255,255,255,0.6)":"rgba(255,255,255,0.25)"}`,background:shareOn?"rgba(255,255,255,0.15)":"rgba(255,255,255,0.06)",color:"#fff",cursor:"pointer",fontFamily:FONT,fontWeight:700,fontSize:13}}>
              <span style={{width:30,height:17,borderRadius:99,background:shareOn?"#4ADE80":"rgba(255,255,255,0.25)",position:"relative",display:"inline-block",flexShrink:0}}>

        {/* Stats bar */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",background:"rgba(0,0,0,0.2)",borderRadius:"10px 10px 0 0",overflow:"hidden"}}>
          {[["Salary",p.salary,"currency"],["Experience",p.years,"clock"],["Location",(p.locations||[]).slice(0,1).join("") ,"map-pin"],["Available",p.onboard,"calendar"]].map(([l,v,ic])=>(
            <div key={l} style={{padding:"0.75rem 1rem",borderRight:"0.5px solid rgba(255,255,255,0.08)"}}>
              <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:3}}>
                <Icon name={ic} size={10} style={{color:"rgba(255,255,255,0.45)"}}/>
                <p style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.45)",textTransform:"uppercase",letterSpacing:0.7,margin:0}}>{l}</p>
              </div>
              <p style={{fontSize:12,fontWeight:700,color:v?"#fff":"rgba(255,255,255,0.25)",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontStyle:v?"normal":"italic"}}>{v||"—"}</p>
            </div>

        </div>
      </div>

      {/* ── TABS ── */}
      <div style={{background:"var(--color-background-primary)",borderBottom:"0.5px solid var(--color-border-tertiary)",display:"flex",padding:"0 2rem",position:"sticky",top:48,zIndex:80}}>

          <button key={id} onClick={()=>setTab(id)} style={{background:"none",border:"none",cursor:"pointer",padding:"13px 0",marginRight:24,color:tab===id?BRAND:"var(--color-text-secondary)",fontWeight:tab===id?700:400,fontSize:13,borderBottom:tab===id?`2.5px solid ${BRAND}`:"2.5px solid transparent",fontFamily:FONT,display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap",transition:"color 0.15s"}}>

      </div>

      {/* ── TAB CONTENT ── */}
      <div style={{padding:"1.5rem 2rem"}}>

        {/* MY INFORMATION TAB */}
        {tab==="info"&&(
          <>
            {/* Overall Information */}

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.25rem",flexWrap:"wrap",gap:8}}>
                <h3 style={{fontSize:12,fontWeight:800,color:BRAND,margin:0,textTransform:"uppercase",letterSpacing:1,display:"flex",alignItems:"center",gap:6}}>
                  <Icon name="id-badge-2" size={14}/>Overall Information
                </h3>
                {!profile&&(
                  <span style={{fontSize:11,background:"#FEF3CD",color:"#7A4F00",padding:"3px 12px",borderRadius:99,fontWeight:700}}>Profile not yet completed</span>
                )}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 32px"}}>
                <InfoCell label="Full Name" value={p.name}/>
                <InfoCell label="Email" value={p.email}/>
                <InfoCell label="Phone" value={p.phone}/>
                <InfoCell label="Social Links" value={p.social}/>
                <InfoCell label="Desired Position" value={p.position}/>
                <InfoCell label="Expected Salary" value={p.salary}/>
                <InfoCell label="Portfolio" value={p.portfolio} link/>
                <InfoCell label="CV / Resume" value={p.cvLink} link/>
              </div>
              {!profile&&(
                <div style={{marginTop:"1.25rem",background:BRAND_LIGHT,borderRadius:10,padding:"0.875rem 1rem",display:"flex",alignItems:"center",gap:12}}>
                  <Icon name="info-circle" size={18} style={{color:BRAND,flexShrink:0}}/>
                  <p style={{fontSize:13,color:BRAND,margin:0,flex:1}}>Complete your profile so employers can find you.</p>
                  <button onClick={openEdit} style={{padding:"7px 16px",borderRadius:8,background:BRAND,color:"#fff",border:"none",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:FONT,whiteSpace:"nowrap"}}>Complete now →</button>
                </div>
              )}
            </div>

            {/* Career Details */}
            <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16,padding:"1.5rem",marginBottom:"1.25rem"}}>
              <h3 style={{fontSize:12,fontWeight:800,color:BRAND,margin:"0 0 1.25rem",textTransform:"uppercase",letterSpacing:1,display:"flex",alignItems:"center",gap:6}}>
                <Icon name="briefcase" size={14}/>Career Details
              </h3>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 32px",marginBottom:"1.25rem"}}>
                <InfoCell label="Field" value={p.field}/>
                <InfoCell label="Years of Experience" value={p.years}/>
                <InfoCell label="Available to Start" value={p.onboard}/>
              </div>
              {[["Preferred Locations",p.locations||[],"blue"],["Industries",p.industries||[],"blue"]].map(([l,items,color])=>(
                <div key={l} style={{marginBottom:"1rem"}}>
                  <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 8px"}}>{l}</p>
                  {items.length>0
                    ?<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{items.map(i=><Badge key={i} color={color}>{i}</Badge>)}</div>
                    :<p style={{fontSize:13,color:"#bbb",margin:0,fontStyle:"italic"}}>Not provided</p>
                  }
                </div>
              ))}
              <div style={{marginBottom:"1rem"}}>
                <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 8px"}}>Languages</p>
                {(p.languages||[]).length>0
                  ?<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{(p.languages||[]).map(l=><span key={l.lang} style={{background:BRAND_LIGHT,color:BRAND,fontSize:12,fontWeight:600,padding:"4px 12px",borderRadius:99,display:"inline-flex",alignItems:"center",gap:4}}>{l.lang}<span style={{opacity:0.5,fontSize:10}}>· {l.level}</span></span>)}</div>
                  :<p style={{fontSize:13,color:"#bbb",margin:0,fontStyle:"italic"}}>Not provided</p>
                }
              </div>
              <div style={{marginBottom:p.intro?"1rem":"0"}}>
                <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 6px"}}>Key Skills</p>
                <p style={{fontSize:14,margin:0,lineHeight:1.6,color:p.skills?"var(--color-text-primary)":"#bbb",fontStyle:p.skills?"normal":"italic"}}>{p.skills||"Not provided"}</p>
              </div>
              {p.intro&&(
                <div style={{marginTop:"1rem"}}>
                  <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.8,margin:"0 0 8px"}}>Professional Summary</p>
                  <p style={{fontSize:14,lineHeight:1.8,margin:0}}>{p.intro}</p>
                </div>
              )}
            </div>

            {/* Sharing status */}
            {profile&&(!shareOn?(
              <div style={{background:"#FEF3CD",borderRadius:12,padding:"1rem 1.25rem",display:"flex",alignItems:"center",gap:12,border:"1px solid #F59E0B33"}}>
                <Icon name="eye-off" size={18} style={{color:"#7A4F00",flexShrink:0}}/>
                <div style={{flex:1}}>
                  <p style={{fontWeight:700,fontSize:13,color:"#7A4F00",margin:"0 0 2px"}}>Your profile is private</p>
                  <p style={{fontSize:12,color:"#92400E",margin:0}}>Enable "Share profile" to appear in the Talent Pool.</p>
                </div>
                <button onClick={()=>doToggleShare(true)} style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid #7A4F00",background:"none",color:"#7A4F00",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:FONT,whiteSpace:"nowrap"}}>Share now</button>
              </div>
            ):(
              <div style={{background:"#E6F4EA",borderRadius:12,padding:"1rem 1.25rem",display:"flex",alignItems:"center",gap:10,border:"1px solid #1A5C2A33"}}>
                <Icon name="eye" size={18} style={{color:"#1A5C2A",flexShrink:0}}/>
                <p style={{fontSize:13,color:"#1A5C2A",margin:0,fontWeight:600}}>Visible in the Talent Pool — contact details are hidden until you approve each request.</p>
              </div>
            ))}
          </>
        )}

        {/* APPLIED JOBS TAB */}
        {tab==="applied"&&(
          <div>
            <div style={{marginBottom:"1rem"}}>
              <h2 style={{fontSize:16,fontWeight:800,margin:"0 0 3px",color:BRAND}}>Applied Jobs</h2>
              <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>Track the jobs you have applied for and employer activity on your profile.</p>
            </div>
            {appliedJobs.length===0?(
              <div style={{textAlign:"center",padding:"3rem 1rem",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16}}>
                <Icon name="briefcase-off" size={36} style={{color:BRAND_DIM,display:"block",margin:"0 auto 12px"}}/>
                <p style={{fontWeight:700,fontSize:15,margin:"0 0 6px"}}>No applied jobs yet</p>
                <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>Your applications will appear here.</p>
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {appliedJobs.map(a=>(
                  <div key={a.id} style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:14,padding:"1rem 1.25rem"}}>
                    <div style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"flex-start"}}>
                      <div>
                        <p style={{fontWeight:800,fontSize:15,color:BRAND,margin:"0 0 4px"}}>{a.jobTitle}</p>
                        <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}>{a.company} · Applied {fmt(a.createdAt)}</p>
                      </div>
                      <Badge color={a.status==="rejected"?"red":a.status==="passed"?"green":(!a.status||a.status==="applied")?"blue":"amber"}>{a.status==="rejected"?"Rejected":a.status==="passed"?"Passed":(!a.status||a.status==="applied")?"Applied":"Processing"}</Badge>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* CONTACT REQUESTS TAB */}
        {tab==="requests"&&(
          <div>
            <div style={{marginBottom:"1rem"}}>
              <h2 style={{fontSize:16,fontWeight:800,margin:"0 0 3px",color:BRAND}}>Contact Requests</h2>
              <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>
                {requests.length} request{requests.length!==1?"s":""}{pendingCount>0?` · ${pendingCount} pending`:""}</p>
            </div>
            {requests.length===0?(
              <div style={{textAlign:"center",padding:"3rem 1rem",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16}}>
                <Icon name="mail-off" size={36} style={{color:BRAND_DIM,display:"block",margin:"0 auto 12px"}}/>
                <p style={{fontWeight:700,fontSize:15,margin:"0 0 6px"}}>No contact requests yet</p>
                <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:0}}>Share your profile to get discovered by employers</p>
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {requests.map(r=>(
                  <div key={r.id} onClick={()=>setSelReq(r)} style={{background:"var(--color-background-primary)",border:`1px solid ${r.status==="pending"?BRAND+"44":"var(--color-border-tertiary)"}`,borderRadius:14,padding:"1rem 1.25rem",cursor:"pointer",display:"flex",alignItems:"center",gap:14,boxShadow:r.status==="pending"?"0 2px 10px "+BRAND+"14":"none"}}>
                    <div style={{width:44,height:44,borderRadius:10,background:r.status==="pending"?BRAND_LIGHT:"var(--color-background-secondary)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:r.status==="pending"?`1px solid ${BRAND}22`:"0.5px solid var(--color-border-tertiary)"}}>
                      <Icon name="building" size={20} style={{color:r.status==="pending"?BRAND:"var(--color-text-secondary)"}}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                        <p style={{fontWeight:800,fontSize:15,margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.company}</p>
                        {r.status==="pending"&&<span style={{width:7,height:7,borderRadius:"50%",background:"#FF6B6B",flexShrink:0}}/>}
                      </div>
                      <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:"0 0 2px"}}>{r.title}</p>
                      <p style={{fontSize:11,color:"var(--color-text-secondary)",margin:0}}>{fmt(r.createdAt)}{r.salary?` · ${r.salary}`:""}</p>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
                      <Badge color={r.status==="pending"?"amber":r.status==="accepted"?"green":"red"}>
                        {r.status==="pending"?"Awaiting reply":r.status==="accepted"?"Accepted":"Declined"}
                      </Badge>
                      <Icon name="chevron-right" size={14} style={{color:"var(--color-text-secondary)"}}/>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── TALENT POOL ───────────────────────────────────────────────────────────────
function PublicPage({onRequest,session,company}){
  const [candidates,setCandidates]=useState([]);
  const [filter,setFilter]=useState({location:"",industry:"",years:"",field:""});
  const [selected,setSelected]=useState(null);
  const [showContactForm,setShowContactForm]=useState(false);
  const [reqForm,setReqForm]=useState({company:company?.name||"",contactName:"",contactEmail:session?.email||"",contactPhone:"",title:"",jd:"",salary:"",benefits:""});
  const [reqErrors,setReqErrors]=useState({});
  const [reqSent,setReqSent]=useState(false);
  const rfset=(k,v)=>setReqForm(f=>({...f,[k]:v}));

  useEffect(()=>{ld(SK.CANDIDATES,true).then(d=>setCandidates((d||[]).filter(c=>c.consentPool&&c.shareActive)));},[]);

  const filtered=candidates.filter(c=>
    (!filter.location||c.locations?.includes(filter.location))&&
    (!filter.industry||(c.industries||[]).includes(filter.industry))&&
    (!filter.years||c.years===filter.years)&&
    (!filter.field||c.field===filter.field)
  );

  const openCandidate=(c)=>{
    setSelected(c);setShowContactForm(false);
    setReqSent(false);setReqForm({company:company?.name||"",contactName:"",contactEmail:session?.email||"",contactPhone:"",title:"",jd:"",salary:"",benefits:""});setReqErrors({});
  };

  const sendRequest=async()=>{
    const e={};
    if(!reqForm.company.trim())e.company="Required";
    if(!reqForm.contactName.trim())e.contactName="Required";
    if(!reqForm.contactEmail.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/))e.contactEmail="Invalid email";
    if(!reqForm.title.trim())e.title="Required";
    if(!reqForm.jd.trim())e.jd="Required";
    if(Object.keys(e).length){setReqErrors(e);return;}
    const req={id:gid(),candidateCode:selected.code,employerEmail:session?.email||null,companyCode:session?.code||null,...reqForm,createdAt:new Date().toISOString(),status:"pending"};
    const existing=(await ld(SK.REQUESTS,true))||[];
    await sd(SK.REQUESTS,[...existing,req],true);
    const notifs=(await ld(SK.NOTIFS,true))||[];
    notifs.push({id:gid(),type:"contact_request",to:selected.code,company:reqForm.company,title:reqForm.title,message:`${reqForm.company} has sent you a contact request for the role of ${reqForm.title}`,detail:req,createdAt:new Date().toISOString(),read:false});
    await sd(SK.NOTIFS,notifs,true);
    if(selected.email){
      sendAutomationEmail(
        selected.email,
        `${reqForm.company} wants to connect with you about ${reqForm.title}`,
        `Hi ${selected.name||"there"},\n\n${reqForm.company} found your profile in the pairup Talent Pool and would like to connect with you about the ${reqForm.title} role.\n\n${reqForm.jd}\n\n${reqForm.salary?`Salary range: ${reqForm.salary}\n`:""}${reqForm.benefits?`Benefits: ${reqForm.benefits}\n`:""}\nContact: ${reqForm.contactName} (${reqForm.contactEmail}${reqForm.contactPhone?`, ${reqForm.contactPhone}`:""})\n\nLog in to pairup to review and respond to this request.\n\nBest regards,\n${reqForm.company}`
      );
    }
    setReqSent(true);onRequest();
  };

  // Filter bar helper - now handled by FilterPills component

  const TABLE_COLS=["Code","Position","Field","Industry","Location","Experience","Languages","Skills","Salary","Summary",""];

  return(
    <div style={{maxWidth:1200,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      <h1 style={{fontSize:26,fontWeight:800,marginBottom:4}}>Talent Pool</h1>
      <p style={{color:"var(--color-text-secondary)",fontSize:13,marginBottom:"1.5rem"}}>Browse candidates who are open to new opportunities</p>

      {/* Filters */}
      <Card style={{marginBottom:"1.5rem"}}>
        <SH icon="filter" title="Filters"/>
        <FilterPills title="Location" options={LOCATIONS} value={filter.location} onChange={v=>setFilter(f=>({...f,location:v}))} inline={4}/>
        <FilterPills title="Field" options={FIELDS} value={filter.field} onChange={v=>setFilter(f=>({...f,field:v}))} inline={6}/>
        <FilterPills title="Industry" options={INDUSTRIES} value={filter.industry} onChange={v=>setFilter(f=>({...f,industry:v}))} inline={5}/>
        <FilterPills title="Experience" options={YEARS_OPTS} value={filter.years} onChange={v=>setFilter(f=>({...f,years:v}))} inline={6}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4,paddingTop:8,borderTop:"0.5px solid var(--color-border-tertiary)"}}>
          <p style={{fontSize:12,color:"var(--color-text-secondary)",margin:0}}><strong>{filtered.length}</strong> candidate{filtered.length!==1?"s":""} found</p>
          <button onClick={()=>setFilter({location:"",industry:"",years:"",field:""})} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:BRAND,fontFamily:FONT,fontWeight:600}}>Clear all filters</button>
        </div>
      </Card>

      {/* Table */}
      <div style={{overflowX:"auto",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:16}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,fontFamily:FONT,minWidth:900}}>
          <thead>
            <tr style={{background:BRAND}}>
              {TABLE_COLS.map(h=><th key={h} style={{textAlign:"left",padding:"11px 14px",fontWeight:700,fontSize:11,color:"rgba(255,255,255,0.9)",whiteSpace:"nowrap",textTransform:"uppercase",letterSpacing:0.6}}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {filtered.map((c,i)=>(
              <tr key={c.code} style={{borderBottom:"0.5px solid var(--color-border-tertiary)",background:i%2===0?"var(--color-background-primary)":"var(--color-background-secondary)",transition:"background 0.1s"}} onMouseEnter={e=>e.currentTarget.style.background=BRAND_LIGHT} onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"var(--color-background-primary)":"var(--color-background-secondary)"}>
                <td style={{padding:"12px 14px",fontFamily:"monospace",fontWeight:700,fontSize:12,color:BRAND,whiteSpace:"nowrap"}}>{c.code}</td>
                <td style={{padding:"12px 14px",fontWeight:600,minWidth:140}}>{c.position}</td>
                <td style={{padding:"12px 14px",minWidth:100}}>{c.field&&<Badge color="purple">{c.field}</Badge>}</td>
                <td style={{padding:"12px 14px",minWidth:130,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--color-text-secondary)"}}>{(c.industries||[]).join(", ")}</td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap"}}><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(c.locations||[]).map(l=><Badge key={l} color="blue">{l}</Badge>)}</div></td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap",color:"var(--color-text-secondary)"}}>{c.years}</td>
                <td style={{padding:"12px 14px",minWidth:120}}><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{(c.languages||[]).map(l=><span key={l.lang} style={{background:BRAND_LIGHT,color:BRAND,fontSize:10,fontWeight:600,padding:"2px 7px",borderRadius:99,whiteSpace:"nowrap"}}>{l.lang}{l.level?` · ${l.level}`:""}</span>)}</div></td>
                <td style={{padding:"12px 14px",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--color-text-secondary)"}}>{c.skills}</td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap",color:BRAND,fontWeight:600}}>{c.salary||"—"}</td>
                <td style={{padding:"12px 14px",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--color-text-secondary)",fontSize:12}}>{c.intro||"—"}</td>
                <td style={{padding:"12px 14px",whiteSpace:"nowrap"}}>
                  <Btn onClick={()=>openCandidate(c)} style={{fontSize:11,padding:"5px 12px"}}>View</Btn>
                </td>
              </tr>
            ))}
            {filtered.length===0&&<tr><td colSpan={TABLE_COLS.length} style={{padding:"3rem",textAlign:"center",color:"var(--color-text-secondary)"}}>No candidates match your filters</td></tr>}
          </tbody>
        </table>
      </div>

      {/* CANDIDATE DETAIL MODAL */}
      {selected&&!showContactForm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,30,80,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:"1rem"}}>
          {
