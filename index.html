const { useState, useEffect, useCallback, useRef } = React;

const BRAND="#002C76",BRAND_LIGHT="#E8EDF7",BRAND_MID="#1A3F8F",BRAND_DIM="#6B85B8";
const FONT="'Noto Sans Khmer',sans-serif";
// Bump this string with every meaningful update. Visible in the Admin page
// footer so it's easy to confirm a deployment is actually running the latest
// code (vs. a stale cached/old file on hosting).
const APP_BUILD="2026-08-21-fix-external-links";
const SK={CANDIDATES:"pairup_candidates",JOBS:"pairup_jobs",REQUESTS:"pairup_requests",NOTIFS:"pairup_notifs",APPLICATIONS:"pairup_applications",VIEWED_REQUESTS:"pairup_viewed_requests",COUNTER:"pairup_counter",ACCOUNTS_JS:"pairup_accounts_jobseeker",ACCOUNTS_EMP:"pairup_accounts_employer",COMPANIES:"pairup_companies",SESSION:"pairup_session"};
const GSHEET_URL_KEY="pairup_gsheet_webapp_url";
// Deployed Apps Script Web App URL — baked in so every visitor (any browser,
// any Google profile, any device) automatically uses the same Google Sheet
// backend for sign up / log in / data sync, with no per-browser setup needed.
// The Admin sync settings (cloud icon, #admin) can still override this locally
// if you ever redeploy to a new URL, without needing to edit this file.
const DEFAULT_GSHEET_URL="https://script.google.com/macros/s/AKfycbz3uWP7XpRMojsfL2K_vsL-Stmz0VcTeAcXzaUNeE_z-Gr27UhxAvbFFaqrYh9vjt2Q6Q/exec";
async function getSheetUrl(){
  const override=(await ld(GSHEET_URL_KEY,true))||"";
  return override||DEFAULT_GSHEET_URL;
}
const COMPANY_SIZES=["1–10","11–50","51–200","201–500","501–1000","1000+"];

const INDUSTRIES=["Information Technology","Marketing & Communications","Finance & Banking","Retail & FMCG","Logistics & Supply Chain","Healthcare & Pharma","Education & Training","Manufacturing & Engineering","Real Estate","Game","Other"];
const FIELDS=["Marketing","Human Resources","Finance","Information Technology","Sales","Operations","Legal","Product","Design","Engineering","Customer Success","Data & Analytics","Content & Creative","Other"];
const LOCATIONS=["Ho Chi Minh City","Hanoi","Da Nang"];
const WORKING_MODELS=["Onsite","Remote","Hybrid"];
const CONTRACT_TYPES=["Full-time","Part-time","Freelancer"];
const LANG_OPTS=["English","Vietnamese","Japanese","Korean","Chinese","French","German","Spanish","Thai","Other"];
const PROFICIENCY=["Native","Fluent","Advanced","Intermediate","Basic"];
const YEARS_OPTS=["Fresher (0–1 yr)","1–2 years","3–5 years","5–7 years","7–10 years","10+ years"];
const SALARY_OPTS=["Under 10M VND","10–15M VND","15–20M VND","20–30M VND","30–50M VND","50M+ VND","Negotiable"];
const ONBOARD_OPTS=["Immediately","1 week","2 weeks","1 month","More than 1 month"];

// Keys marked "shared" (3rd arg = true) are the platform's real data — candidate
// profiles, jobs, contact requests, applications, companies, notifications.
// These must be visible to EVERY visitor regardless of browser/device, so they
// are mirrored to named tabs in the same Google Sheet used for auth. Local
// storage is still written as an instant-response cache / offline fallback,
// but the Sheet (via Apps Script) is the source of truth whenever it's reachable.
const SHEET_MAP={
  [SK.CANDIDATES]:{sheet:"Job Seekers",key:"code"},
  [SK.JOBS]:{sheet:"Jobs",key:"code"},
  [SK.REQUESTS]:{sheet:"Requests",key:"id"},
  [SK.APPLICATIONS]:{sheet:"Applied",key:"id"},
  [SK.COMPANIES]:{sheet:"Companies",key:"code"},
  [SK.NOTIFS]:{sheet:"Notifications",key:"id"},
};

async function sd(k,v,s=false){
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) { console.error(e); }
  if(s&&SHEET_MAP[k]){
    // Fire-and-forget: don't make the UI wait on a network round-trip for every save.
    sheetReplaceAll(SHEET_MAP[k].sheet,Array.isArray(v)?v:[],SHEET_MAP[k].key)
      .catch(e=>console.error(`Sheet sync failed for "${SHEET_MAP[k].sheet}"`,e));
  }
}
async function ld(k,s=false,fresh=false){
  if(s&&SHEET_MAP[k]){
    const remote=await sheetList(SHEET_MAP[k].sheet,fresh);
    if(remote!==null){
      try{ localStorage.setItem(k,JSON.stringify(remote)); }catch(e){}
      return remote;
    }
    console.warn(`Could not reach Google Sheet for "${SHEET_MAP[k].sheet}" — using local cache.`);
  }
  try { const v=localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; }
}
// CRITICAL: any code that reads a shared table with the intent of writing it
// back (add/update/delete one item then save the whole array) must use this
// instead of `(await ld(key,true))||[]`. A plain `||[]` silently treats "the
// Sheet was unreachable AND there's no local cache" as "the table is empty" —
// then the very next save would overwrite the real Google Sheet data with an
// empty array, permanently erasing everyone else's records. This helper makes
// that failure explicit and aborts the write instead. It also always bypasses
// the short-lived read cache (bypass="fresh"), since writing back a value that
// was cached even a couple seconds ago could silently undo a very recent change
// made by someone else.
async function ldForWrite(key){
  const v=await ld(key,true,true);
  if(v===null){
    alert("Could not reach the shared data (Google Sheet). Nothing was saved, to avoid erasing existing data — please check your connection and try again.");
    return null;
  }
  return v;
}
// Preferred way to add/update ONE item in a shared table (a job, a candidate
// profile, a request...). Updates the local cache immediately (so the UI feels
// instant) and fires a single-row "upsert" to the Sheet in the background — one
// network round trip total, versus the old read-the-whole-table-then-write-it-
// all-back pattern (ldForWrite + sd(...,true)), which cost two round trips and
// rewrote every row just to change one. Falls back to that older safer-but-
// slower pattern automatically wherever a change genuinely touches many rows at
// once (see the "apply benefits to all jobs" bulk-edit option, for example).
async function saveOne(skKey,item,keyField){
  try{
    const raw=localStorage.getItem(skKey);
    const arr=raw?JSON.parse(raw):[];
    const idx=arr.findIndex(x=>x[keyField]===item[keyField]);
    if(idx>=0)arr[idx]=item; else arr.push(item);
    localStorage.setItem(skKey,JSON.stringify(arr));
  }catch(e){}
  const map=SHEET_MAP[skKey];
  if(!map)return true;
  const ok=await sheetUpsert(map.sheet,item,keyField);
  if(!ok) console.warn(`saveOne: upsert failed for "${map.sheet}" — local cache still updated, will retry to sync on next successful read/write.`);
  return ok;
}
// Preferred way to remove ONE item from a shared table. Same trade-off as saveOne.
async function deleteOne(skKey,keyField,keyValue){
  try{
    const raw=localStorage.getItem(skKey);
    const arr=raw?JSON.parse(raw):[];
    localStorage.setItem(skKey,JSON.stringify(arr.filter(x=>x[keyField]!==keyValue)));
  }catch(e){}
  const map=SHEET_MAP[skKey];
  if(!map)return true;
  const ok=await sheetDeleteRow(map.sheet,keyField,keyValue);
  if(!ok) console.warn(`deleteOne: delete failed for "${map.sheet}" — local cache still updated, will retry to sync on next successful read/write.`);
  return ok;
}
async function nextCode(){const n=(await ld(SK.COUNTER,true))||0;const nx=n+1;await sd(SK.COUNTER,nx,true);return`#PU${String(nx).padStart(4,"0")}`;}
function gid(){return Math.random().toString(36).substring(2,10).toUpperCase();}
function gjid(){return"JD"+Math.random().toString(36).substring(2,8).toUpperCase();}
function fmt(iso){return iso?new Date(iso).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";}
function stripHtml(html){if(!html)return"";return html.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();}
// Coerces a field to an array, tolerating legacy records saved before a field
// became multi-select (e.g. workingModel used to be a single string like
// "Onsite" before candidates/jobs could pick several). Reading such a record
// with plain `(x||[]).join(...)` works fine when x is already an array, but
// crashes with "x.join is not a function" when x is still an old plain
// string — which took down the whole page (blank screen, no error boundary)
// for Talent Pool/Jobs whenever an older record was in the list.
function asArr(v){return Array.isArray(v)?v:(v?[v]:[]);}
// Company websites are often saved without a scheme (e.g. "viralhire.net").
// Used bare as an <a href>, a browser treats that as a RELATIVE path on the
// CURRENT site rather than an external address — e.g. clicking it from
// pairup.site would navigate to "pairup.site/viralhire.net" (a 404) instead
// of actually opening viralhire.net in a new tab. Normalizing at render time
// fixes this for both old and new records without needing a data migration.
function normalizeUrl(url){
  if(!url)return "";
  const trimmed=String(url).trim();
  if(!trimmed)return "";
  return /^https?:\/\//i.test(trimmed)?trimmed:"https://"+trimmed;
}

// ── URL routing ─────────────────────────────────────────────────────────
// Reflects the current section in the address bar (hash-based, since this is
// a static single HTML file on GitHub Pages with no server-side routing to
// fall unknown paths back to index.html — a hash never gets sent to the
// server at all, so it always just re-loads this same file and JS decides
// what to show). Copying the URL and opening it in a new tab, or bookmarking
// it, now lands directly on that section instead of always the default page.
const PAGE_ROUTES={candidate:"profile",public:"talent-pool",jobs:"jobs",employer:"employer",notifications:"notifications"};
const ROUTE_TO_PAGE=Object.fromEntries(Object.entries(PAGE_ROUTES).map(([k,v])=>[v,k]));
const CANDIDATE_SUBTABS={info:"",requests:"requests",applied:"applied"};
const EMPLOYER_SUBTABS={employer:"",requests:"requests",candidates:"candidates",company:"company"};
const ADMIN_SUBTABS={dashboard:"",candidates:"candidates",jobs:"jobs",companies:"companies"};

// True for "#admin", "#/admin", and "#/admin/..." — kept liberal so an old
// bookmarked/shared "#admin" link (the original scheme) still works.
function isAdminHash(hash){ return /^#\/?admin(\/|$)/.test(hash||""); }

function parseRoute(){
  if(typeof window==="undefined")return{page:null,sub:""};
  const hash=window.location.hash||"";
  if(isAdminHash(hash)){
    const rest=hash.replace(/^#\/?admin\/?/,"");
    return{page:"admin",sub:rest?decodeURIComponent(rest):""};
  }
  const raw=hash.replace(/^#\/?/,"");
  const slashIdx=raw.indexOf("/");
  const first=slashIdx===-1?raw:raw.slice(0,slashIdx);
  const restRaw=slashIdx===-1?"":raw.slice(slashIdx+1);
  return{page:ROUTE_TO_PAGE[first]||null,sub:restRaw?decodeURIComponent(restRaw):""};
}

function buildHash(pageKey,sub){
  // Candidate codes look like "#PU0001" — encode the sub segment so a literal
  // "#" (or any other special character) inside it can't be misread as
  // starting a second fragment or otherwise mangling the URL.
  if(pageKey==="admin")return "#/admin"+(sub?"/"+encodeURIComponent(sub):"");
  const base=PAGE_ROUTES[pageKey];
  return base?("#/"+base+(sub?"/"+encodeURIComponent(sub):"")):null;
}

function applyRoute(pageKey,sub,replace){
  if(typeof window==="undefined")return;
  const hash=buildHash(pageKey,sub);
  if(!hash||window.location.hash===hash)return;
  const url=window.location.pathname+window.location.search+hash;
  if(replace)window.history.replaceState(null,"",url);
  else window.history.pushState(null,"",url);
}
const pushRoute=(pageKey,sub="")=>applyRoute(pageKey,sub,false);
const replaceRoute=(pageKey,sub="")=>applyRoute(pageKey,sub,true);

// ── GOOGLE SHEETS SYNC ────────────────────────────────────────────────────────
// Static pages can't write to a private Google Sheet directly; a small Google Apps
// Script deployed as a Web App acts as the bridge. Its deployed URL is baked in
// above (DEFAULT_GSHEET_URL) so this works for every visitor automatically — no
// per-browser setup needed. Candidate profiles, jobs, contact requests,
// applications, companies, and notifications are all mirrored two-way ("list" to
// read, "replace" to write) to their own tab (see SHEET_MAP above), and sign up /
// log in read/write a "Users" tab (see sheetSignup/sheetLogin below). The sync
// settings (cloud icon, #admin) can set a local override if you ever redeploy to
// a new URL.
// Several components often ask for the same sheet within moments of each other
// (e.g. every page load fires 3-4 "list" calls). Without this, each one would
// independently hit the network, which is what was making everything feel slow.
// This dedupes concurrent requests for the same sheet into a single round-trip,
// and keeps that result fresh for a few seconds so a burst of reads (e.g. a page
// with several components mounting at once) only costs one network call.
const SHEET_CACHE_TTL_MS=12000;
const _sheetCache={}; // sheetName -> {ts, promise}
async function sheetList(sheetName,fresh=false){
  const now=Date.now();
  if(!fresh){
    const cached=_sheetCache[sheetName];
    if(cached&&(now-cached.ts)<SHEET_CACHE_TTL_MS) return cached.promise;
  }
  const promise=(async()=>{
    try{
      const url=await getSheetUrl();
      if(!url) return null;
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"list",sheet:sheetName})});
      const text=await res.text();
      let data; try{ data=JSON.parse(text); }catch(e){ console.error(`Sheet list "${sheetName}": non-JSON response`,text.slice(0,300)); return null; }
      // Only trust an explicit rows array. If the deployed Apps Script is an older
      // version that doesn't understand action:"list" yet, it will still often
      // reply {success:true} with no "rows" field — treating that as "0 rows" would
      // silently wipe out real data on the next save, so we treat it as a failure
      // (falls back to the local cache) instead.
      if(!data||data.success===false||!Array.isArray(data.rows)) return null;
      return data.rows;
    }catch(e){ console.error(`Sheet list failed for "${sheetName}"`,e); return null; }
  })();
  _sheetCache[sheetName]={ts:now,promise};
  return promise;
}
async function sheetReplaceAll(sheetName,rows,keyField){
  try{
    const url=await getSheetUrl();
    if(!url) return false;
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"replace",sheet:sheetName,data:rows,keyField})});
    const text=await res.text();
    let data; try{ data=JSON.parse(text); }catch(e){ return false; }
    delete _sheetCache[sheetName]; // this sheet just changed — next read must be fresh
    return !!(data&&data.success);
  }catch(e){ console.error(`Sheet replace failed for "${sheetName}"`,e); return false; }
}

// Fast path for "add or update ONE item" (save a job, a profile, a request...).
// Unlike sd(SK.X, wholeArray, true), this needs no prior read — the server finds
// and overwrites (or appends) the matching row itself — so it's a single round
// trip instead of read-then-rewrite-everything, and only touches one row instead
// of the whole sheet.
async function sheetUpsert(sheetName,data,keyField){
  try{
    const url=await getSheetUrl();
    if(!url) return false;
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"upsert",sheet:sheetName,data,keyField})});
    const text=await res.text();
    let result; try{ result=JSON.parse(text); }catch(e){ return false; }
    delete _sheetCache[sheetName];
    return !!(result&&result.success);
  }catch(e){ console.error(`Sheet upsert failed for "${sheetName}"`,e); return false; }
}
// Fast path for "remove ONE item" (delete a job, a candidate...). Same idea as
// sheetUpsert — no prior read needed, only the matching row is touched.
async function sheetDeleteRow(sheetName,keyField,keyValue){
  try{
    const url=await getSheetUrl();
    if(!url) return false;
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete_row",sheet:sheetName,keyField,keyValue})});
    const text=await res.text();
    let result; try{ result=JSON.parse(text); }catch(e){ return false; }
    delete _sheetCache[sheetName];
    return !!(result&&result.success);
  }catch(e){ console.error(`Sheet delete_row failed for "${sheetName}"`,e); return false; }
}

// Batches several "list" reads into ONE HTTP round-trip. Each parallel-but-separate
// ld() call still pays Apps Script's own per-request startup cost even when fired
// concurrently — this cuts a page that needs e.g. Jobs+Requests+Applied+Job Seekers
// down to a single request instead of four. Individual sheetList() calls for the
// same sheets (from elsewhere on the page) transparently share this same result via
// the existing _sheetCache.
async function sheetListMulti(sheetNames,forceFresh=false){
  const now=Date.now();
  const needed=forceFresh?sheetNames.slice():sheetNames.filter(name=>{
    const cached=_sheetCache[name];
    return !(cached&&(now-cached.ts)<SHEET_CACHE_TTL_MS);
  });
  if(needed.length){
    const batchPromise=(async()=>{
      try{
        const url=await getSheetUrl();
        if(!url) return null;
        const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"list_multi",sheets:needed})});
        const text=await res.text();
        let data; try{ data=JSON.parse(text); }catch(e){ console.error("list_multi non-JSON response",text.slice(0,300)); return null; }
        if(!data||data.success===false||!data.data) return null;
        return data.data; // {sheetName: rows}
      }catch(e){ console.error("list_multi failed",e); return null; }
    })();
    needed.forEach(name=>{
      _sheetCache[name]={ts:now,promise:batchPromise.then(d=>(d&&Array.isArray(d[name]))?d[name]:null)};
    });
  }
  const result={};
  await Promise.all(sheetNames.map(async name=>{ result[name]=await sheetList(name); }));
  return result;
}

// Read several SK.* keys at once (mix of shared/synced and plain local keys),
// using sheetListMulti under the hood for anything that needs a network fetch.
// Returns a plain object keyed by whatever you passed in, e.g.
// const {jobs,requests}=await ldMany({jobs:SK.JOBS,requests:SK.REQUESTS});
async function ldMany(keyMap){
  const sharedSheets=[...new Set(Object.values(keyMap).filter(k=>SHEET_MAP[k]).map(k=>SHEET_MAP[k].sheet))];
  if(sharedSheets.length) await sheetListMulti(sharedSheets);
  const result={};
  await Promise.all(Object.entries(keyMap).map(async([name,key])=>{ result[name]=await ld(key,true); }));
  return result;
}

async function sendAutomationEmail(to,subject,body){
  try{
    const url=await getSheetUrl();
    if(!url||!to) return false;
    await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"send_email",to,subject,body})});
    return true;
  }catch(e){ console.error("Automation email failed",e); return false; }
}

function updateLocalSharedItem(skKey,item,keyField){
  try{
    const raw=localStorage.getItem(skKey);
    const rows=raw?JSON.parse(raw):[];
    const index=rows.findIndex(row=>row[keyField]===item[keyField]);
    if(index>=0)rows[index]=item;else rows.push(item);
    localStorage.setItem(skKey,JSON.stringify(rows));
  }catch(e){}
  const map=SHEET_MAP[skKey];
  if(map)delete _sheetCache[map.sheet];
}

async function postCompositeAction(action,payload){
  const url=await getSheetUrl();
  if(!url)return {supported:true,success:false,error:"not_configured"};
  try{
    const response=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload})});
    const text=await response.text();
    let result;
    try{result=JSON.parse(text);}catch(e){return {supported:false,success:false,error:"bad_response"};}
    if(!result||typeof result.success!=="boolean")return {supported:false,success:false,error:"bad_response"};
    if(result.error==="unknown_action")return {supported:false,success:false,error:"unknown_action"};
    return {supported:true,...result};
  }catch(e){
    console.error(`${action} failed`,e);
    return {supported:true,success:false,error:"network"};
  }
}

async function submitContactRequest(request,notification,email){
  let composite=await postCompositeAction("submit_contact_request",{request,notification,email});
  if(composite.supported&&composite.success&&typeof composite.emailSent!=="boolean")composite={supported:false,success:false,error:"bad_response"};
  if(composite.supported){
    if(composite.success){
      updateLocalSharedItem(SK.REQUESTS,request,"id");
      updateLocalSharedItem(SK.NOTIFS,notification,"id");
    }
    return composite;
  }
  const [requestSaved,notificationSaved]=await Promise.all([saveOne(SK.REQUESTS,request,"id"),saveOne(SK.NOTIFS,notification,"id")]);
  if(!requestSaved)return {success:false,error:"request_save_failed",fallback:true};
  if(!notificationSaved)return {success:false,error:"notification_save_failed",fallback:true};
  const emailSent=email?.to?await sendAutomationEmail(email.to,email.subject,email.body):false;
  return {success:true,emailSent,fallback:true};
}

function applicationMatches(row,application){
  const rowEmail=String(row?.email||"").trim().toLowerCase();
  const applicationEmail=String(application.email||"").trim().toLowerCase();
  return row?.jobCode===application.jobCode&&(row?.candidateCode===application.candidateCode||(applicationEmail&&rowEmail===applicationEmail));
}

async function submitApplication(application,notification,hasKnownDuplicate=false){
  let composite=await postCompositeAction("submit_application",{application,notification});
  if(composite.supported&&composite.success&&typeof composite.duplicate!=="boolean")composite={supported:false,success:false,error:"bad_response"};
  if(composite.supported){
    if(composite.success&&!composite.duplicate){
      updateLocalSharedItem(SK.APPLICATIONS,application,"id");
      updateLocalSharedItem(SK.NOTIFS,notification,"id");
    }
    return composite;
  }
  if(hasKnownDuplicate)return {success:true,duplicate:true,fallback:true};
  let localApplications=[];
  try{localApplications=JSON.parse(localStorage.getItem(SK.APPLICATIONS)||"[]");}catch(e){}
  if(localApplications.some(row=>applicationMatches(row,application)))return {success:true,duplicate:true,fallback:true};
  const freshApplications=await ld(SK.APPLICATIONS,true,true);
  if(freshApplications===null)return {success:false,error:"duplicate_check_failed",fallback:true};
  if(freshApplications.some(row=>applicationMatches(row,application)))return {success:true,duplicate:true,fallback:true};
  const [applicationSaved,notificationSaved]=await Promise.all([saveOne(SK.APPLICATIONS,application,"id"),saveOne(SK.NOTIFS,notification,"id")]);
  if(!applicationSaved)return {success:false,error:"application_save_failed",fallback:true};
  if(!notificationSaved)return {success:false,error:"notification_save_failed",fallback:true};
  return {success:true,duplicate:false,fallback:true};
}

async function trackWebsiteVisit(){
  try{
    const url=await getSheetUrl();
    if(!url) return;

// Lightweight badge-count check: asks the backend to count unread rows
// server-side (2 columns only) instead of downloading the entire, ever-growing
// Notifications table client-side just to count a few. Falls back to the old
// full-table read if an older Apps Script deployment doesn't recognize the
// action yet, so this never breaks the badge on an un-redeployed backend.
async function fetchNotifUnreadCount(matchValues){
  const composite=await postCompositeAction("notif_unread_count",{matchValues});
  if(composite.supported) return composite.success?(composite.count||0):null;
  const all=await ld(SK.NOTIFS,true);
  if(all===null) return null;
  const matchSet=new Set(matchValues.map(v=>String(v||"").toLowerCase()));
  return all.filter(x=>matchSet.has(String(x.to||"").toLowerCase())&&!x.read).length;
}

// Marks a set of notification ids as read with a single-column server write,
// instead of rewriting the whole Notifications table (every user's rows) just
// to flip a few flags. Patches the local cache the same way. Falls back to the
// old full-table rewrite only if the backend doesn't support the fast path yet.
async function markNotifsRead(ids,allNotifs){
  if(!ids.length) return;
  const composite=await postCompositeAction("mark_notifs_read",{ids});
  if(composite.supported){
    if(composite.success){
      try{
        const idSet=new Set(ids);
        const patched=(allNotifs||[]).map(n=>idSet.has(n.id)?{...n,read:true}:n);
        localStorage.setItem(SK.NOTIFS,JSON.stringify(patched));
      }catch(e){}
      const map=SHEET_MAP[SK.NOTIFS];
      if(map)delete _sheetCache[map.sheet];
    }
    return;
  }
  const idSet=new Set(ids);
  const updated=(allNotifs||[]).map(n=>idSet.has(n.id)?{...n,read:true}:n);
  await sd(SK.NOTIFS,updated,true);
}

// Lightweight notifications list: asks the backend to filter by "to" server-
// side (returning only this visitor's own rows) instead of downloading the
// entire, ever-growing Notifications table and filtering client-side. Falls
// back to the old full-table read if an older Apps Script deployment doesn't
// recognize the action yet.
async function fetchNotifList(matchValues){
  const composite=await postCompositeAction("notif_list",{matchValues});
  if(composite.supported) return composite.success?(composite.rows||[]):null;
  const all=await ld(SK.NOTIFS,true);
  if(all===null) return null;
  const matchSet=new Set(matchValues.map(v=>String(v||"").toLowerCase()));
  return all.filter(x=>matchSet.has(String(x.to||"").toLowerCase()));
}

// ── PASSWORD HASHING ──────────────────────────────────────────────────────────
// Uses bcrypt (via CDN) as specified in the auth flow. Falls back to a salted
// SHA-256 digest if bcrypt failed to load (e.g. offline), so signup/login still
// work — clearly namespaced so verifyPassword can tell which scheme was used.
// Note: since this is a fully static, client-side app there is no server to keep
// a signing/pepper secret on — this is demo-grade, not a production auth system.
async function hashPassword(pw){
  try{
    if(window.dcodeIO&&window.dcodeIO.bcrypt){
      return window.dcodeIO.bcrypt.hashSync(pw,10);
    }
  }catch(e){}
  const enc=new TextEncoder().encode("pairup-salt::"+pw);
  const buf=await crypto.subtle.digest("SHA-256",enc);
  const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  return "sha256:"+hex;
}
async function verifyPassword(pw,hash){
  if(!hash)return false;
  if(hash.startsWith("sha256:")){
    const enc=new TextEncoder().encode("pairup-salt::"+pw);
    const buf=await crypto.subtle.digest("SHA-256",enc);
    const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    return "sha256:"+hex===hash;
  }
  try{
    if(window.dcodeIO&&window.dcodeIO.bcrypt) return window.dcodeIO.bcrypt.compareSync(pw,hash);
  }catch(e){}
  return false;
}
function isStrongPassword(pw){
  return !!pw && pw.length>=8 && /[A-Za-z]/.test(pw) && /[0-9]/.test(pw);
}

const GLOBAL_LOADING_DELAY_MS=1000;
const GLOBAL_LOADING_MIN_MS=400;
const GLOBAL_LOADING_LOCAL_MS=450;
const GLOBAL_LOADING_REQUEST_GRACE_MS=180;
const GLOBAL_LOADING_MAX_MS=30000;
const GLOBAL_LOADING_OPERATION_START_EVENT="pairup:loading-operation-start";
const GLOBAL_LOADING_OPERATION_END_EVENT="pairup:loading-operation-end";

function waitForReactCommit(){
  return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
}

function startGlobalLoadingOperation(){
  window.dispatchEvent(new Event(GLOBAL_LOADING_OPERATION_START_EVENT));
}

function finishGlobalLoadingOperation(){
  window.dispatchEvent(new Event(GLOBAL_LOADING_OPERATION_END_EVENT));
}

function GlobalInteractionLoading(){
  const [isVisible,setIsVisible]=useState(false);

  useEffect(()=>{
    let isMounted=true;
    let isInteractionActive=false;
    let isInteractionWindowOpen=false;
    let isRequestChainOpen=false;
    let pendingRequests=0;
    let pendingOperations=0;
    let shownAt=0;
    let interactionWindowTimeout=null;
    let loadingDelayTimeout=null;
    let localTimeout=null;
    let hideTimeout=null;
    let requestGraceTimeout=null;
    let maximumTimeout=null;

    const clearTimer=timer=>{
      if(timer!==null)clearTimeout(timer);
    };
    const hide=()=>{
      isInteractionActive=false;
      isInteractionWindowOpen=false;
      isRequestChainOpen=false;
      pendingRequests=0;
      pendingOperations=0;
      clearTimer(interactionWindowTimeout);
      clearTimer(loadingDelayTimeout);
      clearTimer(localTimeout);
      clearTimer(hideTimeout);
      clearTimer(requestGraceTimeout);
      clearTimer(maximumTimeout);
      interactionWindowTimeout=null;
      loadingDelayTimeout=null;
      localTimeout=null;
      hideTimeout=null;
      requestGraceTimeout=null;
      maximumTimeout=null;
      if(isMounted)setIsVisible(false);
    };
    const scheduleHide=delay=>{
      clearTimer(hideTimeout);
      const minimumRemaining=Math.max(0,GLOBAL_LOADING_MIN_MS-(Date.now()-shownAt));
      hideTimeout=setTimeout(hide,Math.max(delay,minimumRemaining));
    };
    const finishRequest=()=>{
      if(!isInteractionActive)return;
      pendingRequests=Math.max(0,pendingRequests-1);
      if(pendingRequests!==0||pendingOperations!==0)return;
      isRequestChainOpen=true;
      clearTimer(requestGraceTimeout);
      requestGraceTimeout=setTimeout(()=>{
        isRequestChainOpen=false;
      },GLOBAL_LOADING_REQUEST_GRACE_MS);
      scheduleHide(GLOBAL_LOADING_REQUEST_GRACE_MS);
    };
    const startInteraction=isImmediate=>{
      isInteractionActive=true;
      isInteractionWindowOpen=true;
      isRequestChainOpen=false;
      shownAt=0;
      clearTimer(interactionWindowTimeout);
      clearTimer(loadingDelayTimeout);
      clearTimer(localTimeout);
      clearTimer(hideTimeout);
      clearTimer(requestGraceTimeout);
      clearTimer(maximumTimeout);
      if(isImmediate){
        shownAt=Date.now();
        if(isMounted)setIsVisible(true);
      }else{
        loadingDelayTimeout=setTimeout(()=>{
          loadingDelayTimeout=null;
          if(!isInteractionActive)return;
          shownAt=Date.now();
          if(isMounted)setIsVisible(true);
        },GLOBAL_LOADING_DELAY_MS);
      }
      interactionWindowTimeout=setTimeout(()=>{
        isInteractionWindowOpen=false;
      },0);
      localTimeout=setTimeout(()=>{
        if(pendingRequests===0&&pendingOperations===0&&!isRequestChainOpen)scheduleHide(0);
      },GLOBAL_LOADING_LOCAL_MS);
      maximumTimeout=setTimeout(()=>{
        if(pendingOperations===0)hide();
      },GLOBAL_LOADING_MAX_MS);
    };
    const handleOperationStart=()=>{
      if(!isInteractionActive)startInteraction(false);
      pendingOperations++;
      clearTimer(hideTimeout);
    };
    const handleOperationEnd=()=>{
      if(!isInteractionActive)return;
      pendingOperations=Math.max(0,pendingOperations-1);
      if(pendingOperations===0&&pendingRequests===0)scheduleHide(GLOBAL_LOADING_REQUEST_GRACE_MS);
    };
    const handleClick=event=>{
      const target=event.target;
      if(!(target instanceof Element))return;
      const button=target.closest("button");
      if(!button||button.disabled||button.matches(":disabled")||button.getAttribute("aria-disabled")==="true")return;
      // Some actions (e.g. "Back" from Notifications) intentionally want an
      // instant, un-blocked transition: show whatever's already known right
      // away and let the destination quietly refresh in the background,
      // rather than covering the screen with "PairUp is loading" while it does.
      if(button.dataset.loadingSkip==="true")return;
      if(pendingOperations>0){
        isInteractionWindowOpen=true;
        clearTimer(interactionWindowTimeout);
        clearTimer(hideTimeout);
        interactionWindowTimeout=setTimeout(()=>{
          isInteractionWindowOpen=false;
        },0);
        return;
      }
      startInteraction(button.dataset.loadingImmediate==="true");
    };

    const originalFetch=window.fetch;
    let wrappedFetch=null;
    if(typeof originalFetch==="function"&&!originalFetch.__pairupGlobalLoadingWrapper){
      wrappedFetch=function(...args){
        const shouldTrack=isInteractionActive&&(isInteractionWindowOpen||isRequestChainOpen);
        if(!shouldTrack)return originalFetch.apply(this,args);
        pendingRequests++;
        clearTimer(hideTimeout);
        let request;
        try{
          request=originalFetch.apply(this,args);
        }catch(error){
          finishRequest();
          throw error;
        }
        return Promise.resolve(request).finally(finishRequest);
      };
      wrappedFetch.__pairupGlobalLoadingWrapper=true;
      window.fetch=wrappedFetch;
    }

    document.addEventListener("click",handleClick,true);
    window.addEventListener(GLOBAL_LOADING_OPERATION_START_EVENT,handleOperationStart);
    window.addEventListener(GLOBAL_LOADING_OPERATION_END_EVENT,handleOperationEnd);
    return ()=>{
      isMounted=false;
      document.removeEventListener("click",handleClick,true);
      window.removeEventListener(GLOBAL_LOADING_OPERATION_START_EVENT,handleOperationStart);
      window.removeEventListener(GLOBAL_LOADING_OPERATION_END_EVENT,handleOperationEnd);
      hide();
      if(wrappedFetch&&window.fetch===wrappedFetch)window.fetch=originalFetch;
    };
  },[]);

  if(!isVisible)return null;
  return(
    <div role="status" aria-live="polite" aria-busy="true" style={{position:"fixed",inset:0,zIndex:10000,pointerEvents:"auto",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,background:"rgba(232,237,247,.96)",color:"var(--color-text-secondary)",fontFamily:FONT}}>
      <Icon name="loader-2" size={28} style={{color:BRAND,animation:"globalInteractionLoadingSpin .8s linear infinite"}}/>
      <p style={{fontSize:13,margin:0,textAlign:"center",padding:"0 1.5rem"}}>PairUp is loading, please wait...</p>
      <style>{`@keyframes globalInteractionLoadingSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

// ── AUTH (SIGN UP / LOG IN) ───────────────────────────────────────────────────
function AuthPage({role,onAuthed,onBack}){
  const accountsKey=role==="jobseeker"?SK.ACCOUNTS_JS:SK.ACCOUNTS_EMP;
  const [mode,setMode]=useState("login"); // "login" | "signup" | "forgot" | "reset"
  const [form,setForm]=useState({email:"",password:"",confirm:""});
  const [resetForm,setResetForm]=useState({password:"",confirm:""});
  const [resetToken,setResetToken]=useState(null); // {email,token}
  const [forgotSent,setForgotSent]=useState(false);
  const [showPw,setShowPw]=useState(false);
  const [showPw2,setShowPw2]=useState(false);
  const [remember,setRemember]=useState(true);
  const [errors,setErrors]=useState({});
  const [notice,setNotice]=useState("");
  const [busy,setBusy]=useState(false);
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const MAX_ATTEMPTS=5, LOCK_MS=15*60*1000;

  const persistSession=async(session)=>{
    if(remember){
      await sd(SK.SESSION,{...session,expiresAt:Date.now()+7*24*60*60*1000},true);
      try{sessionStorage.removeItem(SK.SESSION);}catch(e){}
    }else{
      await sd(SK.SESSION,null,true); // ensure no stale 7-day session lingers
      try{sessionStorage.setItem(SK.SESSION,JSON.stringify(session));}catch(e){}
    }
  };

  const switchMode=(m)=>{setMode(m);setErrors({});setNotice("");};

  // ── Sign up ──────────────────────────────────────────────────────────────
  const doSignup=async()=>{
    const e={};
    if(!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/))e.email="Invalid email format";
    if(!isStrongPassword(form.password))e.password="At least 8 characters, with letters and numbers";
    if(form.confirm!==form.password)e.confirm="Passwords do not match";
    if(Object.keys(e).length){setErrors(e);return;}
    setBusy(true);
    const emailNorm=form.email.trim().toLowerCase();

    // ── Preferred path: Apps Script writes the new user straight into the Google Sheet ──
    if(await isSheetAuthConfigured()){
      const code=role==="jobseeker"?await nextCode():("CO"+gid());
      const result=await sheetSignup(role,form.email.trim(),form.password,code);
      if(!result||result.success===false){
        setBusy(false);
        const reason=result&&result.error;
        if(reason==="exists"){ setErrors({email:"Email already exists. Please log in instead."}); return; }
        const detail=result?.message||result?.raw||reason||"unknown error";
        setErrors({email:`Could not create your account (${detail}). Check the Apps Script URL/deployment in the Admin sync settings, or try again.`});
        return;
      }
      const session={role,email:form.email.trim().toLowerCase(),code:result.code||code,token:result.token||(gid()+gid())};
      await persistSession(session);
      setBusy(false);
      onAuthed(session);
      return;
    }

    // ── Fallback: local-only demo mode (no Apps Script URL configured) ──
    const accounts=(await ld(accountsKey,true))||[];
    if(accounts.find(a=>a.email.toLowerCase()===emailNorm)){
      setBusy(false);
      setErrors({email:"Email already exists. Please log in instead."});
      return;
    }
    const code=role==="jobseeker"?await nextCode():("CO"+gid());
    const passwordHash=await hashPassword(form.password);
    const account={email:form.email.trim(),passwordHash,code,createdAt:new Date().toISOString(),failedAttempts:0,lockedUntil:null,active:true};
    await sd(accountsKey,[...accounts,account],true);
    const session={role,email:account.email,code,token:gid()+gid()};
    await persistSession(session);
    setBusy(false);
    onAuthed(session);
  };

  // ── Log in ───────────────────────────────────────────────────────────────
  const doLogin=async()=>{
    const e={};
    if(!form.email.trim())e.email="Required";
    if(!form.password)e.password="Required";
    if(Object.keys(e).length){setErrors(e);return;}
    setBusy(true);

    // ── Preferred path: Apps Script reads the Google Sheet, finds the email, checks the password ──
    if(await isSheetAuthConfigured()){
      const result=await sheetLogin(role,form.email.trim(),form.password);
      setBusy(false);
      if(!result||result.success===false){
        const reason=result&&result.error;
        if(reason==="not_found"){ setErrors({email:"This email is not registered. Please sign up first."}); return; }
        if(reason==="wrong_password"){ setErrors({password:"Incorrect password."}); return; }
        if(reason==="locked"){ setErrors({password:"Account is temporarily locked due to too many failed attempts. Try again later."}); return; }
        if(reason==="inactive"){ setErrors({password:"This account has been deactivated."}); return; }
        // Any other failure (network issue, misconfigured/undeployed Apps Script, server error,
        // unexpected response, etc.) — always show something concrete instead of failing silently.
        const detail=result?.message||result?.raw||reason||"unknown error";
        setErrors({password:`Could not log you in (${detail}). Check the Apps Script URL/deployment in the Admin sync settings, or try again.`});
        return;
      }
      const session={role,email:form.email.trim().toLowerCase(),code:result.code,token:result.token||(gid()+gid())};
      await persistSession(session);
      onAuthed(session);
      return;
    }

    // ── Fallback: local-only demo mode (no Apps Script URL configured) ──
    const accounts=(await ld(accountsKey,true))||[];
    const emailNorm=form.email.trim().toLowerCase();
    const idx=accounts.findIndex(a=>a.email.toLowerCase()===emailNorm);
    if(idx===-1){
      setBusy(false);
      setErrors({email:"This email is not registered."});
      return;
    }
    const account=accounts[idx];
    if(account.lockedUntil&&account.lockedUntil>Date.now()){
      setBusy(false);
      const mins=Math.ceil((account.lockedUntil-Date.now())/60000);
      setErrors({password:`Account is temporarily locked due to too many failed attempts. Try again in ${mins} minute${mins!==1?"s":""}.`});
      return;
    }
    const ok=await verifyPassword(form.password,account.passwordHash);
    if(!ok){
      const updated=[...accounts];
      const attempts=(account.failedAttempts||0)+1;
      updated[idx]={...account,failedAttempts:attempts,lockedUntil:attempts>=MAX_ATTEMPTS?Date.now()+LOCK_MS:null};
      await sd(accountsKey,updated,true);
      setBusy(false);
      setErrors({password:attempts>=MAX_ATTEMPTS?`Too many failed attempts. Account locked for 15 minutes.`:"Incorrect password."});
      return;
    }
    if(account.active===false){
      setBusy(false);
      setErrors({password:"This account has been deactivated."});
      return;
    }
    const updated=[...accounts];
    updated[idx]={...account,failedAttempts:0,lockedUntil:null};
    await sd(accountsKey,updated,true);
    const session={role,email:account.email,code:account.code,token:gid()+gid()};
    await persistSession(session);
    setBusy(false);
    onAuthed(session);
  };

  // ── Sign in with Google (matches an existing pairup account by email) ──────
  // ── Forgot / reset password ─────────────────────────────────────────────
  const doForgot=async()=>{
    if(!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)){setErrors({email:"Invalid email format"});return;}
    setBusy(true);
    const accounts=(await ld(accountsKey,true))||[];
    const emailNorm=form.email.trim().toLowerCase();
    const idx=accounts.findIndex(a=>a.email.toLowerCase()===emailNorm);
    let token=null;
    if(idx!==-1){
      token=gid()+gid();
      const updated=[...accounts];
      updated[idx]={...accounts[idx],resetToken:token,resetExpiresAt:Date.now()+30*60*1000};
      await sd(accountsKey,updated,true);
    }
    // Always the same message, whether or not the email exists (avoids account enumeration)
    setResetToken({email:form.email.trim(),token}); // token may be null if email wasn't found
    setForgotSent(true);
    setBusy(false);
  };

  const doReset=async()=>{
    const e={};
    if(!isStrongPassword(resetForm.password))e.password="At least 8 characters, with letters and numbers";
    if(resetForm.confirm!==resetForm.password)e.confirm="Passwords do not match";
    if(Object.keys(e).length){setErrors(e);return;}
    setBusy(true);
    const accounts=(await ld(accountsKey,true))||[];
    const idx=accounts.findIndex(a=>a.email.toLowerCase()===(resetToken?.email||"").toLowerCase()
      && a.resetToken && resetToken?.token && a.resetToken===resetToken.token
      && a.resetExpiresAt && a.resetExpiresAt>Date.now());
    if(idx===-1){
      setBusy(false);
      setErrors({password:"This reset link is invalid or has expired. Please request a new one."});
      return;
    }
    const passwordHash=await hashPassword(resetForm.password);
    const updated=[...accounts];
    updated[idx]={...accounts[idx],passwordHash,resetToken:null,resetExpiresAt:null,failedAttempts:0,lockedUntil:null};
    await sd(accountsKey,updated,true);
    setBusy(false);
    setNotice("Your password has been reset. Please log in.");
    setForm({email:resetToken?.email||"",password:"",confirm:""});
    setResetToken(null);setForgotSent(false);
    switchMode("login");
    setNotice("Your password has been reset. Please log in.");
  };

  const submit=mode==="signup"?doSignup:mode==="forgot"?doForgot:mode==="reset"?doReset:doLogin;
  const onKey=e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } };
  const eyeBtn=(shown,toggle)=>(
    <button type="button" onClick={toggle} tabIndex={-1} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"var(--color-text-secondary)",padding:4,display:"flex"}}>
      <Icon name={shown?"eye-off":"eye"} size={16}/>
    </button>
  );

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"2rem",fontFamily:FONT,background:"var(--color-background-tertiary)"}}>
      <div style={{width:"100%",maxWidth:440}}>
        <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontSize:13,fontWeight:700,fontFamily:FONT,display:"flex",alignItems:"center",gap:6,marginBottom:"1.25rem"}}><Icon name="arrow-left" size={14}/>Back</button>
        <Card>
          <form onSubmit={e=>{e.preventDefault();submit();}}>
            {mode!=="reset"&&<h2 style={{fontSize:20,fontWeight:800,margin:"0 0 10px",display:"flex",alignItems:"center",gap:8,color:"var(--color-text-primary)"}}>
              Welcome to <span style={{color:BRAND,fontWeight:800,letterSpacing:-0.5}}><span style={{opacity:.45,fontWeight:400}}>pair</span>up</span>
            </h2>}

            {mode==="login"&&<>
              <p style={{fontSize:12.5,color:"var(--color-text-secondary)",lineHeight:1.6,margin:"0 0 1.25rem"}}>By signing in, you agree to pairup's <a href="#" onClick={ev=>ev.preventDefault()} style={{color:BRAND}}>Terms &amp; Conditions</a> and <a href="#" onClick={ev=>ev.preventDefault()} style={{color:BRAND}}>Privacy Policy</a> in relation to your privacy information.</p>
            </>}

            {mode==="signup"&&<p style={{fontSize:13,color:"var(--color-text-secondary)",margin:"0 0 1.25rem"}}>{role==="jobseeker"?"One account per email address.":"One account represents one company."}</p>}

            {notice&&mode!=="reset"&&!forgotSent&&<div style={{background:BRAND_LIGHT,color:BRAND,fontSize:12,borderRadius:8,padding:"10px 12px",marginBottom:"1rem"}}>{notice}</div>}

            {(mode==="login"||mode==="signup")&&<>
              <F label="Email" error={errors.email} required><input style={inp} type="email" value={form.email} onChange={e=>sf("email",e.target.value)} onKeyDown={onKey} placeholder="Email"/></F>
              <F label={<span style={{display:"flex",justifyContent:"space-between",width:"100%"}}><span>Password <span style={{color:"#E24B4A"}}>*</span></span>{mode==="login"&&<button type="button" onClick={()=>{switchMode("forgot");setForgotSent(false);}} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontSize:12,fontWeight:700,fontFamily:FONT,padding:0}}>Forgot password?</button>}</span>} error={errors.password} noAsterisk>
                <div style={{position:"relative"}}>
                  <input style={{...inp,paddingRight:36}} type={showPw?"text":"password"} value={form.password} onChange={e=>sf("password",e.target.value)} onKeyDown={onKey} placeholder="Password"/>
                  {eyeBtn(showPw,()=>setShowPw(v=>!v))}
                </div>
              </F>
              {mode==="signup"&&<F label="Confirm Password" error={errors.confirm} required>
                <div style={{position:"relative"}}>
                  <input style={{...inp,paddingRight:36}} type={showPw2?"text":"password"} value={form.confirm} onChange={e=>sf("confirm",e.target.value)} onKeyDown={onKey} placeholder="Confirm Password"/>
                  {eyeBtn(showPw2,()=>setShowPw2(v=>!v))}
                </div>
              </F>}
              <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--color-text-primary)",cursor:"pointer",margin:"4px 0 4px"}}>
                <input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)} style={{width:16,height:16,accentColor:BRAND}}/>
                Remember me for 7 days
              </label>
              <Btn onClick={submit} disabled={busy} style={{width:"100%",justifyContent:"center",padding:"13px",marginTop:8,fontSize:14}}>{busy?"Please wait…":(mode==="signup"?"Sign Up":"Sign In with Email")}</Btn>
              <p style={{fontSize:13,color:"var(--color-text-primary)",textAlign:"center",marginTop:16,marginBottom:0}}>
                {mode==="login"
                  ?<>Do not have an account? <button type="button" onClick={()=>switchMode("signup")} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontWeight:700,fontFamily:FONT,fontSize:13,padding:0}}>Sign up now!</button></>
                  :<>Already have an account? <button type="button" onClick={()=>switchMode("login")} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontWeight:700,fontFamily:FONT,fontSize:13,padding:0}}>Log in</button></>}
              </p>
            </>}

            {mode==="forgot"&&<>
              {!forgotSent?(<>
                <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:"0 0 1rem"}}>Enter your email and we'll help you reset your password.</p>
                <F label="Email" error={errors.email} required><input style={inp} type="email" value={form.email} onChange={e=>sf("email",e.target.value)} onKeyDown={onKey} placeholder="Email"/></F>
                <Btn onClick={submit} disabled={busy} style={{width:"100%",justifyContent:"center",padding:"13px",marginTop:6}}>{busy?"Please wait…":"Send reset instructions"}</Btn>
              </>):(<>
                <div style={{background:BRAND_LIGHT,color:BRAND,borderRadius:10,padding:"1rem",fontSize:13,lineHeight:1.6,marginBottom:"1rem"}}>If an account with that email exists, password reset instructions have been sent.</div>
                <div style={{background:"#FFF7E6",border:"1px solid #FFE1A8",borderRadius:10,padding:"1rem",fontSize:12,lineHeight:1.6,color:"#7A5B00"}}>
                  <strong>Demo mode:</strong> no email service is connected here, so instead of emailing the link, you can continue directly.
                  <button type="button" onClick={()=>switchMode("reset")} style={{display:"block",marginTop:8,background:BRAND,color:"#fff",border:"none",borderRadius:8,padding:"9px 14px",cursor:"pointer",fontWeight:700,fontFamily:FONT,fontSize:12}}>Continue to reset password →</button>
                </div>
              </>)}
              <p style={{fontSize:13,color:"var(--color-text-primary)",textAlign:"center",marginTop:16,marginBottom:0}}>
                <button type="button" onClick={()=>{switchMode("login");setForgotSent(false);}} style={{background:"none",border:"none",cursor:"pointer",color:BRAND,fontWeight:700,fontFamily:FONT,fontSize:13,padding:0}}>← Back to log in</button>
              </p>
            </>}

            {mode==="reset"&&<>
              <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:"0 0 1rem"}}>Choose a new password for your account.</p>
              <F label="New Password" error={errors.password} required>
                <div style={{position:"relative"}}>
                  <input style={{...inp,paddingRight:36}} type={showPw?"text":"password"} value={resetForm.password} onChange={e=>setResetForm(f=>({...f,password:e.target.value}))} onKeyDown={onKey} placeholder="New password"/>
                  {eyeBtn(showPw,()=>setShowPw(v=>!v))}
                </div>
              </F>
              <F label="Confirm New Password" error={errors.confirm} required>
                <div style={{position:"relative"}}>
                  <input style={{...inp,paddingRight:36}} type={showPw2?"text":"password"} value={resetForm.confirm} onChange={e=>setResetForm(f=>({...f,confirm:e.target.value}))} onKeyDown={onKey} placeholder="Confirm new password"/>
                  {eyeBtn(showPw2,()=>setShowPw2(v=>!v))}
                </div>
              </F>
              <Btn onClick={submit} disabled={busy} style={{width:"100%",justifyContent:"center",padding:"13px",marginTop:6}}>{busy?"Please wait…":"Reset password"}</Btn>
            </>}
          </form>
        </Card>
      </div>
    </div>
  );
}

// ── EMPLOYER COMPANY PROFILE (required once per employer account) ────────────
function CompanyProfilePage({session,onSaved,existing}){
  const blank={name:"",industry:"",taxCode:"",address:"",intro:"",website:"",teamSize:"",contactPerson:"",location:"",customLocation:""};
  const existingLocationIsCustom=!!existing?.location&&!LOCATIONS.includes(existing.location);
  const [form,setForm]=useState(existing?{
    name:existing.name||"",industry:existing.industry||"",taxCode:existing.taxCode||"",address:existing.address||"",
    intro:existing.intro||"",website:existing.website||"",teamSize:existing.teamSize||"",
    contactPerson:existing.contactPerson||"",
    location:existingLocationIsCustom?"Others":(existing.location||""),
    customLocation:existingLocationIsCustom?existing.location:""
  }:blank);
  const [errors,setErrors]=useState({});
  const [saving,setSaving]=useState(false);
  const s=(k,v)=>setForm(f=>({...f,[k]:v}));

  const validate=()=>{
    const e={};
    if(!form.name.trim())e.name="Required";
    if(!form.industry)e.industry="Required";
    if(!form.taxCode.trim())e.taxCode="Required";
    if(!form.contactPerson.trim())e.contactPerson="Required";
    if(!form.location)e.location="Select a location";
    else if(form.location==="Others"&&!form.customLocation.trim())e.location="Please enter your location";
    if(!form.address.trim())e.address="Required";
    if(!form.intro.trim())e.intro="Required";
    if(!form.website.trim())e.website="Required";
    if(!form.teamSize)e.teamSize="Required";
    return e;
  };

  const submit=async()=>{
    const e=validate();if(Object.keys(e).length){setErrors(e);return;}
    setSaving(true);
    const finalLocation=form.location==="Others"?form.customLocation.trim():form.location;
    const company={
      name:form.name,industry:form.industry,taxCode:form.taxCode,address:form.address,intro:form.intro,
      website:form.website,teamSize:form.teamSize,contactPerson:form.contactPerson,location:finalLocation,
      code:session.code,email:session.email,createdAt:new Date().toISOString()
    };
    await saveOne(SK.COMPANIES,company,"code");
    setSaving(false);
    onSaved(company);
  };

  return(
    <div style={{maxWidth:680,margin:"2rem auto",padding:"0 1rem 4rem",fontFamily:FONT}}>
      <div style={{marginBottom:"1.5rem"}}>
        <h1 style={{fontSize:24,fontWeight:800,margin:"0 0 6px",color:BRAND}}>Tell us about your company</h1>
        <p style={{color:"var(--color-text-secondary)",fontSize:13,margin:0}}>This is required before you can post jobs. Each account represents one company. All fields are required.</p>
      </div>
      <Card>
        <SH icon="building" title="Company Information"/>
        <F label="Company name" error={errors.name} required><input style={inp} value={form.name} onChange={e=>s("name",e.target.value)}/></F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Industry" error={errors.industry} required><select style={inp} value={form.industry} onChange={e=>s("industry",e.target.value)}><option value="">-- Select --</option>{INDUSTRIES.map(i=><option key={i}>{i}</option>)}</select></F>
          <F label="Contact person" error={errors.contactPerson} required hint="Used to prefill your job posts and contact requests"><input style={inp} value={form.contactPerson} onChange={e=>s("contactPerson",e.target.value)} placeholder="e.g. Jane Doe, HR Manager"/></F>
        </div>
        <F label="Location" error={errors.location} required>
          <SingleLocationPicker value={form.location} customValue={form.customLocation} onSelect={v=>s("location",v)} onCustomChange={v=>s("customLocation",v)}/>
        </F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
          <F label="Tax code" error={errors.taxCode} required><input style={inp} value={form.taxCode} onChange={e=>s("taxCode",e.target.value)}/></F>
          <F label="Company website" error={errors.website} required><input style={inp} value={form.website} onChange={e=>s("website",e.target.value)} placeholder="https://…"/></F>
        </div>
        <F label="Company address" error={errors.address} required><input style={inp} value={form.address} onChange={e=>s("address",e.target.value)}/></F>
        <F label="Number of employees" error={errors.teamSize} required><select style={inp} value={form.teamSize} onChange={e=>s("teamSize",e.target.value)}><option value="">-- Select --</option>{COMPANY_SIZES.map(sz=><option key={sz}>{sz}</option>)}</select></F>
        <F label="Company overview" error={errors.intro} required hint="A short introduction about your company"><textarea style={{...inp,minHeight:100}} value={form.intro} onChange={e=>s("intro",e.target.value)}/></F>
      </Card>
      <Btn onClick={submit} disabled={saving} data-loading-immediate="true" style={{width:"100%",justifyContent:"center",padding:"13px",opacity:saving?0.7:1}}>{saving?"Saving...":"Save and continue →"}</Btn>
    </div>
  );
}

// ── SYNC SETTINGS (Google Sheets bridge URL) ──────────────────────────────────
function SyncSettingsModal({onClose}){
  const [url,setUrl]=useState("");
  const [saved,setSaved]=useState(false);
  const [testing,setTesting]=useState(false);
  const [testResults,setTestResults]=useState(null); // [{sheet, ok, message}]
  const [testEmail,setTestEmail]=useState("");
  const [emailTesting,setEmailTesting]=useState(false);
  const [emailResult,setEmailResult]=useState(null); // {ok, message}
  useEffect(()=>{
    ld(GSHEET_URL_KEY,true).then(u=>setUrl(u||""));
  },[]);
  const save=async()=>{
    await sd(GSHEET_URL_KEY,url.trim(),true);
    setSaved(true);setTimeout(()=>setSaved(false),1800);
  };
  const checkOneSheet=async(activeUrl,sheetName)=>{
    try{
      const res=await fetch(activeUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"list",sheet:sheetName})});
      const text=await res.text();
      let data;
      try{ data=JSON.parse(text); }
      catch(e){ return {sheet:sheetName,ok:false,message:"Didn't return JSON (got HTML/other) — Web App access likely isn't set to \"Anyone\"."}; }
      if(!data||data.success===false) return {sheet:sheetName,ok:false,message:`Error: ${data?.error||"unknown"}${data?.message?" — "+data.message:""}`};
      if(!Array.isArray(data.rows)) return {sheet:sheetName,ok:false,message:'No "rows" array in response — OUTDATED deployment. Redeploy: Deploy → Manage deployments → Edit → New version → Deploy.'};
      return {sheet:sheetName,ok:true,message:`${data.rows.length} row(s)`};
    }catch(e){ return {sheet:sheetName,ok:false,message:"Network error — could not reach this URL at all."}; }
  };
  const testConnection=async()=>{
    setTesting(true);setTestResults(null);
    const activeUrl=url.trim()||DEFAULT_GSHEET_URL;
    const sheetNames=[...new Set(Object.values(SHEET_MAP).map(m=>m.sheet))];
    const results=await Promise.all(sheetNames.map(name=>checkOneSheet(activeUrl,name)));
    setTestResults(results);
    setTesting(false);
  };
  const sendTestEmail=async()=>{
    if(!testEmail.trim())return;
    setEmailTesting(true);setEmailResult(null);
    try{
      const activeUrl=url.trim()||DEFAULT_GSHEET_URL;
      // Unlike the real send_email calls in the app (fire-and-forget, mode:"no-cors",
      // so failures are invisible), this reads the actual JSON response so we can
      // tell whether MailApp is actually authorized/working.
      const res=await fetch(activeUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"send_email",to:testEmail.trim(),subject:"pairup test email",body:"If you received this, email sending from Apps Script is working correctly.",immediate:true})});
      const text=await res.text();
      let data;
      try{ data=JSON.parse(text); }
      catch(e){ setEmailResult({ok:false,message:"Didn't return JSON — outdated deployment or wrong URL."}); setEmailTesting(false); return; }
      if(!data||data.success===false){
        setEmailResult({ok:false,message:`Apps Script error: ${data?.error||"unknown"}${data?.message?" — "+data.message:""}. This is usually because MailApp hasn't been authorized yet — in the Apps Script editor, open Code.gs, pick any function in the dropdown, click Run once, and approve the Gmail permission when prompted.`});
      }else{
        setEmailResult({ok:true,message:"Request accepted by Apps Script — check the inbox (and spam folder) of the test address."});
      }
    }catch(e){
      setEmailResult({ok:false,message:"Network error — could not reach this URL at all."});
    }
    setEmailTesting(false);
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,30,80,0.45)",zIndex:600,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:520,padding:"1.75rem",fontFamily:FONT}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
          <h3 style={{fontSize:15,fontWeight:800,margin:0,color:BRAND}}>Integrations</h3>
          <button onClick={onClose} style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",color:BRAND,width:30,height:30,borderRadius:"50%",fontSize:15,fontWeight:700}}>✕</button>
        </div>
        <p style={{fontSize:12,color:"var(--color-text-secondary)",lineHeight:1.6,margin:"0 0 1rem"}}>The app already ships with a deployed Apps Script Web App URL baked in, so sign up / log in / data sync work for every visitor out of the box — no per-browser setup needed. Only fill this in if you've deployed a <em>new</em> Apps Script URL and want to override the built-in one (e.g. after redeploying). Leave blank to keep using the built-in URL.</p>
        <F label="Web App URL override (optional)"><input style={inp} value={url} onChange={e=>setUrl(e.target.value)} placeholder={DEFAULT_GSHEET_URL}/></F>
        <p style={{fontSize:11,color:"var(--color-text-secondary)",margin:"-0.5rem 0 1rem",wordBreak:"break-all"}}>Currently active: {url.trim()||DEFAULT_GSHEET_URL}</p>
        <Btn variant="outline" onClick={testConnection} style={{width:"100%",justifyContent:"center",marginBottom:"1rem"}} disabled={testing}>{testing?"Testing…":"Test connection"}</Btn>
        {testResults&&(
          <div style={{marginBottom:"1.25rem",display:"flex",flexDirection:"column",gap:6}}>
            {testResults.map(r=>(
              <div key={r.sheet} style={{background:r.ok?"#E9F7EE":"#FFF1F0",border:`1px solid ${r.ok?"#B7E4C7":"#FFC9C6"}`,borderRadius:10,padding:"0.6rem 0.9rem",fontSize:12,color:r.ok?"#1E6B3A":"#8A2A26",lineHeight:1.5,display:"flex",gap:8}}>
                <strong style={{flexShrink:0}}>{r.sheet}:</strong><span>{r.message}</span>
              </div>
            ))}
          </div>
        )}
        <p style={{fontSize:12,color:"var(--color-text-secondary)",lineHeight:1.6,margin:"1.25rem 0 1rem"}}>Test whether Apps Script can actually send email (used for contact-request notifications to candidates). If contact-request emails aren't arriving, test here first.</p>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <input style={{...inp,flex:1}} value={testEmail} onChange={e=>setTestEmail(e.target.value)} placeholder="your-email@example.com" type="email"/>
          <Btn variant="outline" onClick={sendTestEmail} disabled={emailTesting||!testEmail.trim()} style={{whiteSpace:"nowrap"}}>{emailTesting?"Sending…":"Send test email"}</Btn>
        </div>
        {emailResult&&(
          <div style={{background:emailResult.ok?"#E9F7EE":"#FFF1F0",border:`1px solid ${emailResult.ok?"#B7E4C7":"#FFC9C6"}`,borderRadius:10,padding:"0.6rem 0.9rem",marginBottom:"1.25rem",fontSize:12,color:emailResult.ok?"#1E6B3A":"#8A2A26",lineHeight:1.5}}>{emailResult.message}</div>
        )}
        <Btn onClick={save} style={{width:"100%",justifyContent:"center"}}>{saved?"Saved ✓":"Save"}</Btn>
      </div>
    </div>
  );
}

// ── ADMIN ACCESS GATE ──────────────────────────────────────────────────────
// The password itself is never stored in this file — it's checked server-side
// via Apps Script (action:"admin_auth"), which compares against a Script
// Property only the deployer can set. Unlocking is remembered only for this
// browser tab's session (sessionStorage), so it doesn't persist across tabs
// or after the browser fully closes.
const ADMIN_UNLOCK_KEY="pairup_admin_unlocked";
function AdminGate(){
  const [unlocked,setUnlocked]=useState(()=>{
    try{ return sessionStorage.getItem(ADMIN_UNLOCK_KEY)==="1"; }catch(e){ return false; }
  });
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [busy,setBusy]=useState(false);

  const submit=async(e)=>{
    e.preventDefault();
    if(!password.trim())return;
    setBusy(true);setError("");
    try{
      const url=await getSheetUrl();
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"admin_auth",password})});
      const text=await res.text();
      let data; try{ data=JSON.parse(text); }catch(e2){ setError("Could not verify — the Apps Script deployment may be outdated.");setBusy(false);return; }
      if(data&&data.success){
        try{ sessionStorage.setItem(ADMIN_UNLOCK_KEY,"1"); }catch(e2){}
        setUnlocked(true);
      }else if(data&&data.error==="not_configured"){
        setError("No admin password has been set yet. Run setAdminPassword() once in the Apps Script editor first.");
      }else{
        setError("Incorrect password.");
      }
    }catch(e2){
      setError("Could not reach the server. Check your connection and try again.");
    }
    setBusy(false);
  };

  if(unlocked)return <AdminPage/>;

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--color-background-tertiary)",fontFamily:FONT}}>
      <form onSubmit={submit} style={{background:"#fff",borderRadius:20,padding:"2.25rem",width:"100%",maxWidth:360}}>
        <div style={{fontWeight:800,fontSize:20,letterSpacing:-1,marginBottom:4,color:BRAND}}>
          <span style={{opacity:0.45,fontWeight:400}}>pair</span><span>up</span> <span style={{opacity:.7,fontWeight:600,fontSize:13}}>· Admin</span>
        </div>
        <p style={{fontSize:13,color:"var(--color-text-secondary)",margin:"0 0 1.25rem"}}>Enter the admin password to continue.</p>
        <input autoFocus type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password" style={{...inp,marginBottom:10}}/>
        {error&&<p style={{fontSize:12,color:"#C0392B",margin:"0 0 12px"}}>{error}</p>}
        <Btn style={{width:"100%",justifyContent:"center"}} disabled={busy}>{busy?"Checking…":"Unlock"}</Btn>
      </form>
    </div>
  );
}

// ── ADMIN (talent pool & jobs moderation, #admin only) ────────────────────────
function AdminPage(){
  const [tab,setTab]=useState(()=>{
    const r=parseRoute();
    return r.page==="admin"?(Object.keys(ADMIN_SUBTABS).find(k=>ADMIN_SUBTABS[k]===r.sub)||"dashboard"):"dashboard";
  });
  const [candidates,setCandidates]=useState([]);
  const [jobs,setJobs]=useState([]);
  const [companies,setCompanies]=useState([]);

  const [loading,setLoading]=useState(true);

  const load=async()=>{
    setLoading(true);
    const [sharedData,dashboardStats]=await Promise.all([
      ldMany({c:SK.CANDIDATES,j:SK.JOBS,co:SK.COMPANIES}),
      loadDashboardStats()
    ]);
    setCandidates(sharedData.c||[]);setJobs(sharedData.j||[]);setCompanies(sharedData.co||[]);
    setStats(dashboardStats);
    setLoading(false);
  };
  useEffect(()=>{load();},[]);
  useEffect(()=>{ replaceRoute("admin",ADMIN_SUBTABS[tab]||""); },[]);

  const selectAdminTab=async destination=>{
    if(destination===tab)return;
    startGlobalLoadingOperation();
    try{
      if(destination==="candidates"){
        await sheetListMulti(["Job Seekers"],true);
        const freshCandidates=await ld(SK.CANDIDATES,true);
        setCandidates(freshCandidates||[]);
      }else if(destination==="jobs"){
        await sheetListMulti(["Jobs","Companies"],true);
        const [freshJobs,freshCompanies]=await Promise.all([
          ld(SK.JOBS,true),
          ld(SK.COMPANIES,true)
        ]);
        setJobs(freshJobs||[]);
        setCompanies(freshCompanies||[]);
      }else if(destination==="companies"){
        await sheetListMulti(["Companies"],true);
        const freshCompanies=await ld(SK.COMPANIES,true);
        setCompanies(freshCompanies||[]);
      }
      setTab(destination);
      pushRoute("admin",ADMIN_SUBTABS[destination]||"");
      await waitForReactCommit();
    }finally{
      finishGlobalLoadingOperation();
    }
  };

  const companyName=code=>companies.find(co=>co.code===code)?.name||"—";

  const deleteCandidate=async(c)=>{
    if(!window.confirm(`Delete candidate ${c.code} (${c.position||"no title"})? This permanently removes their talent pool profile. This cannot be undone.`))return;
    await deleteOne(SK.CANDIDATES,"code",c.code);
    setViewing(null);
    load();
  };

  const deleteJob=async(j)=>{
    if(!window.confirm(`Delete job ${j.code} (${j.title||"no title"})? This permanently removes the listing. This cannot be undone.`))return;
    await deleteOne(SK.JOBS,"code",j.code);
    setViewing(null);
    load();
  };

  const deleteCompany=async(c)=>{
    if(!window.confirm(`Delete company ${c.code} (${c.name||"no name"})? This permanently removes the company profile. This cannot be undone.`))return;

        <div style={{color:"#fff",fontWeight:800,fontSize:22,letterSpacing:-1.2,marginRight:"1.5rem",paddingTop:14,paddingBottom:14,whiteSpace:"nowrap"}}>

        </div>
        {[["dashboard","Dashboard","chart-bar"],["candidates","Talent Pool","users"],["jobs","Jobs","briefcase"],["companies","Companies","building"]].map(([id,label,icon])=>(
          <button key={id} onClick={()=>selectAdminTab(id)} style={{background:"none",border:"none",cursor:"pointer",color:tab===id?"#fff":"rgba(255,255,255,0.58)",fontWeight:tab===id?700:400,fontSize:13,padding:"16px 14px",borderBottom:tab===id?"2px solid #7BA7F5":"2px solid transparent",display:"flex",alignItems:"center",gap:6}}>

              <tbody>
                {companies.map((c,i)=>(
                  <tr key={c.code} style={{borderBottom:"0.5px solid var(--color-border-tertiary)",background:i%2===0?"var(--color-background-primary)":"var(--color-background-secondary)"}}>
                    <td style={{padding:"10px 12px",fontFamily:"monospace",fontWeight:700,color:BRAND}}>{c.code}</td>
                    <td style={{padding:"10px 12px",fontWeight:600}}>{c.name||"—"}</td>
                    <td style={{padding:"10px 12px"}}>{c.industry&&<Badge color="purple">{c.industry}</Badge>}</td>
                    <td style={{padding:"10px 12px"}}>{c.location||"—"}</td>
                    <td style={{padding:"10px 12px",color:"var(--color-text-secondary)"}}>{c.contactPerson||"—"}</td>
                    <td style={{padding:"10px 12px",color:"var(--color-text-secondary)"}}>{c.email||"—"}</td>
                    <td style={{padding:"10px 12px"}}>{c.teamSize||"—"}</td>
                    <td style={{padding:"10px 12px",color:"var(--color-text-secondary)"}}>{fmt(c.createdAt)}</td>
                    <td style={{padding:"10px 12px",whiteSpace:"nowrap"}}>
                      <div style={{display:"flex",gap:6}}>
                        <Btn variant="ghost" onClick={()=>setViewing({kind:"company",data:c})} style={{fontSize:11,padding:"5px 10px"}}><Icon name="eye" size={13}/></Btn>
                        <Btn variant="danger" onClick={()=>deleteCompany(c)} style={{fontSize:11,padding:"5px 10px"}}><Icon name="trash" size={13}/></Btn>
                      </div>
                    </td>
                  </tr>
                ))}
                {companies.length===0&&<tr><td colSpan={9} style={{padding:"2.5rem",textAlign:"center",color:"var(--color-text-secondary)"}}>No companies registered.</td></tr>}
              </tbody>
            </table>
          </div>
        )}
        </>
        )}
      </div>

      {/* VIEW DETAIL MODAL */}
      {viewing&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,30,80,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:"1rem"}}>
          <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:640,maxHeight:"85vh",overflow:"auto",padding:"1.75rem"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.25rem"}}>
              <h3 style={{fontSize:16,fontWeight:800,margin:0,color:BRAND}}>{viewing.kind==="candidate"?`Candidate ${viewing.data.code}`:viewing.kind==="company"?`Company ${viewing.data.code}`:`Job ${viewing.data.code}`}</h3>
              <button onClick={()=>setViewing(null)} style={{background:BRAND_LIGHT,border:"none",cursor:"pointer",color:BRAND,width:30,height:30,borderRadius:"50%",fontSize:15,fontWeight:700}}>✕</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 20px"}}>
              {Object.entries(viewing.data).filter(([k])=>!["recruitmentProcess","emailSettings"].includes(k)).map(([k,v])=>(
                <div key={k} style={{borderBottom:"0.5px solid var(--color-border-tertiary)",paddingBottom:8}}>
                  <p style={{fontSize:10,fontWeight:800,color:BRAND_DIM,textTransform:"uppercase",letterSpacing:0.6,margin:"0 0 3px"}}>{k}</p>

      {showSync&&<SyncSettingsModal onClose={()=>setShowSync(false)}/>}
    </div>
  );
}
